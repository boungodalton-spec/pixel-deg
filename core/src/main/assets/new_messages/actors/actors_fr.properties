#nouveaux buffs
actors.buffs.thunderimbue.name=imprégné de foudre
actors.buffs.thunderimbue.desc=Tu as gagné le pouvoir de la foudre et peux abattre des éclairs !\n\nToutes tes attaques physiques généreront des éclairs infligeant des dégâts supplémentaires aux ennemis, et tu es immunisé aux étincelles électriques.\n\nTours restants : %s.

actors.buffs.evasivemove.name=mouvement évasif
actors.buffs.evasivemove.desc=Tu es devenu assez agile pour anticiper et esquiver toutes les attaques de tes ennemis !\n\nTours restants : %s.

actors.buffs.enduring.name=endurant
actors.buffs.enduring.desc=Tu résistes à une attaque mortelle avec une incroyable Vigueur. Tant que tu endures, tu ne peux pas descendre en dessous de 1 PV.\n\nTours restants : %s.

actors.buffs.enhancedringscombo.name=anneau amélioré
actors.buffs.enhancedringscombo.desc=L'attaque du Combattant a stimulé le pouvoir de l'anneau et l'a brièvement amélioré. L'amélioration de +%2$s durera les _%1$d_ prochains tours.

actors.hero.talent$quickfollowupcooldown.name=récupération : enchaînement rapide
actors.hero.talent$quickfollowupcooldown.desc=Tu as récemment utilisé ce talent, et dois attendre avant de le réutiliser.\n\nTours restants : %s.

actors.hero.talent$maxragecooldown.name=récupération : rage maximale
actors.hero.talent$maxragecooldown.desc=Tu as récemment utilisé ce talent, et dois attendre avant de le réutiliser.\n\nTours restants : %s.

actors.hero.talent$chasecooldown.name=récupération : poursuite
actors.hero.talent$chasecooldown.desc=Tu as récemment utilisé ce talent, et dois attendre avant de le réutiliser.\n\nTours restants : %s.

actors.hero.talent$chaincooldown.name=récupération : dissimulation en chaîne
actors.hero.talent$chaincooldown.desc=Tu as récemment utilisé ce talent, et dois attendre avant de le réutiliser.\n\nTours restants : %s.

actors.hero.talent$lethalcooldown.name=récupération : embuscade mortelle
actors.hero.talent$lethalcooldown.desc=Tu as récemment utilisé ce talent, et dois attendre avant de le réutiliser.\n\nTours restants : %s.

actors.buffs.magicalcombo.name=combo magique
actors.buffs.magicalcombo.action_name=combo magique
actors.buffs.magicalcombo.combo=%d coups !
actors.buffs.magicalcombo.bad_target=Tu dois cibler un ennemi à portée d'attaque.
actors.buffs.magicalcombo.prompt=Choisis une cible à attaquer.
actors.buffs.magicalcombo.desc=En tant que mage de combat, tu accumules un type spécial de magie à chaque attaque réussie. Chaque attaque augmente ta série magique de un. Cependant, si tu ne réussis pas d'attaque pendant un moment, ta série magique retombe à zéro.\n\nLorsque tu démarres une chaîne magique, tu peux utiliser des mouvements spéciaux qui touchent toujours, et la puissance du mouvement spécial augmente selon ton niveau de chaîne magique actuel. Certains mouvements spéciaux peuvent être débloqués en augmentant tes niveaux de talent.\n\nCoups du combo magique actuel : %1$d.\n\nTours restants : %2$s.
actors.buffs.magicalcombo$combomove.blast_desc=_Niv 1 : Onde de Choc Magique_ frappe les ennemis pour 60%% de dégâts, libérant une explosion de magie condensée qui les repousse de _%d_ (1+Combo*50%%) cases.
actors.buffs.magicalcombo$combomove.stab_desc=_Niv 1 : Estocade_ est une attaque rapide qui ne coûte pas de tour et attaque un ennemi pour _%d%%_ (Combo*10%%) dégâts.
actors.buffs.magicalcombo$combomove.mana_amp_desc=_Niv 2 : Amplification Magique_ frappe les ennemis pour 60%% de dégâts, raffinant les énergies condensées pour ajouter un bonus de _+%2$d_ (1+Combo*50%%, jusqu'à un maximum de _+%3$d_) à tes _%1$d_ (Niveau de Talent) prochains tirs de baguette.
actors.buffs.magicalcombo$combomove.emmit_desc=_Niv 2 : Radiation Magique_ irradie de l'énergie condensée dans une zone conique d'un angle de 30 degrés et d'un rayon de _%1$d_ (Combo) cases, infligeant _10 à 20_ dégâts et gagnant une quantité proportionnelle de recharge d'artefact selon le nombre d'ennemis touchés.
actors.buffs.magicalcombo$combomove.unleash_desc=_Niv 3 : Explosion Magique_ active un effet d'_Explosion Élémentaire_ avec _%1$d%%_ (Combo*10%%) de dégâts et un rayon de _%2$d_ (3+Combo*50%%) cases.
actors.buffs.magicalcombo$combomove.power_desc=_Niv 3 : Libération Magique_ dépense toute la charge du Bâton et accorde au héros les effets d'_Adrénaline_ et de _Bénédiction_ pendant _%d_ ((Charges dépensées+Combo)*50%%) tours.

actors.buffs.magicalempower.name=amplification magique
actors.buffs.magicalempower.desc=Ta baguette a été énergisée et temporairement renforcée ! Le tir sera aussi dépensé quand un mage de combat attaque un ennemi avec son bâton.\n\nAméliorations supplémentaires : +%1$d\nTirs restants : %2$d

actors.buffs.magicalcircle.name=cercle magique
actors.buffs.magicalcircle.desc=Un cercle magique bleu s'est formé autour de toi, et ta baguette reçoit constamment de grandes quantités d'énergie magique de sa part !\n\nLe cercle est assez puissant et te transmet de l'énergie magique, mais si tu le quittes, il perdra immédiatement son pouvoir et disparaîtra.\nTours restants : %s.

actors.hero.talent$kickcooldown.name=récupération : coup de pied
actors.hero.talent$kickcooldown.desc=Tu as récemment utilisé ce talent, et dois attendre avant de le réutiliser.\n\nTours restants : %s.

actors.buffs.tackle.tackle=plaquage

actors.hero.talent$parrytracker.name=posture de parade
actors.hero.talent$parrytracker.desc=Tu es prêt à te défendre contre la prochaine attaque. La prochaine fois que tu es attaqué, tu bloqueras l'attaque et contre-attaqueras cet ennemi.

actors.buffs.fatigue.name=Fatigue
actors.buffs.fatigue.desc=Tu te sens de plus en plus fatigué et as du mal à bouger.\n\nÀ chaque fois que tu attaques physiquement un ennemi ou es touché par une attaque physique, la fatigue s'accumule, et si elle continue de s'accumuler, tu pourrais subir des effets négatifs !\n\nLa fatigue se résorbe lentement avec le temps et peut être éliminée en mangeant ou en retirant les effets néfastes.

actors.buffs.rouletteofdeath.name=Roulette de la Mort
actors.buffs.rouletteofdeath.desc=La mort de nos ennemis approche lentement...\n\nChaque fois que tu touches avec une balle, la durée de la Roulette de la Mort est prolongée et gagne 1 charge. Une fois que la charge atteint 6, la balle suivante inflige des dégâts égaux à la vie restante de l'ennemi normal.\n\nCharge actuelle : _%1$s_/6\nTours restants : _%2$s_.

actors.buffs.infinitebullet.name=Munitions infinies
actors.buffs.infinitebullet.desc=Un pouvoir mystique de magie entoure le chargeur de ton arme à feu, et tant que les munitions infinies sont maintenues, tirer avec l'arme ne consomme aucune munition.\n\nL'effet de munitions infinies dure %s tours.

actors.hero.talent$bulletsavingcooldown.name=Récupération : Balles Supplémentaires
actors.hero.talent$bulletsavingcooldown.desc=Tu as récemment utilisé ce trait, donc il faudra du temps pour le réutiliser.\n\nTours restants : %s.

actors.buffs.frostbullet.name=Tir Glacial
actors.buffs.frostbullet.desc=Tu peux maintenant charger et recharger des balles de glace, ou tirer avec une énergie glaciale jusqu'à ce que les effets s'estompent avec le temps. Les balles givrantes infligent des frissons aux ennemis, les gelant parfois.\n\nL'effet de balle givrante dure %s tours.

actors.buffs.firebullet.name=Munitions Incendiaires
actors.buffs.firebullet.desc=Tu peux maintenant charger et recharger des munitions incendiaires, ou tirer avec une explosion de flammes jusqu'à ce qu'elles perdent leur effet avec le temps. Les munitions incendiaires enflamment les ennemis, et les ennemis déjà en feu brûlent plus longtemps.\n\nL'effet de bombe incendiaire dure %s tours.

actors.buffs.electrobullet.name=Balles Électriques
actors.buffs.electrobullet.desc=Tu peux maintenant charger et recharger des munitions de foudre, ou tirer avec une charge électrique avant que les effets des munitions de foudre ne s'estompent avec le temps. La bombe de foudre électrocute l'ennemi et le paralyse brièvement, mais pas longtemps.\n\nL'effet de bombe de foudre dure %s tours.

actors.hero.talent$skillfulrunnercooldown.name=Récupération : Course Habile
actors.hero.talent$skillfulrunnercooldown.desc=Tu as récemment utilisé ce trait, donc il faudra du temps pour le réutiliser.\n\nTours restants : %s.

actors.hero.talent$intotheshadowcooldown.name=Récupération : Dans les Ombres
actors.hero.talent$intotheshadowcooldown.desc=Tu as récemment utilisé ce trait, donc il faudra du temps pour le réutiliser.\n\nTours restants : %s.

actors.buffs.cloaking.name=Dissimulation
actors.buffs.cloaking.desc=Tu t'es fondu autant que possible dans ton environnement pour que personne autour de toi ne puisse te voir. La dissimulation dure tant que tu restes immobile, mais est immédiatement retirée si tu attaques un ennemi ou te déplaces.

actors.buffs.swordaura.name=Énergie de l'Aura de l'Épée
actors.buffs.swordaura.desc=Tu es renforcé par tes attaques précédentes, stockant une partie des dégâts infligés sous forme d'énergie !\n\nQuand tu utilises l'énergie pour lancer une aura d'épée, tu peux infliger des dégâts égaux à l'énergie utilisée à tous les ennemis sur le chemin de l'aura.\n\nÉnergie stockée : _%1$d/%2$d_.\nutilisation d'énergie : _%3$d_.

actors.buffs.awakening.name=Éveil
actors.buffs.awakening.action_name=Éveil
actors.buffs.awakening.desc_on=Tu as repoussé tes limites et gagné des capacités semblables à celles d'un fantôme. Pendant l'attribution, tu gagnes une chance de coup critique supplémentaire proportionnelle à ton esquive supplémentaire, et la puissance d'attaque est réduite de moitié au lieu de doubler la vitesse d'attaque.\n\nTant que l'Éveil est actif, ton endurance continue de diminuer, rendant difficile de fonctionner longtemps. Cela te mettra à rude épreuve. Quand il te reste 1 point de vie, l'attribution est automatiquement annulée.\n\nSi tu annules l'Éveil, tu seras vulnérable aux attaques pendant un moment.
actors.buffs.awakening.desc_off=Tu peux lancer l'Éveil à tout moment. Le désactiver le met en récupération.
actors.buffs.awakening.not_prepared=L'Éveil n'est pas encore prêt !
actors.buffs.awakening$awakeningcooldown.name=Récupération : Éveil
actors.buffs.awakening$awakeningcooldown.desc=Tu as besoin de suffisamment de repos pour réutiliser l'Éveil.\n\nTours restants : %s.

### nouveaux monstres

actors.mobs.rebel.name=Chef Rebelle
actors.mobs.rebel.desc=Le Chef Rebelle est une figure du futur qui a obtenu le pouvoir de l'Amulette il y a longtemps, et c'est lui qui est derrière tout ce qui se passe dans ce donjon.\n\nIl voulait déformer le temps par un saut temporel et gouverner l'univers entier en remontant des siècles dans le passé. Pour mener à bien ce plan, un magicien nain a naturellement obtenu l'amulette et attendait que l'ancienne magie noire soit étudiée.\n\nLe magicien nain qui a réalisé la magie noire et la nécromancie se méfiait du pouvoir de l'amulette, mais alors qu'il devenait de plus en plus fasciné par le pouvoir omnipotent de l'amulette, il a commencé à être consumé par les ténèbres, et est devenu lui-même roi et a commencé à régner sur la Cité Naine.\n\nEt Yog-Zeba, qui avait un œil sur le pouvoir sombre qui a créé le Roi Nain, a créé un avatar sous la Cité Naine et a commencé à créer une armée de démons pour voler le pouvoir de l'Amulette.\n\nLe Roi Nain a combattu les démons pendant longtemps pour protéger l'Amulette, et a réussi à considérablement affaiblir le pouvoir de l'armée démoniaque et à la sceller sous la ville, mais il y a eu trop de pertes au cours de la guerre.\n\nAlors que le Roi Nain devenait progressivement corrompu par le pouvoir des ténèbres et finissait par perdre ses sens, les recherches pour les rebelles n'étaient plus possibles. Les Rebelles ont immédiatement récupéré l'amulette de l'homme affaibli, et l'amulette a donné un pouvoir formidable à l'homme qui se tient actuellement devant toi.\n\nCependant, son pouvoir n'est que proche de l'omnipotence, mais pas encore parfait, et il y aura quelques faiblesses. Peux-tu y arriver ?
actors.mobs.rebel.notice=Tu es le coupable qui détruit notre armée récemment. Je vais personnellement m'occuper de toi avec le pouvoir de cette amulette.
actors.mobs.rebel.defeated=Je n'arrive pas à y croire... J'ai... perdu… même avec ce pouvoir de l'amulette…
actors.mobs.rebel.rankings_desc=Intercepté par le Chef Rebelle
actors.mobs.rebel.telling_1=Regarde ! Voici la vraie puissance !
actors.mobs.rebel.telling_2=ha ha ha ! C'est amusant de te voir souffrir
actors.mobs.rebel.telling_3=Penses-tu honnêtement pouvoir vaincre quelqu'un ayant la même perspective que Dieu ?
actors.mobs.rebel.telling_4=ha ! Une attaque comme celle-ci n'a rien de spécial !
actors.mobs.rebel.telling_5=Je n'arrive pas à y croire... Il est impossible que je perde !
actors.mobs.rebel.cleaning=Tu ferais mieux de ne pas penser pouvoir m'échapper !
actors.mobs.rebel.no_scroll=C'est stupide. Penses-tu qu'un tour aussi simpliste fonctionnera sur moi ?

actors.mobs.soldier.name=Soldat
actors.mobs.soldier.desc=L'ennemi le plus commun parmi les Soldats Rebelles, ils évitent le combat rapproché à tout prix et ont une forte tendance à tirer sur toi à distance.

actors.mobs.swat.name=Membre des Forces Spéciales
actors.mobs.swat.sniper_desc=Une unité de combat d'élite entraînée de l'Armée Rebelle, ils évitent le combat rapproché à tout prix et ont une forte tendance à tirer sur toi à distance.\n\nActuellement, ce membre des forces spéciales porte un _Fusil de Précision Tactique_, qui tire des balles avec une très haute précision et de gros dégâts, mais a une vitesse d'attaque très lente.
actors.mobs.swat.handgun_desc=Une unité de combat d'élite entraînée de l'Armée Rebelle, ils évitent le combat rapproché à tout prix et ont une forte tendance à tirer sur toi à distance.\n\nActuellement, ce membre des forces spéciales porte un _Pistolet Tactique_ et est bien plus rapide que les autres.
actors.mobs.swat.machinegun_desc=Une unité de combat d'élite entraînée de l'Armée Rebelle, ils évitent le combat rapproché à tout prix et ont une forte tendance à tirer sur toi à distance.\n\nActuellement, ce membre des forces spéciales a une _Mitrailleuse Lourde Renforcée_, a une vitesse de déplacement très lente, tire des balles avec une faible précision et de faibles dégâts, mais a une vitesse d'attaque très rapide.

actors.mobs.researcher.name=Chercheur
actors.mobs.researcher.desc=Un employé chargé de la recherche scientifique et technologique des Rebelles, tenant une fiole remplie de liquide noir dans sa main.

actors.mobs.tank.name=Char
actors.mobs.tank.desc=Un Char Massif avec un long canon, il tirera occasionnellement un puissant coup de canon si sa cible est inaccessible ou suffisamment éloignée.
actors.mobs.tank.cannon_kill=Tu as été touché et tué par un obus de char…

actors.mobs.suppression.name=Escouade Anti-émeute
actors.mobs.suppression.desc=Ce sont des combattants envoyés pour neutraliser ceux qui s'opposent aux Rebelles. Elle essaie de rester le plus proche possible des autres membres de l'unité, et semble porter une armure très robuste.

actors.mobs.medic.name=Médecin
actors.mobs.medic.desc=Un combattant chargé de fournir un soutien médical aux forces rebelles. Ses capacités de combat sont relativement faibles, mais chaque fois qu'il attaque, il disperse des potions médicales autour de lui, soignant ses alliés.

actors.mobs.npcs.shopkeeper.talk_labs=C'est le seul endroit pour que les chercheurs fatigués dépensent leur argent.\n\nOn dirait que les gens ici gagnent beaucoup d'argent. Même vendu à un prix aussi élevé, ils l'achèteront quand même. C'est comme si les trésors d'or et d'argent ne cessaient de sortir de quelque part !\n\nHaha, je plaisante.
actors.mobs.npcs.shopkeeper.talk_ascent_shopkeeper=On dirait que tu es sur quelque chose de gros. N'importe quel marchand s'enfuirait immédiatement, mais j'ai un plan, donc ne t'inquiète pas.\n\nPourquoi ne pas dépenser un peu d'or à la place ? Je pense que tu n'as pas d'usage pour l'or pour le moment.

actors.mobs.npcs.shopkeeper.talk_prison_gunner=Si tu as besoin de quelque chose, achète tout ici.
actors.mobs.npcs.shopkeeper.talk_prison_samurai=Si tu as besoin de quelque chose, achète tout ici.
actors.mobs.npcs.shopkeeper.talk_prison_adventurer=Si tu as besoin de quelque chose, achète tout ici.
actors.mobs.npcs.shopkeeper.talk_prison_knight=Si tu as besoin de quelque chose, achète tout ici.
actors.mobs.npcs.shopkeeper.talk_prison_medic=Si tu as besoin de quelque chose, achète tout ici.
actors.mobs.npcs.shopkeeper.talk_prison_archer=Si tu as besoin de quelque chose, achète tout ici.

actors.mobs.npcs.blacksmith.intro_quest_gunner=Hé, humain !
actors.mobs.npcs.blacksmith.intro_quest_samurai=Hé, humain !
actors.mobs.npcs.blacksmith.intro_quest_adventurer=Hé, humain !
actors.mobs.npcs.blacksmith.intro_quest_knight=Hé, humain !
actors.mobs.npcs.blacksmith.intro_quest_medic=Hé, humain !
actors.mobs.npcs.blacksmith.intro_quest_archer=Hé, humain !

actors.mobs.npcs.wandmaker.intro_gunner=Oh, bienvenue, étranger ! Je sais utiliser ma magie, mais c'est la première fois que je vois quelqu'un porter une arme d'apparence aussi étrange. Si tu veux aider ce vieil homme, voici une faveur à demander.
actors.mobs.npcs.wandmaker.intro_samurai=Oh, je n'aurais jamais pensé que quelqu'un d'aussi âgé que moi verrait quelqu'un visiter un endroit pareil. Je n'en avais aucune idée ! Si tu veux aider ce vieil homme, voici une faveur à demander.
actors.mobs.npcs.wandmaker.intro_adventurer=Oh, comme c'est incroyable que des explorateurs viennent dans un endroit aussi désolé ! Si tu veux aider ce vieil homme, voici une faveur à demander.
actors.mobs.npcs.wandmaker.intro_knight=Ah, ravi de te rencontrer, chevalier ! Je n'aurais jamais pensé que ton royaume enverrait quelqu'un dans un endroit pareil. Je n'en aurais jamais rêvé ! Si tu veux aider ce vieil homme, voici une faveur à demander.
actors.mobs.npcs.wandmaker.intro_medic=Oh, ravi de te rencontrer, jeune demoiselle. Pour une raison quelconque, j'ai l'impression que tu n'appartiens pas à cette époque... Oh, désolé. Laisse tomber. Bref, voudrais-tu aider ce vieil homme en difficulté ?
actors.mobs.npcs.wandmaker.intro_archer=Oh, ravi de te rencontrer, étranger ! Je pense me rappeler avoir vu quelqu'un qui te ressemblait... Oh, laisse tomber. En fait, je suis en difficulté en ce moment, alors pourquoi n'aiderais-tu pas le vieil homme ?

### nouvelles sous-classes
###guerrier
actors.hero.herosubclass.veteran=Vétéran
actors.hero.herosubclass.veteran_short_desc=Chaque fois que le _Vétéran_ attaque un ennemi proche, il peut le plaquer et le repousser, infligeant des dégâts proportionnels à son Armure.
actors.hero.herosubclass.veteran_desc=Expérimenté sur le terrain, le vétéran est un expert des tactiques utilisant son corps. Le Vétéran peut utiliser le Plaquage immédiatement après avoir attaqué un ennemi au corps-à-corps.\n\nLe Plaquage inflige 40% de ton armure actuelle en dégâts et repousse la cible d'1 case, et tu gagnes immédiatement 1 bouclier grâce au sceau brisé du Guerrier.\n\nLes ennemis repoussés par un plaquage ne peuvent pas tomber dans une fosse.\nLe plaquage peut déclencher l'enchantement de l'arme.
###mage
actors.hero.herosubclass.wizard=Sorcier
actors.hero.herosubclass.wizard_short_desc=le _Sorcier_ peut grandement augmenter les dégâts de sa baguette pendant un court moment en lançant des sorts avec son grimoire.
actors.hero.herosubclass.wizard_desc=Le Sorcier gagne +5% de vitesse de charge supplémentaire pour ses baguettes pour chaque grimoire qu'il possède. Il gagne aussi un boost magique qui augmente les dégâts de ses baguettes de 20% pendant 5 tours après avoir lu un grimoire.
###vaurien
actors.hero.herosubclass.chaser=Traqueur
actors.hero.herosubclass.chaser_short_desc=Le _Traqueur_ peut se camoufler dans son environnement, gagnant l'invisibilité s'il attend.
actors.hero.herosubclass.chaser_desc=Le Traqueur est un expert en discrétion, se fondant dans son environnement et gagnant 5 tours d'invisibilité lorsqu'il attend. Cette capacité a un temps de récupération de 15 tours.
###chasseresse
actors.hero.herosubclass.fighter=Combattante
actors.hero.herosubclass.fighter_short_desc=La _Combattante_ gagne des dégâts d'attaque supplémentaires si elle ne manie aucune arme, et peut aussi améliorer ses compétences d'attaque via des talents.
actors.hero.herosubclass.fighter_desc=La Combattante gagne des dégâts de mêlée supplémentaires selon son niveau quand elle ne manie aucune arme.\n\nLa Combattante inflige 1 tour de _Paralysie_ quand elle attaque l'ennemi touché par son arc ou ses armes de jet si elle a un talent d'enchaînement.
###duelliste
actors.hero.herosubclass.fencer=Escrimeuse
actors.hero.herosubclass.fencer_short_desc=L'_Escrimeuse_ peut utiliser sa charge d'arme pour effectuer une ruée instantanée.
actors.hero.herosubclass.fencer_desc=L'Escrimeuse excelle dans les mouvements pris en une fraction de seconde. Elle peut dépenser 1 charge d'arme pour se ruer jusqu'à 2 cases sans dépenser de tour. La ruée peut franchir n'importe quel danger sur le chemin. Elle ne peut cependant pas se ruer par-dessus des murs ou un terrain solide.\n\nSi elle attaque un ennemi immédiatement après une ruée, son attaque touchera toujours, infligeant 10% de dégâts supplémentaires.

### nouvelles classes
actors.hero.heroclass.gunner=Tireur
actors.hero.heroclass.gunner_desc_short=Les Tireurs sont maîtres des armes à feu et peuvent _démanteler_ de l'équipement en métal liquide.
actors.hero.heroclass.gunner_desc=Les Tireurs peuvent démonter de l'équipement pour obtenir du métal liquide et un peu d'énergie alchimique, et peuvent utiliser le métal liquide pour fabriquer des armes à feu aléatoires.\n\nLes Tireurs obtiennent plus de munitions de leurs bandoulières de munitions.\n\nLe Tireur commence aussi avec un _vieux fusil d'assaut_, 5 bandoulières de munitions, une armure de tissu, une gourde en peau, et une sacoche en velours.\n\nLe Tireur commence avec les objets suivants identifiés :\n_-_ Parchemin de Rage\n_-_ Potion de Célérité\n_-_ Parchemin de Téléportation

actors.hero.heroclass.gunner_unlock=Pour débloquer le Tireur, _Modifie une arme à feu avec un Outil d'Armurier._

actors.hero.herosubclass.outlaw=Hors-la-loi
actors.hero.herosubclass.outlaw_short_desc=Un _Hors-la-loi_ ayant maîtrisé l'art de survivre en mêlée peut tirer des balles puissantes en touchant l'ennemi avec 6 balles.
actors.hero.herosubclass.outlaw_desc=Le Hors-la-loi se concentre sur le combat à chaque fois qu'une balle touche un ennemi, accumulant une charge de Roulette de la Mort. Quand la charge de Roulette de la Mort atteint 6, la balle suivante inflige des dégâts égaux à la vie restante de l'ennemi, et l'arme à feu équipée est immédiatement rechargée.\n\nLes ennemis puissants résisteront aux dégâts de mort instantanée et ne rechargeront pas leurs armes à feu pendant ce temps.
actors.hero.herosubclass.gunslinger=Cow-boy
actors.hero.herosubclass.gunslinger_short_desc=Le _Cow-boy_ est le maître des armes à feu, car il ne consomme pas de tour s'il lance une arme de jet ou tire avec une arme immédiatement après s'être déplacé, mais sa précision est grandement réduite.
actors.hero.herosubclass.gunslinger_desc=Si le Cow-boy lance une arme de jet ou tire immédiatement après s'être déplacé, cela ne consomme pas de tour, mais sa précision est réduite de 75%. Cette attaque permet une attaque surprise.
actors.hero.herosubclass.specialist=Spécialiste
actors.hero.herosubclass.specialist_short_desc=Un _Spécialiste_ compétent dans l'art de la dissimulation peut se cacher dans l'herbe haute.
actors.hero.herosubclass.specialist_desc=Le Spécialiste ne piétine pas l'herbe haute, et s'il attend dans de l'herbe qu'il a traversée quand les ennemis ne sont pas proches, il gagnera la dissimulation et sera invisible aux ennemis. De plus, tirer avec des armes à feu en étant invisible ne fera plus de bruit. La dissimulation est annulée quand tu attaques un ennemi ou te déplaces.

actors.hero.heroclass.samurai=Samouraï
actors.hero.heroclass.samurai_desc_short=Les Samouraïs maîtrisent les attaques critiques, et leurs attaques ont une chance d'infliger un coup critique.
actors.hero.heroclass.samurai_desc=En attaquant un ennemi, le samouraï a une chance d'utiliser une attaque critique et d'infliger de plus gros dégâts.\n\nLe Samouraï commence avec un Fourreau de Samouraï spécial. Utiliser le fourreau rengaine ton arme et renforce ta prochaine attaque.\n\nLe Samouraï commence aussi avec une vieille épée, trois couteaux de jet, une armure de tissu, une gourde en peau, et une sacoche en velours.\n\nLe samouraï commence avec les objets suivants identifiés :\n_-_ Parchemin d'Identification\n_-_ Potion de Force\n_-_ Parchemin de Terreur
actors.hero.heroclass.samurai_unlock=Pour débloquer le Samouraï, obtiens _un nouveau katana_.

actors.hero.herosubclass.slasher=Taillade
actors.hero.herosubclass.slasher_short_desc=La _Taillade_ peut collecter de l'énergie via ses attaques et tirer une aura d'épée sur les ennemis distants.
actors.hero.herosubclass.slasher_desc=À chaque attaque, la Taillade accumule 20% d'Énergie d'Épée en infligeant des dégâts, et utilise toute l'Énergie d'Épée accumulée pour tirer une Taillade d'Énergie, infligeant des dégâts physiques égaux à la quantité d'énergie d'épée utilisée à tous les ennemis sur le chemin.\n\nL'énergie est stockée jusqu'à 60.
actors.hero.herosubclass.master=Maître
actors.hero.herosubclass.master_short_desc=Le _Maître_ peut utiliser deux puissantes attaques de coup de pied.
actors.hero.herosubclass.master_desc=Le Maître peut utiliser une taillade en ruée pour attaquer l'ennemi en se téléportant vers un emplacement ennemi accessible tout en menant, et peut aussi spécifier un emplacement hors de son champ de vision. S'il n'y a pas d'ennemi à l'emplacement après la téléportation, il y a un temps de récupération de 100 tours.\n\nLes Maîtres pourront aussi utiliser des coups de pied standards sans dépenser de tour et avec un taux de coup critique plus élevé. Si le coup de pied ne provoque pas d'attaque critique, il a un temps de récupération de 30 tours.
actors.hero.herosubclass.slayer=Noble
actors.hero.herosubclass.slayer_short_desc=Le _Noble_ peut utiliser la Ruée pour obtenir divers effets supplémentaires.
actors.hero.herosubclass.slayer_desc=Le Noble peut utiliser la Noblesse, qui augmente ses performances d'attaque.\n\nUtiliser la Noblesse inflige 1 dégât chaque tour au héros et lui donne 1% de chance critique supplémentaire pour chaque point d'esquive supplémentaire obtenu, et lors d'une attaque critique, aucun tour n'est consommé.\n\nSi la vie tombe à 1 pendant la Noblesse, ou si elle est désactivée en cours de route, la Noblesse se désactive et un temps de récupération de 30 tours s'applique.



### nouvelles capacités
actors.hero.abilities.gunner.riot.name=Déchaînement
actors.hero.abilities.gunner.riot.short_desc=Le Tireur double le taux de tir de l'arme pendant une certaine période, lui permettant de tirer des balles dans toute la zone.
actors.hero.abilities.gunner.riot.desc=Le Tireur utilise le Déchaînement pour doubler la vitesse de tir des balles pendant 10 tours, mais les dégâts des balles sont réduits de 50%.
actors.hero.abilities.gunner.riot$riottracker.name=Déchaînement
actors.hero.abilities.gunner.riot$riottracker.desc=Le Tireur affiche un haut niveau de concentration pendant un instant, lui permettant de tirer beaucoup de balles en un instant !\n\nPendant le Déchaînement, la cadence de tir de l'arme augmente de deux fois, mais les dégâts des balles sont réduits de 50%.\n\nTours restants : %s.
actors.hero.abilities.gunner.reinforcedarmor.name=Armure Renforcée
actors.hero.abilities.gunner.reinforcedarmor.short_desc=Porter l'_Armure Renforcée_ augmente ta défense pendant un court moment.
actors.hero.abilities.gunner.reinforcedarmor.desc=Le Tireur porte une Armure Corporelle Renforcée spécialement conçue, gagnant 5 à 20 de défense supplémentaire pendant 20 tours.
actors.hero.abilities.gunner.reinforcedarmor$reinforcedarmortracker.name=Armure Renforcée
actors.hero.abilities.gunner.reinforcedarmor$reinforcedarmortracker.desc=Le Tireur a ajouté une protection supplémentaire à son armure corporelle, améliorant ses capacités défensives ! L'armure corporelle est ainsi conçue pour être solide, mais le pouvoir contenu dans le dispositif protecteur ne dure pas longtemps et finit par perdre sa capacité de protection.\n\ntours restants : %s.
actors.hero.abilities.gunner.firstaidkit.name=Trousse de Premiers Secours
actors.hero.abilities.gunner.firstaidkit.short_desc=Le Tireur peut effectuer un traitement simple en utilisant la _Trousse de Premiers Secours_.
actors.hero.abilities.gunner.firstaidkit.desc=Quand le Tireur a besoin d'un moyen de récupération, il peut utiliser une trousse de premiers secours pour récupérer 1 point de vie par tour pour un total de 20.

actors.hero.abilities.samurai.abil_kunai.name=Kunai
actors.hero.abilities.samurai.abil_kunai.short_desc=Le Samouraï peut lancer un puissant Kunai pour blesser les ennemis et les rendre vulnérables.
actors.hero.abilities.samurai.abil_kunai.desc=Le Samouraï peut lancer un kunai qui inflige des dégâts égaux à la puissance d'attaque de l'arme actuellement équipée, blessant l'ennemi touché et lui infligeant la vulnérabilité pendant 20 tours.
actors.hero.abilities.samurai.shadowblade.name=Lame d'Ombre
actors.hero.abilities.samurai.shadowblade.short_desc=Le Samouraï peut sortir la _Lame d'Ombre_ de son arme et la tenir à deux mains pour des attaques plus rapides.
actors.hero.abilities.samurai.shadowblade.desc=Le samouraï peut utiliser la Lame d'Ombre, qui lui permet d'attaquer à deux fois la vitesse d'attaque et avec des dégâts égaux à la moitié de la puissance d'attaque de l'arme actuellement équipée pendant 10 tours.\n\nTant que la Lame d'Ombre est active, il y a 50% de chance d'infliger des dégâts qui pénètrent la défense de l'ennemi lors d'une attaque.
actors.hero.abilities.samurai.shadowblade$shadowbladetracker.name=Lame d'Ombre
actors.hero.abilities.samurai.shadowblade$shadowbladetracker.desc=Le Samouraï peut maintenant retirer l'ombre de son arme, lui permettant d'attaquer à une vitesse plus rapide !\n\nTant que la Lame d'Ombre est active, la vitesse d'attaque est doublée et les dégâts réduits de 50%%. En contrepartie, en attaquant, il y a 50%% de chance d'infliger des dégâts qui pénètrent la défense de l'ennemi.\n\nTour restant : %s.
actors.hero.abilities.samurai.awake.name=Éveil
actors.hero.abilities.samurai.awake.short_desc=Le Samouraï puise dans sa force intérieure et s'_Éveille_ pendant un court moment, augmentant les dégâts physiques infligés de 1,2 fois, mais augmentant aussi les dégâts physiques reçus de 1,2 fois.
actors.hero.abilities.samurai.awake.desc=Le Samouraï peut s'Éveiller en puisant dans sa force intérieure. Pendant l'éveil, les dégâts physiques infligés augmentent de 1,2 fois, mais les dégâts physiques reçus augmentent aussi de 1,2 fois.
actors.hero.abilities.samurai.awake$awaketracker.name=Éveil
actors.hero.abilities.samurai.awake$awaketracker.desc=Le Samouraï libère son pouvoir intérieur, augmentant les dégâts physiques qu'il inflige à tous les ennemis, mais augmentant aussi les dégâts physiques qu'il subit !\n\nTours restants : %s.

### nouveaux talents

#nouveau talent guerrier
actors.hero.talent.max_health.title=Entraînement Physique
actors.hero.talent.max_health.desc=_+1 :_ La vie maximale augmente de _5_.\n\n_+2 :_ La vie maximale augmente de _10_.
actors.hero.talent.parry.title=Posture de Contre
actors.hero.talent.parry.desc=_+1 :_ Une fois tous les _70 tours_, la prochaine attaque est défendue et peut être contre-attaquée sans consommer de tour.\n\n_+2 :_ Une fois tous les _50 tours_, la prochaine attaque est défendue et peut être contre-attaquée sans consommer de tour.

actors.hero.talent.lethal_rage.title=Rage Mortelle
actors.hero.talent.lethal_rage.desc=_+1 :_ Gagne _7%_ de rage en tuant un ennemi.\n\n_+2 :_ Gagne _13%_ de rage en tuant un ennemi.\n\n_+3 :_ Gagne _20%_ de rage en tuant un ennemi.
actors.hero.talent.max_rage.title=Explosion de Rage
actors.hero.talent.max_rage.desc=_+1 :_ En atteignant la rage maximale, gagne _10%_ d'adrénaline de la quantité de rage.\n\n_+2 :_ En atteignant la rage maximale, gagne _20%_ d'adrénaline de la quantité de rage.\n\n_+3 :_ En atteignant la rage maximale, gagne _30%_ d'adrénaline de la quantité de rage.\n\nA un temps de récupération de _50 tours_.
actors.hero.talent.endurance.title=Endurance dans la Fureur
actors.hero.talent.endurance.desc=_+1 :_ Réduit le temps de récupération du sceau de _33%_ de la rage gagnée chaque fois que le Berserker gagne de la rage en étant touché.\n\n_+2 :_ Réduit le temps de récupération du sceau de _67%_ de la rage gagnée chaque fois que le Berserker gagne de la rage en étant touché.\n\n_+3 :_ Réduit le temps de récupération du sceau de _100%_ de la rage gagnée chaque fois que le Berserker gagne de la rage en étant touché.

actors.hero.talent.light_weapon.title=Armes Légères
actors.hero.talent.light_weapon.desc=_+1 :_ Pour chaque point de force au-delà de la force requise pour les armes de mêlée, la vitesse d'attaque augmente de _+5%_.\n\n_+2 :_ Pour chaque point de force au-delà de la force requise pour les armes de mêlée, la vitesse d'attaque augmente de _+10%_.\n\n_+3 :_ Pour chaque point de force au-delà de la force requise pour les armes de mêlée, la vitesse d'attaque augmente de _+15%_.
actors.hero.talent.offensive_defense.title=Défense Offensive
actors.hero.talent.offensive_defense.desc=_+1 :_ En recevant une attaque physique, il y a _33%_ de chance d'accumuler des coups consécutifs.\n\n_+2 :_ En recevant une attaque physique, il y a _67%_ de chance d'accumuler des coups consécutifs.\n\n_+3 :_ En recevant une attaque physique, il y a _100%_ de chance d'accumuler des coups consécutifs.
actors.hero.talent.skill_repeat.title=Coups de Grâce Répétés
actors.hero.talent.skill_repeat.desc=_+1 :_ En tuant un ennemi avec une _poussée_, gagne la capacité de réutiliser la poussée.\n\n_+2 :_ En plus de l'effet +1, en tuant un ennemi avec un _fracas_, gagne la capacité de réutiliser le fracas.\n\n_+3 :_ En plus de l'effet +2, en tuant un ennemi, gagne la capacité de réutiliser la poussée et le fracas.

actors.hero.talent.powerful_tackle.title=Poussée Puissante
actors.hero.talent.powerful_tackle.desc=_+1 :_ Le plaquage inflige _60%_ de la valeur d'armure actuelle en dégâts.\n\n_+2 :_ Le plaquage inflige _80%_ de la valeur d'armure actuelle en dégâts.\n\n_+3 :_ Le plaquage inflige _100%_ de la valeur d'armure actuelle en dégâts.
actors.hero.talent.mystical_tackle.title=Plaquage Mystique
actors.hero.talent.mystical_tackle.desc=_+1 :_ Le plaquage augmente la puissance des effets magiques de l'arme de _+50%_.\n\n_+2 :_ Le plaquage augmente la puissance des effets magiques de l'arme de _+100%_.\n\n_+3 :_ Le plaquage augmente la puissance des effets magiques de l'arme de _+150%_.
actors.hero.talent.delayed_grenade.title=Grenade à Explosion Différée
actors.hero.talent.delayed_grenade.desc=_+1 :_ En tuant un ennemi avec un plaquage, déclenche une explosion infligeant _5-20 dégâts_ aux cases 3x3 environnantes de l'ennemi tué.\n\n_+2 :_ En tuant un ennemi avec un plaquage, déclenche une explosion infligeant _8-30 dégâts_ aux cases 3x3 environnantes de l'ennemi tué.\n\n_+3 :_ En tuant un ennemi avec un plaquage, déclenche une explosion infligeant _10-40 dégâts_ aux cases 3x3 environnantes de l'ennemi tué.\n\nLes héros et alliés ne sont pas affectés par cette explosion.
actors.hero.talent.incapacitation.title=Incapacitation
actors.hero.talent.incapacitation.desc=_+1 :_ En plaquant, applique _2 tours_ d'_étourdissement mental_ à la cible.\n\n_+2 :_ En plus de l'effet +1, en plaquant, applique _2 tours_ d'_affaiblissement_ à la cible.\n\n_+3 :_ En plus de l'effet +2, en plaquant, applique _2 tours_ de _vulnérabilité_ à la cible.
actors.hero.talent.super_armor.title=Super Armure
actors.hero.talent.super_armor.desc=_+1 :_ Reçoit _33%_ de dégâts réduits pendant un plaquage.\n\n_+2 :_ Reçoit _67%_ de dégâts réduits pendant un plaquage.\n\n_+3 :_ Reçoit _100%_ de dégâts réduits pendant un plaquage.
actors.hero.talent.improved_tackle.title=Plaquage Amélioré
actors.hero.talent.improved_tackle.desc=_+1 :_ En plaquant, gagne _2 boucliers_ grâce à l'insigne.\n\n_+2 :_ En plus de l'effet +1, le plaquage repousse l'ennemi _1 case_ plus loin.\n\n_+3 :_ En plus de l'effet +2, peut maintenant _pousser les ennemis hors des corniches_.

#nouveau talent mage
actors.hero.talent.charge_preserve.title=Préservation de Charge
actors.hero.talent.charge_preserve.desc=_+1 :_ Il y a _5%_ de chance de ne pas consommer de charge en lançant une baguette magique.\n\n_+2 :_ Il y a _10%_ de chance de ne pas consommer de charge en lançant une baguette magique.
actors.hero.talent.faster_charger.title=Induction Électromagnétique
actors.hero.talent.faster_charger.desc=_+1 :_ Augmente la vitesse de charge de la baguette magique de _+10%_.\n\n_+2 :_ Augmente la vitesse de charge de la baguette magique de _+20%_.

actors.hero.talent.battle_magic.title=Magie de Combat
actors.hero.talent.battle_magic.desc=_+1 :_ En attaquant avec un bâton, déclenche un _Combo Magique_, permettant divers coups de grâce, et débloque les coups de grâce de _Palier 1_.\n\n_+2 :_ En plus de l'effet +1, débloque les coups de grâce de _Palier 2_ dans le Combo Magique.\n\n_+3 :_ En plus de l'effet +2, débloque les coups de grâce de _Palier 3_ dans le Combo Magique.
actors.hero.talent.magic_rush.title=Précipitation Magique
actors.hero.talent.magic_rush.desc=_+1 :_ Utiliser un parchemin charge immédiatement le bâton du mage de _1_ charge.\n\n_+2 :_ Utiliser un parchemin charge immédiatement le bâton du mage de _2_ charges.\n\n_+3 :_ Utiliser un parchemin charge immédiatement le bâton du mage de _3_ charges.
actors.hero.talent.magical_circle.title=Cercle Magique
actors.hero.talent.magical_circle.desc=_+1 :_ En gagnant un bouclier grâce au trait _Charge de Bouclier_, crée un cercle magique à l'emplacement actuel, augmentant la vitesse de charge de la baguette magique de _+100%_.\n\n_+2 :_ En plus de l'effet +1, en lançant des sorts dans le cercle magique, il y a _50% de chance_ de ne pas consommer de charge.\n\n_+3 :_ En plus des effets +1 et +2, agrandit la taille des cercles magiques créés à _3x3_.
actors.hero.talent.madness.title=Folie de la Magie Noire
actors.hero.talent.madness.desc=_+1 :_ Attaquer les ennemis a _10%_ de chance d'infliger _3 tours_ de folie.\n\n_+2 :_ Attaquer les ennemis a _20%_ de chance d'infliger _3 tours_ de folie.\n\n_+3 :_ Attaquer les ennemis a _30%_ de chance d'infliger _3 tours_ de folie.
actors.hero.talent.enhanced_mark.title=Marque Améliorée
actors.hero.talent.enhanced_mark.desc=_+1 :_ Augmente la chance et la durée des marques d'âme de _1 palier_.\n\n_+2 :_ Augmente la chance et la durée des marques d'âme de _2 paliers_.\n\n_+3 :_ Augmente la chance et la durée des marques d'âme de _3 paliers_.
actors.hero.talent.mark_of_weakness.title=Marque de Faiblesse
actors.hero.talent.mark_of_weakness.desc=_+1 :_ Les ennemis marqués d'une marque d'âme infligent _10%_ de dégâts en moins.\n\n_+2 :_ Les ennemis marqués d'une marque d'âme infligent _19%_ de dégâts en moins.\n\n_+3 :_ Les ennemis marqués d'une marque d'âme infligent _27%_ de dégâts en moins.

actors.hero.talent.spell_enhance.title=Amélioration des Sorts
actors.hero.talent.spell_enhance.desc=_+1 :_ Augmente la puissance des grimoires de _+50%_.\n\n_+2 :_ Augmente la puissance des grimoires de _+100%_.\n\n_+3 :_ Augmente la puissance des grimoires de _+150%_.
actors.hero.talent.brig_boost.title=Accélération du Bâton
actors.hero.talent.brig_boost.desc=_+1 :_ Réussir une attaque physique sur les ennemis réduit le temps de récupération du grimoire de _1 tour_.\n\n_+2 :_ Réussir une attaque physique sur les ennemis réduit le temps de récupération du grimoire de _2 tours_.\n\n_+3 :_ Réussir une attaque physique sur les ennemis réduit le temps de récupération du grimoire de _3 tours_.
actors.hero.talent.energy_remains.title=Énergie Résiduelle
actors.hero.talent.energy_remains.desc=_+1 :_ En tuant un ennemi, il y a _17% de chance_ de créer une zone éphémère accordant l'effet de _Charge_ à cet endroit.\n\n_+2 :_ En tuant un ennemi, il y a _17% de chance_ de créer une zone éphémère accordant l'effet de _Charge d'Artefact_ à cet endroit.\n\n_+3 :_ En tuant un ennemi, il y a _17% de chance_ de créer une zone éphémère accordant un effet de bouclier égal à _10% de la vie maximale du héros_ à cet endroit.\n\nCes chances ne se cumulent pas.
actors.hero.talent.magic_empower.title=Mana Débordant
actors.hero.talent.magic_empower.desc=_+1 :_ Augmente la durée des effets d'amplification de mana de _+100%_.\n\n_+2 :_ Augmente la durée des effets d'amplification de mana de _+200%_.\n\n_+3 :_ Augmente la durée des effets d'amplification de mana de _+300%_.
actors.hero.talent.second_effect.title=Second Effet
actors.hero.talent.second_effect.desc=_+1 :_ En lançant des sorts depuis le grimoire, il y a _33% de chance_ que l'effet correspondant sur le bâton du mage fusionné avec la baguette magique se déclenche aussi.\n\n_+2 :_ En lançant des sorts depuis le grimoire, il y a _67% de chance_ que l'effet correspondant sur le bâton du mage fusionné avec la baguette magique se déclenche aussi.\n\n_+3 :_ En lançant des sorts depuis le grimoire, il y a _100% de chance_ que l'effet correspondant sur le bâton du mage fusionné avec la baguette magique se déclenche aussi.
actors.hero.talent.life_energy.title=Transfert d'Énergie
actors.hero.talent.life_energy.desc=_+1 :_ En touchant des ennemis avec de la magie, restaure de la vie égale à _1x_ le nombre de cibles touchées multiplié par la charge utilisée.\n\n_+2 :_ En touchant des ennemis avec de la magie, restaure de la vie égale à _2x_ le nombre de cibles touchées multiplié par la charge utilisée.\n\n_+3 :_ En touchant des ennemis avec de la magie, restaure de la vie égale à _3x_ le nombre de cibles touchées multiplié par la charge utilisée.

#nouveau talent vaurien
actors.hero.talent.emergency_escape.title=Fuite d'Urgence
actors.hero.talent.emergency_escape.desc=_+1 :_ Quand attaqué par des ennemis, a _2%_ de chance de gagner 3 tours d'invisibilité.\n\n_+2 :_ Quand attaqué par des ennemis, a _4%_ de chance de gagner 3 tours d'invisibilité.
actors.hero.talent.movespeed_enhance.title=Foulée Rapide
actors.hero.talent.movespeed_enhance.desc=_+1 :_ La vitesse de déplacement augmente de _+10%_.\n\n_+2 :_ La vitesse de déplacement augmente de _+20%_.

actors.hero.talent.energy_draw.title=Récupération d'Énergie
actors.hero.talent.energy_draw.desc=_+1 :_ En assassinant un ennemi, il y a _33%_ de chance de restaurer 1 charge à la cape. Cela peut dépasser la charge maximale.\n\n_+2 :_ En assassinant un ennemi, il y a _67%_ de chance de restaurer 1 charge à la cape. Cela peut dépasser la charge maximale.\n\n_+3 :_ En assassinant un ennemi, il y a _100%_ de chance de restaurer 1 charge à la cape. Cela peut dépasser la charge maximale.
actors.hero.talent.perfect_assassin.title=Assassin Parfait
actors.hero.talent.perfect_assassin.desc=_+1 :_ Augmente les dégâts supplémentaires par étape de préparation de _10%_.\n\n_+2 :_ Augmente les dégâts supplémentaires par étape de préparation de _20%_.\n\n_+3 :_ Augmente les dégâts supplémentaires par étape de préparation de _30%_.
actors.hero.talent.cautious_prep.title=Préparation Prudente
actors.hero.talent.cautious_prep.desc=_+1 :_ Augmente la durée de la discrétion fournie par la Cape d'Ombre de _1 tour_.\n\n_+2 :_ Augmente la durée de la discrétion fournie par la Cape d'Ombre de _2 tours_.\n\n_+3 :_ Augmente la durée de la discrétion fournie par la Cape d'Ombre de _3 tours_.

actors.hero.talent.quick_prep.title=Préparation Rapide
actors.hero.talent.quick_prep.desc=_+1 :_ Chaque fois qu'une attaque est esquivée, réduit le temps de récupération de la Course Anticipée de _1 tour_.\n\n_+2 :_ Chaque fois qu'une attaque est esquivée, réduit le temps de récupération de la Course Anticipée de _2 tours_.\n\n_+3 :_ Chaque fois qu'une attaque est esquivée, réduit le temps de récupération de la Course Anticipée de _3 tours_.
actors.hero.talent.overcoming.title=Surmonter l'Adversité
actors.hero.talent.overcoming.desc=_+1 :_ Tant que la Course Anticipée est active, gagne 2 tours de célérité en étant attaqué par des ennemis.\n\n_+2 :_ En plus de l'effet +1, gagne 2 tours d'adrénaline tant que la Course Anticipée est active en étant attaqué par des ennemis.\n\n_+3 :_ En plus des effets +1 et +2, gagne 2 tours de mobilité d'esquive tant que la Course Anticipée est active en étant attaqué par des ennemis.
actors.hero.talent.momentary_focusing.title=Concentration Momentanée
actors.hero.talent.momentary_focusing.desc=_+1 :_ En utilisant la Course Anticipée, gagne une mobilité d'esquive pour le _1 prochain tour_.\n\n_+2 :_ En utilisant la Course Anticipée, gagne une mobilité d'esquive pour les _2 prochains tours_.\n\n_+3 :_ En utilisant la Course Anticipée, gagne une mobilité d'esquive pour les _3 prochains tours_.

actors.hero.talent.poisonous_blade.title=Lame Empoisonnée
actors.hero.talent.poisonous_blade.desc=_+1 :_ Inflige _3 tours_ d'empoisonnement en assassinant des ennemis.\n\n_+2 :_ Inflige _4 tours_ d'empoisonnement en assassinant des ennemis.\n\n_+3 :_ Inflige _5 tours_ d'empoisonnement en assassinant des ennemis.
actors.hero.talent.lethal_surprise.title=Surprise Mortelle
actors.hero.talent.lethal_surprise.desc=_+1 :_ En attaquant un ennemi avec une attaque furtive, le héros affecte de _vulnérabilité_ pendant 1 tour les ennemis dans son champ de vision.\n\n_+2 :_ En plus de l'effet +1, en attaquant un ennemi avec une attaque furtive, le héros affecte de _paralysie_ pendant 1 tour les ennemis dans son champ de vision.\n\n_+3 :_ En plus des effets +1 et +2, en assassinant des ennemis avec une attaque furtive, gagne des _Bulles Temporelles_ pendant 2 tours.\n\nA un temps de récupération de _5 tours_.
actors.hero.talent.chain_clock.title=Dissimulation en Chaîne
actors.hero.talent.chain_clock.desc=_+1 :_ En effectuant une attaque furtive, gagne l'invisibilité et la célérité pendant _1 tour_.\n\n_+2 :_ En effectuant une attaque furtive, gagne l'invisibilité et la célérité pendant _2 tours_.\n\n_+3 :_ En effectuant une attaque furtive, gagne l'invisibilité et la célérité pendant _3 tours_.\n\nA un temps de récupération de _10 tours_.
actors.hero.talent.soul_collect.title=Collecteur d'Âmes
actors.hero.talent.soul_collect.desc=_+1 :_ En assassinant des ennemis avec une attaque furtive, restaure _3_ points de vie.\n\n_+2 :_ En assassinant des ennemis avec une attaque furtive, restaure _6_ points de vie.\n\n_+3 :_ En assassinant des ennemis avec une attaque furtive, restaure _9_ points de vie.
actors.hero.talent.trail_tracking.title=Traque de Piste
actors.hero.talent.trail_tracking.desc=_+1 :_ En assassinant des ennemis avec une attaque furtive, gagne _1 tour_ de vision de l'esprit.\n\n_+2 :_ En assassinant des ennemis avec une attaque furtive, gagne _2 tours_ de vision de l'esprit.\n\n_+3 :_ En assassinant des ennemis avec une attaque furtive, gagne _3 tours_ de vision de l'esprit.
actors.hero.talent.master_of_cloaking.title=Maître de la Dissimulation
actors.hero.talent.master_of_cloaking.desc=_+1 :_ Augmente la durée de l'invisibilité obtenue en attendant de _1 tour_.\n\n_+2 :_ En plus de l'effet +1, réduit le temps de récupération de l'invisibilité obtenue en attendant de _5 tours_.\n\n_+3 :_ En plus des effets +1 et +2, chaque attaque furtive réduit le temps de récupération de la capacité et des talents du Traqueur de _1 tour_.

#nouveau talent chasseresse
actors.hero.talent.water_friendly.title=Affinité avec l'Eau
actors.hero.talent.water_friendly.desc=_+1 :_ Inflige _+1_ dégât supplémentaire quand le héros est dans l'eau.\n\n_+2 :_ Inflige _+1-2_ dégâts supplémentaires quand le héros est dans l'eau.
actors.hero.talent.added_meal.title=Bon Appétit
actors.hero.talent.added_meal.desc=_+1 :_ Augmente la restauration de faim par la nourriture de _+15%_.\n\n_+2 :_ Augmente la restauration de faim par la nourriture de _+25%_.

actors.hero.talent.kick.title=Coup de Pied
actors.hero.talent.kick.desc=_+1 :_ En effectuant une attaque de mêlée sur un ennemi ayant une arme de jet plantée, récupère l'une des armes de jet plantées et repousse l'ennemi de _1 case_.\n\n_+2 :_ En effectuant une attaque de mêlée sur un ennemi ayant une arme de jet plantée, récupère l'une des armes de jet plantées et repousse l'ennemi de _2 cases_.\n\n_+3 :_ En effectuant une attaque de mêlée sur un ennemi ayant une arme de jet plantée, récupère l'une des armes de jet plantées et repousse l'ennemi de _3 cases_.\n\nA un temps de récupération de _10 tours_.
actors.hero.talent.shooting_eyes.title=Tir de Précision
actors.hero.talent.shooting_eyes.desc=_+1 :_ A _33%_ de chance d'aveugler les ennemis pendant 2 tours lors du premier coup avec une arme de jet.\n\n_+2 :_ A _67%_ de chance d'aveugler les ennemis pendant 2 tours lors du premier coup avec une arme de jet.\n\n_+3 :_ A _100%_ de chance d'aveugler les ennemis pendant 2 tours lors du premier coup avec une arme de jet.
actors.hero.talent.target_spotting.title=Acquisition de Cible
actors.hero.talent.target_spotting.desc=_+1 :_ Inflige _+10%_ de dégâts supplémentaires en attaquant les ennemis marqués par la Tireuse d'Élite.\n\n_+2 :_ Inflige _+20%_ de dégâts supplémentaires en attaquant les ennemis marqués par la Tireuse d'Élite.\n\n_+3 :_ Inflige _+30%_ de dégâts supplémentaires en attaquant les ennemis marqués par la Tireuse d'Élite.

actors.hero.talent.living_grass.title=Herbe Vivante
actors.hero.talent.living_grass.desc=_+1 :_ En lançant ou plantant des graines, il y a _10%_ de chance que de l'herbe haute pousse au lieu d'herbe éparse.\n\n_+2 :_ En lançant ou plantant des graines, il y a _20%_ de chance que de l'herbe haute pousse au lieu d'herbe éparse.\n\n_+3 :_ En lançant ou plantant des graines, il y a _30%_ de chance que de l'herbe haute pousse au lieu d'herbe éparse.
actors.hero.talent.attraction.title=Attraction
actors.hero.talent.attraction.desc=_+1 :_ Tirer une flèche au sol fait bouger vers cet emplacement les ennemis proches dans un rayon de _1 case_ qui ne sont pas actuellement suivis.\n\n_+2 :_ Tirer une flèche au sol fait bouger vers cet emplacement les ennemis proches dans un rayon de _2 cases_ qui ne sont pas actuellement suivis.\n\n_+3 :_ Tirer une flèche au sol fait bouger vers cet emplacement les ennemis proches dans un rayon de _3 cases_ qui ne sont pas actuellement suivis.
actors.hero.talent.healing_dew.title=Rosée Guérisseuse
actors.hero.talent.healing_dew.desc=_+1 :_ Augmente la restauration de vie de la rosée de _+1_.\n\n_+2 :_ Augmente la restauration de vie de la rosée de _+2_.\n\n_+3 :_ Augmente la restauration de vie de la rosée de _+3_.

actors.hero.talent.swift_movement.title=Mouvement Agile
actors.hero.talent.swift_movement.desc=_+1 :_ Gagne _+1_ esquive par point de force au-delà de 10 pour le héros.\n\n_+2 :_ En plus de l'effet +1, a _20%_ de chance de gagner une mobilité d'esquive quand les attaques à mains nues manquent.\n\n_+3 :_ En plus de l'effet +2, gagne l'invisibilité pendant _1 tour_ en esquivant les attaques ennemies.
actors.hero.talent.less_resist.title=Résistance Minimale
actors.hero.talent.less_resist.desc=_+1 :_ Augmente la vitesse d'attaque à mains nues de _+5%_ par point de force dépassant la force requise de l'armure.\n\n_+2 :_ Augmente la vitesse d'attaque à mains nues de _+10%_ par point de force dépassant la force requise de l'armure.\n\n_+3 :_ Augmente la vitesse d'attaque à mains nues de _+15%_ par point de force dépassant la force requise de l'armure.
actors.hero.talent.ring_knuckle.title=Poing à Anneau
actors.hero.talent.ring_knuckle.desc=_+1 :_ En touchant des ennemis avec des attaques à mains nues en portant un anneau, augmente temporairement le niveau d'amélioration de l'anneau de _+1_ chaque fois, jusqu'à un maximum de _+1_.\n\n_+2 :_ En plus de l'effet +1, double la durée de l'effet d'amélioration de l'anneau et augmente le niveau d'amélioration maximal de l'anneau de _+2_.\n\n_+3 :_ En plus des effets +1 et +2, la puissance d'attaque à mains nues augmente selon le niveau d'amélioration de l'anneau équipé, et le niveau d'amélioration maximal de l'effet d'amélioration de l'anneau est augmenté de _+3_.\n\nCe talent ne s'applique pas en portant un anneau de puissance.
actors.hero.talent.mystical_punch.title=Coup Mystique
actors.hero.talent.mystical_punch.desc=_+1 :_ En touchant des ennemis avec des attaques à mains nues, a _33%_ de chance de déclencher des effets supplémentaires selon l'anneau équipé.\n\n_+2 :_ En touchant des ennemis avec des attaques à mains nues, a _67%_ de chance de déclencher des effets supplémentaires selon l'anneau équipé.\n\n_+3 :_ En touchant des ennemis avec des attaques à mains nues, a _100%_ de chance de déclencher des effets supplémentaires selon l'anneau équipé.
actors.hero.talent.quick_step.title=Pas Rapide
actors.hero.talent.quick_step.desc=_+1 :_ Après des attaques à mains nues, a _33%_ de chance de se déplacer d'_1 case_ sans consommer de tour.\n\n_+2 :_ Après des attaques à mains nues, a _67%_ de chance de se déplacer d'_1 case_ sans consommer de tour.\n\n_+3 :_ Après des attaques à mains nues, a _100%_ de chance de se déplacer d'_1 case_ sans consommer de tour.
actors.hero.talent.counter_attack.title=Contre-Attaque
actors.hero.talent.counter_attack.desc=_+1 :_ En esquivant les attaques ennemies, a _20%_ de chance de ne pas consommer de tour pour la prochaine attaque à mains nues.\n\n_+2 :_ En esquivant les attaques ennemies, a _40%_ de chance de ne pas consommer de tour pour la prochaine attaque à mains nues.\n\n_+3 :_ En esquivant les attaques ennemies, a _60%_ de chance de ne pas consommer de tour pour la prochaine attaque à mains nues.

#nouveau talent duelliste
actors.hero.talent.skilled_hand.title=Mains Habiles
actors.hero.talent.skilled_hand.desc=_+1 :_ Inflige _+2_ dégâts supplémentaires en attaquant des ennemis avec des capacités d'arme.\n\n_+2 :_ Inflige _+3_ dégâts supplémentaires en attaquant des ennemis avec des capacités d'arme.\n\nUtiliser des capacités d'arme qui n'attaquent pas d'ennemis accorde à la prochaine attaque de mêlée _2/3_ de dégâts supplémentaires.
actors.hero.talent.skilled_hand.meta_desc=_Si ce talent est obtenu par un héros différent_, les attaques physiques du héros infligent 0-2/0-3 dégâts supplémentaires à la place.
actors.hero.talent.accumulation.title=Accumulation de Puissance
actors.hero.talent.accumulation.desc=_+1 :_ Augmente la charge maximale de l'arme de _1_.\n\n_+2 :_ Augmente la charge maximale de l'arme de _2_.
actors.hero.talent.accumulation.meta_desc=_Si ce talent est obtenu par un héros différent_, la vitesse de guérison du héros augmente de x1,1/x1,2 à la place.

actors.hero.talent.faster_charge.title=Charge Plus Rapide
actors.hero.talent.faster_charge.desc=_+1 :_ Quand l'arme auxiliaire est complètement chargée, la vitesse de charge de l'arme principale augmente de _8%_.\n\n_+2 :_ Quand l'arme auxiliaire est complètement chargée, la vitesse de charge de l'arme principale augmente de _16%_.\n\n_+3 :_ Quand l'arme auxiliaire est complètement chargée, la vitesse de charge de l'arme principale augmente de _25%_.
actors.hero.talent.quick_followup.title=Enchaînement Rapide
actors.hero.talent.quick_followup.desc=_+1 :_ Changer d'arme augmente la vitesse d'attaque de la prochaine attaque physique de _33%_.\n\n_+1 :_ Changer d'arme augmente la vitesse d'attaque de la prochaine attaque physique de _67%_.\n\n_+1 :_ Changer d'arme augmente la vitesse d'attaque de la prochaine attaque physique de _100%_.\n\nA un temps de récupération de _10 tours_.\n\nChanger d'arme à nouveau sans attaquer retirera le bonus de vitesse d'attaque.
actors.hero.talent.twin_sword.title=Maîtrise des Épées Jumelles
actors.hero.talent.twin_sword.desc=_+1 :_ Si l'arme principale et l'arme auxiliaire sont du même type, la vitesse de charge de l'arme principale est augmentée de _25%_.\n\n_+2 :_ En plus de l'effet +1, quand les deux armes sont utilisées pour une attaque, les deux effets d'arme sont activés.\n\n_+3 :_ En plus des effets +1 et +2, la vitesse d'attaque est doublée quand l'arme principale et l'arme auxiliaire sont du même type.

actors.hero.talent.restored_energy.title=Restauration d'Énergie
actors.hero.talent.restored_energy.desc=_+1 :_ Le Moine gagne continuellement de l'énergie au rythme de 1 énergie toutes les _100 tours_.\n\n_+2 :_ Le Moine gagne continuellement de l'énergie au rythme de 1 énergie toutes les _80 tours_.\n\n_+3 :_ Le Moine gagne continuellement de l'énergie au rythme de 1 énergie toutes les _67 tours_.
actors.hero.talent.energy_barrier.title=Barrière d'Énergie
actors.hero.talent.energy_barrier.desc=_+1 :_ Pour chaque _1_ énergie dépensée en utilisant les capacités du Moine, gagne _5_ barrière.\n\n_+2 :_ Pour chaque _1_ énergie dépensée en utilisant les capacités du Moine, gagne _7_ barrière.\n\n_+3 :_ Pour chaque _1_ énergie dépensée en utilisant les capacités du Moine, gagne _9_ barrière.
actors.hero.talent.harmony.title=Harmonie
actors.hero.talent.harmony.desc=_+1 :_ Quand la vie et l'énergie actuelles sont toutes deux à _100%_, la vitesse de déplacement et d'attaque augmentent de _50%_.\n\n_+2 :_ Quand la vie et l'énergie actuelles sont à _80% ou plus_, la vitesse de déplacement et d'attaque augmentent de _50%_.\n\n_+3 :_ Quand la vie et l'énergie actuelles sont à _60% ou plus_, la vitesse de déplacement et d'attaque augmentent de _50%_.

actors.hero.talent.clam_steps.title=Pas Calmes
actors.hero.talent.clam_steps.desc=_+1 :_ Réduit la charge d'arme requise pour la ruée de _20%_.\n\n_+2 :_ Réduit la charge d'arme requise pour la ruée de _37%_.\n\n_+3 :_ Réduit la charge d'arme requise pour la ruée de _50%_.
actors.hero.talent.critical_momentum.title=Élan Critique
actors.hero.talent.critical_momentum.desc=_+1 :_ Augmente les dégâts infligés après une ruée de _+6%_.\n\n_+2 :_ Augmente les dégâts infligés après une ruée de _+11%_.\n\n_+3 :_ Augmente les dégâts infligés après une ruée de _+17%_.
actors.hero.talent.kinetic_movement.title=Mouvement Cinétique
actors.hero.talent.kinetic_movement.desc=_+1 :_ Après avoir utilisé une ruée, la consommation de charge d'arme pour la ruée est réduite de _50%_ pendant _1 tour_.\n\n_+2 :_ Après avoir utilisé une ruée, la consommation de charge d'arme pour la ruée est réduite de _50%_ pendant _2 tours_.\n\n_+3 :_ Après avoir utilisé une ruée, la consommation de charge d'arme pour la ruée est réduite de _50%_ pendant _3 tours_.
actors.hero.talent.aggressive_movement.title=Mouvement Agressif
actors.hero.talent.aggressive_movement.desc=_+1 :_ Après avoir utilisé des capacités d'arme, la consommation de charge d'arme pour la ruée est réduite de _50%_.\n\n_+2 :_ En plus de l'effet +1, en se ruant, les ennemis proches subissent _10%_ des dégâts de l'arme.\n\n_+3 :_ En plus de l'effet +2, se ruer inflige la _Vulnérabilité_ aux ennemis proches pendant _3 tours_.
actors.hero.talent.unencumbered_movement.title=Mouvement Dégagé
actors.hero.talent.unencumbered_movement.desc=_+1 :_ Gagne _0,5_ esquive par point de force dépassant la force requise des armes et de l'armure.\n\n_+2 :_ Gagne _1_ esquive par point de force dépassant la force requise des armes et de l'armure.\n\n_+3 :_ Gagne _1,5_ esquive par point de force dépassant la force requise des armes et de l'armure.
actors.hero.talent.soulize.title=Spiritualisation
actors.hero.talent.soulize.desc=_+1 :_ Augmente la distance maximale de ruée de _1 case_.\n\n_+2 :_ En plus de l'effet +1, la ruée pénètre les ennemis.\n\n_+3 :_ En plus de l'effet +2, la ruée pénètre les _cases dures_.

#nouveau talent universel
actors.hero.talent.atk_speed_enhance.title=Amélioration de Vitesse d'Attaque
actors.hero.talent.atk_speed_enhance.desc=_+1 :_ Augmente la vitesse d'attaque de _+5%_.\n\n_+2 :_ Augmente la vitesse d'attaque de _+10%_.\n\n_+3 :_ Augmente la vitesse d'attaque de _+15%_.\n\n_+4 :_ Augmente la vitesse d'attaque de _+20%_.
actors.hero.talent.acc_enhance.title=Amélioration de Précision
actors.hero.talent.acc_enhance.desc=_+1 :_ Augmente la précision de _+5%_.\n\n_+2 :_ Augmente la précision de _+10%_.\n\n_+3 :_ Augmente la précision de _+15%_.\n\n_+4 :_ Augmente la précision de _+20%_.
actors.hero.talent.eva_enhance.title=Amélioration d'Esquive
actors.hero.talent.eva_enhance.desc=_+1 :_ Augmente l'esquive de _+5%_.\n\n_+2 :_ Augmente l'esquive de _+10%_.\n\n_+3 :_ Augmente l'esquive de _+15%_.\n\n_+4 :_ Augmente l'esquive de _+20%_.
actors.hero.talent.better_choice.title=Meilleur Choix
actors.hero.talent.better_choice.desc=_+1 :_ Donne _1 Pierre d'Enchantement_.\n\n_+2 :_ Donne _1 Parchemin d'Enchantement_.\n\n_+3 :_ Donne _1 Parchemin d'Amélioration_.

#talent tireur
actors.hero.talent.reloading_meal.title=Repas Rechargeant
actors.hero.talent.reloading_meal.desc=_+1 :_ En mangeant, l'arme à feu équipée est _Rechargée_ sans consommer de balles.\n\n_+2 :_ En plus de l'effet +1, _1 tir supplémentaire est chargé_.
actors.hero.talent.gunners_intuition.title=Intuition du Tireur
actors.hero.talent.gunners_intuition.desc=_+1 :_ Quand une arme à feu est équipée, elle est immédiatement Identifiée.\n\n_+2 :_ Quand une arme à feu est acquise, elle est Identifiée pour les malédictions.
actors.hero.talent.speedy_move.title=Mouvement Rapide
actors.hero.talent.speedy_move.desc=_+1 :_ Quand le Tireur attaque un ennemi pour la première fois, il gagne _2 tours_ de déplacement instantané.\n\n_+2 :_ Quand le Tireur attaque un ennemi pour la première fois, il gagne _3 tours_ de déplacement instantané.
actors.hero.talent.safe_reload.title=Rechargement Sécurisé
actors.hero.talent.safe_reload.desc=_+1 :_ Quand tu recharges ton arme, tu gagnes _3_ boucliers.\n\n_+2 :_ Quand tu recharges ton arme, tu gagnes _5_ boucliers.
actors.hero.talent.close_combat.title=Combat Rapproché
actors.hero.talent.close_combat.desc=_+1 :_ Augmente les dégâts de mêlée de l'arme de _0-2_.\n\n_+2 :_ Augmente les dégâts de mêlée de l'arme de _0-4_.

actors.hero.talent.infinite_bullet_meal.title=Repas à Munitions Infinies
actors.hero.talent.infinite_bullet_meal.desc=_+1 :_ Cela ne coûte qu'1 tour pour manger, et tu obtiens _2 tours_ de munitions infinies en mangeant.\n\n_+2 :_ Cela ne coûte qu'1 tour pour manger, et tu obtiens _3 tours_ de munitions infinies en mangeant.
actors.hero.talent.inscribed_bullet.title=Balles Gravées
actors.hero.talent.inscribed_bullet.desc=_+1 :_ Quand tu utilises un Parchemin, tu obtiens _5 balles_.\n\n_+2 :_ Quand tu utilises un Parchemin, tu obtiens _10 balles_.\n\nLa quantité est doublée en utilisant un parchemin d'amélioration, un parchemin de transmutation, ou des objets alchimiques devant être fabriqués avec ces parchemins.\n\nPour les objets alchimiques à quantité de sortie plus élevée (ex. la plupart des sorts), la quantité de balles variera selon la quantité produite de cet objet.
actors.hero.talent.mind_vision.title=Prédiction
actors.hero.talent.mind_vision.desc=_+1 :_ Obtient 1 tour de Vision de l'Esprit avec _1%_ de chance chaque fois que le héros se déplace.\n\n_+2 :_ Obtient 1 tour de Vision de l'Esprit avec _2%_ de chance chaque fois que le héros se déplace.
actors.hero.talent.camouflage.title=Camouflage
actors.hero.talent.camouflage.desc=_+1 :_ Quand tu marches sur de l'herbe haute, tu gagnes _2 tours_ d'invisibilité.\n\n_+2 :_ Quand tu marches sur de l'herbe haute, tu gagnes _3 tours_ d'invisibilité.
actors.hero.talent.larger_magazine.title=Chargeur Étendu
actors.hero.talent.larger_magazine.desc=_+1 :_ La capacité de chargeur maximale de l'arme augmente de _1_.\n\n_+2 :_ La capacité de chargeur maximale de l'arme à feu augmente de _2 tirs_.
actors.hero.talent.bullet_collect.title=Collecte de Balles
actors.hero.talent.bullet_collect.desc=_+1 :_ Recharge 1 balle dans l'arme équipée avec _5%_ de chance chaque fois que le héros attaque en mêlée.\n\n_+2 :_ Recharge 1 balle dans l'arme équipée avec _10%_ de chance chaque fois que le héros attaque en mêlée.\n\nUne balle chargée avec ce talent peut avoir une capacité maximale de 1 munition de plus.

actors.hero.talent.street_battle.title=Combat de Rue
actors.hero.talent.street_battle.desc=_+1 :_ La balle peut attaquer en pénétrant un mur avec un rayon de _1 case_.\n\n_+2 :_ La balle peut attaquer en pénétrant un mur avec un rayon de _2 cases_.\n\n_+3 :_ La balle peut attaquer en pénétrant des murs avec un rayon de _3 cases_.
actors.hero.talent.fast_reload.title=Mains Plus Rapides
actors.hero.talent.fast_reload.desc=_+1 :_ Le temps de rechargement est réduit de _1 tour_.\n\n_+2 :_ Le temps de rechargement est réduit de _2 tours_.\n\n_+3 :_ Le temps de rechargement est réduit de _3 tours_.\n\nLe temps de rechargement ne descend pas sous 0 tour.
actors.hero.talent.perfect_focusing.title=Concentration Parfaite
actors.hero.talent.perfect_focusing.desc=_+1 :_ La durée de la Roulette de la Mort augmente de _33%_.\n\n_+2 :_ La durée de la Roulette de la Mort augmente de _67%_.\n\n_+3 :_ La durée de la Roulette de la Mort augmente de _100%_.
actors.hero.talent.honorable_shot.title=Tir d'Honneur
actors.hero.talent.honorable_shot.desc=_+1 :_ Quand la charge de la Roulette de la Mort est de 3 ou plus, la balle tirée immédiatement après avoir esquivé l'attaque de l'ennemi tue instantanément les ennemis ayant moins de _13%_ de vie.\n\n_+2 :_ Quand la charge de la Roulette de la Mort est de 3 ou plus, une balle tirée immédiatement après avoir esquivé une attaque ennemie tue instantanément les ennemis ayant moins de _27%_ de vie.\n\n_+3 :_ Quand la charge de la Roulette de la Mort est de 3 ou plus, une balle tirée immédiatement après avoir esquivé une attaque ennemie tue instantanément les ennemis ayant moins de _40%_ de vie.\n\nLes ennemis puissants résisteront à cet effet.
actors.hero.talent.bullet_time.title=Ralenti Temporel
actors.hero.talent.bullet_time.desc=_+1 :_ Si tu tues instantanément un ennemi avec la Roulette de la Mort, tous les ennemis dans ton champ de vision sont ralentis pendant _4 tours_.\n\n_+2 :_ Si tu tues instantanément un ennemi avec la Roulette de la Mort, tous les ennemis dans ton champ de vision sont ralentis pendant _8 tours_.\n\n_+3 :_ Quand un ennemi est tué instantanément par la Roulette de la Mort, tous les ennemis dans ton champ de vision sont ralentis pendant _12 tours_.
actors.hero.talent.inevitable_death.title=Mort Inévitable
actors.hero.talent.inevitable_death.desc=_+1 :_ Avec 6 charges de Roulette de la Mort, la prochaine attaque physique a _2x_ la précision.\n\n_+2 :_ Avec 6 charges de Roulette de la Mort, la prochaine attaque physique a _3x_ la précision.\n\n_+3 :_ Avec 6 charges de Roulette de la Mort, la prochaine attaque physique a _4x_ la précision.
actors.hero.talent.headshot.title=Tir à la Tête !
actors.hero.talent.headshot.desc=_+1 :_ La balle a _1%_ de chance de tuer instantanément l'ennemi.\n\n_+2 :_ La balle a _2%_ de chance de tuer instantanément l'ennemi.\n\n_+3 :_ La balle a _3%_ de chance de tuer instantanément l'ennemi.\n\nLes ennemis puissants résisteront à cet effet.

actors.hero.talent.quick_reload.title=Rechargement Rapide
actors.hero.talent.quick_reload.desc=_+1 :_ En te déplaçant, il y a _3%_ de chance de charger une balle dans l'arme équipée.\n\n_+2 :_ En te déplaçant, il y a _6%_ de chance de charger une balle dans l'arme équipée.\n\n_+3 :_ En te déplaçant, il y a _9%_ de chance de charger une balle dans l'arme équipée.\n\nSi tu n'as pas de munitions, cela ne s'active pas.
actors.hero.talent.moving_shot.title=Tir en Mouvement
actors.hero.talent.moving_shot.desc=_+1 :_ Immédiatement après un déplacement, la réduction de précision des attaques à distance diminue de _17%_.\n\n_+2 :_ Immédiatement après un déplacement, la réduction de précision des attaques à distance diminue de _33%_.\n\n_+3 :_ Immédiatement après un déplacement, la réduction de précision des attaques à distance diminue de _50%_.
actors.hero.talent.elemental_bullet.title=Munitions Élémentaires
actors.hero.talent.elemental_bullet.desc=_+1 :_ En rechargeant après avoir consommé toutes les balles de l'arme, il y a 17% de chance de charger un _Tir Glacial_ qui gèle l'ennemi.\n\n_+2 :_ 17% de chance en rechargeant après avoir consommé toutes les balles de l'arme, de charger des _Munitions Incendiaires_ qui enflamment l'ennemi.\n\n_+3 :_ En rechargeant après avoir consommé toutes les balles de l'arme, une _Balle Électrique_ est chargée qui étourdit l'ennemi avec 17% de chance.\n\nLes probabilités ne se chevauchent pas.
actors.hero.talent.improvisation.title=Improvisation
actors.hero.talent.improvisation.desc=_+1 :_ Quand un chargeur est épuisé, tu gagnes _8_ boucliers.\n\n_+2 :_ Quand un chargeur est épuisé, tu gagnes _16_ boucliers.\n\n_+3 :_ Quand un chargeur est épuisé, tu gagnes _24_ boucliers.
actors.hero.talent.soul_bullet.title=Balle d'Âme
actors.hero.talent.soul_bullet.desc=_+1 :_ Quand tu tues un ennemi, tu obtiens _1 tour_ de munitions infinies.\n\n_+2 :_ Quand tu tues un ennemi, tu obtiens _2 tours_ de munitions infinies.\n\n_+3 :_ Quand tu tues un ennemi, tu obtiens _3 tours_ de munitions infinies.
actors.hero.talent.light_movement.title=Mouvement Léger
actors.hero.talent.light_movement.desc=_+1 :_ La vitesse de déplacement augmente de 5% pour chaque _3_ force dépassant la force requise de l'armure.\n\n_+2 :_ La vitesse de déplacement augmente de 5% pour chaque _2_ force dépassant la force requise de l'armure.\n\n_+3 :_ La vitesse de déplacement augmente de 5% pour chaque _1_ force dépassant la force requise de l'armure.

actors.hero.talent.stealth_master.title=Maître de la Discrétion
actors.hero.talent.stealth_master.desc=_+1 :_ L'arme _ne fait aucun bruit_ en tirant.\n\n_+2 :_ En plus de l'effet +1, _tu peux te dissimuler même si des ennemis sont proches_.\n\n_+3 :_ En plus de l'effet +2, tu ne consommes plus de faim en te dissimulant.
actors.hero.talent.skillful_runner.title=Coureur Habile
actors.hero.talent.skillful_runner.desc=_+1 :_ Gagne _2 tours_ de célérité en te dévoilant.\n\n_+2 :_ Gagne _4 tours_ de célérité en te dévoilant.\n\n_+3 :_ Gagne _6 tours_ de célérité en te dévoilant.\n\nA un temps de récupération de 30 tours.
actors.hero.talent.stealth.title=Discrétion
actors.hero.talent.stealth.desc=_+1 :_ La chance d'être repéré par un ennemi diminue de _1 niveau_.\n\n_+2 :_ La chance d'être repéré par un ennemi diminue de _2 niveaux_.\n\n_+3 :_ La chance d'être repéré par un ennemi diminue de _3 niveaux_.
actors.hero.talent.into_the_shadow.title=Dans les Ombres
actors.hero.talent.into_the_shadow.desc=_+1 :_ Si tu tentes de te dissimuler, tu gagnes _3 tours_ d'invisibilité au lieu de la dissimulation.\n\n_+2 :_ Si tu tentes de te dissimuler, tu gagnes _6 tours_ d'invisibilité au lieu de la dissimulation.\n\n_+3 :_ Si tu tentes de te dissimuler, tu gagnes _9 tours_ d'invisibilité au lieu de la dissimulation.\n\nA un temps de récupération de 15 tours.
actors.hero.talent.ranged_sniping.title=Tir de Précision à Distance
actors.hero.talent.ranged_sniping.desc=_+1 :_ Les dégâts des balles augmentent de _2,5%_ par case de distance de l'ennemi.\n\n_+2 :_ Les dégâts des balles augmentent de _5%_ par case de distance de l'ennemi.\n\n_+3 :_ Les dégâts des balles augmentent de _7,5%_ par case de distance.\n\nLes dégâts supplémentaires augmentent jusqu'à +150%.
actors.hero.talent.telescope.title=Télescope
actors.hero.talent.telescope.desc=_+1 :_ Ta portée de vision augmente de _25%_.\n\n_+2 :_ Ta portée de vision augmente de _50%_.\n\n_+3 :_ Ta portée de vision augmente de _75%_.

actors.hero.talent.haste_move.title=Déplacement Hâtif
actors.hero.talent.haste_move.desc=_+1 :_ La vitesse de déplacement augmente de _+25%_ pendant le Déchaînement.\n\n_+2 :_ La vitesse de déplacement augmente de _+50%_ pendant le Déchaînement.\n\n_+3 :_ La vitesse de déplacement augmente de _+75%_ pendant le Déchaînement.\n\n_+4 :_ La vitesse de déplacement augmente de _+100%_ pendant le Déchaînement.
actors.hero.talent.shot_concentration.title=Tir Concentré
actors.hero.talent.shot_concentration.desc=_+1 :_ Quand la balle touche, il y a _25%_ de chance de prolonger la durée du Déchaînement d'1 tour.\n\n_+2 :_ Quand la balle touche, il y a _50%_ de chance de prolonger la durée du Déchaînement d'1 tour.\n\n_+3 :_ Quand la balle touche, il y a _75%_ de chance de prolonger la durée du Déchaînement d'1 tour.\n\n_+4 :_ Quand la balle touche, la durée du Déchaînement est garantie de se prolonger d'1 tour.\n\nLa durée du déchaînement peut être prolongée jusqu'à +10 tours.
actors.hero.talent.round_preserve.title=Préservation de Munitions
actors.hero.talent.round_preserve.desc=_+1 :_ En tirant avec une arme pendant le tir sauvage, il y a _10%_ de chance que les balles ne soient pas consommées.\n\n_+2 :_ En tirant avec une arme pendant le tir sauvage, il y a _20%_ de chance que les balles ne soient pas consommées.\n\n_+3 :_ En tirant avec une arme pendant le tir sauvage, il y a _30%_ de chance que les balles ne soient pas consommées.\n\n_+4 :_ En tirant avec une arme pendant le tir sauvage, il y a _40%_ de chance que les balles ne soient pas consommées.

actors.hero.talent.bayonet.title=Baïonnette
actors.hero.talent.bayonet.desc=_+1 :_ Attaquer un ennemi en mêlée pendant que l'Armure Renforcée est active accorde _5_ de saignement.\n\n_+2 :_ Attaquer un ennemi en mêlée pendant que l'Armure Renforcée est active accorde _6_ de saignement.\n\n_+3 :_ Attaquer un ennemi en mêlée pendant que l'Armure Renforcée est active accorde _7_ de saignement.\n\n_+4 :_ Attaquer un ennemi en mêlée pendant que l'armure corporelle renforcée est active accorde _8_ de saignement.\n\nCe trait s'active uniquement en attaquant.
actors.hero.talent.tactical_sight.title=Vision Tactique
actors.hero.talent.tactical_sight.desc=_+1 :_ Tant que l'Armure Renforcée est active, gagne l'effet de Vision de l'Esprit pour tous les ennemis proches dans un rayon de _2 cases_.\n\n_+2 :_ Tant que l'Armure Renforcée est active, gagne l'effet de Vision de l'Esprit pour tous les ennemis dans un rayon de _3 cases_.\n\n_+3 :_ Tant que l'Armure Renforcée est active, gagne l'effet de Vision de l'Esprit pour tous les ennemis dans un rayon de _4 cases_.\n\n_+4 :_ Tant que l'Armure Renforcée est active, gagne l'effet de Vision de l'Esprit pour tous les ennemis dans un rayon de _5 cases_.
actors.hero.talent.plate_add.title=Plaque Supplémentaire
actors.hero.talent.plate_add.desc=_+1 :_ Tant que l'Armure Renforcée est active, ta vitesse de déplacement est réduite de _13%_ mais ta défense augmente à _10-25_.\n\n_+2 :_ Tant que l'Armure Renforcée est active, ta vitesse de déplacement est réduite de _25%_ mais ta défense augmente de _15-30_.\n\n_+3 :_ Tant que l'Armure Renforcée est active, ta vitesse de déplacement est réduite de _38%_ mais ta défense augmente à _20-35_.\n\n_+4 :_ Tant que l'Armure Renforcée est active, ta vitesse de déplacement est réduite de _50%_ mais ta défense augmente de _25-40_.

actors.hero.talent.additional_meds.title=Plus de Fournitures
actors.hero.talent.additional_meds.desc=_+1 :_ La récupération totale de vie de la Trousse de Premiers Secours augmente à _25_.\n\n_+2 :_ La récupération totale de vie de la Trousse de Premiers Secours augmente à _30_.\n\n_+3 :_ La récupération totale de vie de la Trousse de Premiers Secours augmente à _35_.\n\n_+4 :_ La récupération totale de vie de la Trousse de Premiers Secours augmente à _40_.
actors.hero.talent.therapeutic_bandage.title=Bandages Thérapeutiques
actors.hero.talent.therapeutic_bandage.desc=_+1 :_ La Trousse de Premiers Secours soigne aussi la _Confusion_ et l'_Affaiblissement_.\n\n_+2 :_ La Trousse de Premiers Secours soigne aussi le _Ralentissement_ et la _Vulnérabilité_.\n\n_+3 :_ La Trousse de Premiers Secours soigne aussi l'_Estropiement_ et l'_Aveuglement_.\n\n_+4 :_ La Trousse de Premiers Secours soigne aussi l'_Empoisonnement_ et le _Saignement_.
actors.hero.talent.faster_healing.title=Guérison Plus Rapide
actors.hero.talent.faster_healing.desc=_+1 :_ La vitesse de récupération des outils de premiers secours augmente à _2_ par tour.\n\n_+2 :_ La vitesse de récupération des outils de premiers secours augmente à _3_ par tour.\n\n_+3 :_ La vitesse de récupération des outils de premiers secours augmente à _4_ par tour.\n\n_+4 :_ La vitesse de récupération des outils de premiers secours augmente à _5_ par tour.

#talent samouraï
actors.hero.talent.basic_practice.title=Entraînement de Base
actors.hero.talent.basic_practice.desc=_+1 :_ La chance de coup critique des attaques physiques augmente de _+2%_.\n\n_+2 :_ La chance de coup critique des attaques physiques augmente de _+4%_.
actors.hero.talent.masters_intuition.title=Intuition du Maître
actors.hero.talent.masters_intuition.desc=_+1 :_ Quand une arme de mêlée autre qu'une arme à feu est équipée, elle est immédiatement Identifiée.\n\n_+2 :_ Quand une arme de mêlée autre qu'une arme à feu est acquise, elle est Identifiée pour les malédictions.
actors.hero.talent.drawing_enhance.title=Amélioration du Dégainage
actors.hero.talent.drawing_enhance.desc=_+1 :_ Les premières attaques infligent _2_ dégâts supplémentaires.\n\n_+2 :_ Les premières attaques infligent _3_ dégâts supplémentaires.
actors.hero.talent.drawing_enhance.meta_desc=_Si une autre classe obtient ce talent_, elle inflige à la place +1 à _1-2_, +2 à _2_ dégâts supplémentaires lors de sa première attaque sur un ennemi.
actors.hero.talent.parring.title=Parade
actors.hero.talent.parring.desc=_+1 :_ La défense augmente de _0-2_.\n\n_+2 :_ La défense augmente de _0-3_.
actors.hero.talent.adrenaline_surge.title=Montée d'Adrénaline
actors.hero.talent.adrenaline_surge.desc=_+1 :_ Quand tu tues un ennemi, tu obtiens _3 tours_ d'adrénaline.\n\n_+2 :_ Quand tu tues un ennemi, tu obtiens _5 tours_ d'adrénaline.

actors.hero.talent.critical_meal.title=Repas Critique
actors.hero.talent.critical_meal.desc=_+1 :_ Le Repas ne coûte que 1 tour, et en mangeant, une chance de coup critique de +100% s'applique à la prochaine _1_ attaque physique.\n\n_+2 :_ Le Repas ne consomme que 1 tour, et en mangeant, +100% de criticité s'applique aux _2_ prochaines attaques.
actors.hero.talent.inscribed_lethality.title=Létalité Gravée
actors.hero.talent.inscribed_lethality.desc=_+1 :_ En utilisant un Parchemin, un taux de coup critique de +100% s'applique à la prochaine _1_ attaque physique.\n\n_+2 :_ Quand un Parchemin est utilisé, un taux de coup critique de +100% s'applique aux _2_ prochaines attaques physiques.\n\nLe nombre d'attaques avec létalité parfaite est doublé en utilisant un parchemin d'amélioration, un parchemin de transmutation, ou des objets alchimiques devant être fabriqués avec ces parchemins.\n\nPour les objets alchimiques à quantité de sortie plus élevée (ex. la plupart des sorts), ce talent a une chance de se déclencher selon la quantité produite de cet objet.
actors.hero.talent.unexpected_slash.title=Taillade Inattendue
actors.hero.talent.unexpected_slash.desc=_+1 :_ La chance de coup critique pendant le rengainage augmente de _+10%_.\n\n_+2 :_ La chance de coup critique pendant le rengainage augmente de _+20%_.
actors.hero.talent.dragons_eye.title=Œil du Dragon
actors.hero.talent.dragons_eye.desc=_+1 :_ En menant, tu gagnes l'effet de Vision de l'Esprit sur tous les ennemis dans un rayon de _3 cases_ autour de toi.\n\n_+2 :_ En menant, tu gagnes l'effet de Vision de l'Esprit sur tous les ennemis dans un rayon de _4 cases_.
actors.hero.talent.dragons_eye.meta_desc=_Si ce talent est obtenu par un héros différent_, gagne l'effet de vision de l'esprit sur tous les ennemis à distance de 2/3 cases à la place.
actors.hero.talent.weapon_mastery.title=Maîtrise des Armes
actors.hero.talent.weapon_mastery.desc=_+1 :_ Tu gagnes _+0,5% de Chance Critique supplémentaire_ pour chaque point de Force du Héros dépassant la force requise de l'arme.\n\n_+2 :_ _+1% de Chance Critique_ par point de Force du Héros dépassant la force requise de l'arme.
actors.hero.talent.critical_throw.title=Jet Critique
actors.hero.talent.critical_throw.desc=_+1 :_ La chance de coup critique des armes de jet et des balles augmente de _+13%_.\n\n_+2 :_ La chance de coup critique des armes de jet et des balles augmente de _+25%_.

actors.hero.talent.quick_sheathing.title=Rengainage Rapide
actors.hero.talent.quick_sheathing.desc=_+1 :_ En tuant un ennemi avec une attaque au dégainage, le Samouraï rengaine immédiatement avec _33%_ de chance.\n\n_+2 :_ En tuant un ennemi avec une attaque au dégainage, le Samouraï rengaine immédiatement avec _67%_ de chance.\n\n_+3 :_ En tuant un ennemi avec une attaque au dégainage, le Samouraï rengaine immédiatement avec _100%_ de chance.
actors.hero.talent.quick_sheathing.meta_desc=_Si ce talent est obtenu par un héros différent_, il gagne 3/6/9 tours de célérité en tuant un ennemi à la place.
actors.hero.talent.lethal_power.title=Puissance Mortelle
actors.hero.talent.lethal_power.desc=_+1 :_ Les dégâts des attaques critiques augmentent de _+5%_.\n\n_+2 :_ Les dégâts des attaques critiques augmentent de _+10%_.\n\n_+3 :_ Les dégâts des attaques critiques augmentent de _+15%_.

actors.hero.talent.mind_focusing.title=Esprit Concentré
actors.hero.talent.mind_focusing.desc=_+1 :_ La quantité d'énergie d'épée gagnée augmente de _+33%_.\n\n_+2 :_ La quantité d'énergie d'épée gagnée augmente de _+67%_.\n\n_+3 :_ La quantité d'énergie d'épée gagnée augmente de _+100%_.
actors.hero.talent.stored_power.title=Puissance Stockée
actors.hero.talent.stored_power.desc=_+1 :_ L'énergie d'épée maximale augmente de _+50%_.\n\n_+2 :_ L'énergie d'épée maximale augmente de _+100%_.\n\n_+3 :_ L'énergie d'épée maximale augmente de _+150%_.
actors.hero.talent.arcane_power.title=Puissance Arcanique
actors.hero.talent.arcane_power.desc=_+1 :_ Les enchantements et malédictions de l'arme équipée peuvent s'activer sur l'attaque d'aura d'épée avec _33%_ de chance.\n\n_+2 :_ Les enchantements et malédictions de l'arme équipée peuvent s'activer sur l'attaque d'aura d'épée avec _67%_ de chance.\n\n_+3 :_ Les enchantements et malédictions de l'arme équipée peuvent s'activer sur l'attaque d'aura d'épée avec _100%_ de chance.\n\nL'enchantement de projection fait pénétrer l'aura d'épée à travers les murs.
actors.hero.talent.energy_collect.title=Énergie Collective
actors.hero.talent.energy_collect.desc=_+1 :_ Sauvegarde _13%_ des dégâts de l'aura d'épée en énergie d'épée.\n\n_+2 :_ Sauvegarde _20%_ des dégâts de l'aura d'épée en énergie d'épée.\n\n_+3 :_ Sauvegarde _25%_ des dégâts de l'aura d'épée en énergie d'épée.
actors.hero.talent.energy_saving.title=Économie d'Énergie
actors.hero.talent.energy_saving.desc=_+1 :_ En tirant l'aura d'épée, elle utilisera _80%_ de l'énergie stockée.\n\n_+2 :_ En tirant l'aura d'épée, elle utilisera _70%_ de l'énergie stockée.\n\n_+3 :_ En tirant l'aura d'épée, elle utilisera _60%_ de l'énergie stockée.\n\nLes dégâts de l'Aura d'Épée sont égaux à l'énergie stockée.
actors.hero.talent.wind_blast.title=Rafale de Vent
actors.hero.talent.wind_blast.desc=_+1 :_ En utilisant l'aura d'épée pendant le rengainage, l'attaque inflige _+5_ dégâts magiques supplémentaires.\n\n_+2 :_ En utilisant l'aura d'épée pendant le rengainage, l'attaque inflige _+10_ dégâts magiques supplémentaires.\n\n_+3 :_ En utilisant l'aura d'épée pendant le rengainage, l'attaque inflige _+15_ dégâts magiques supplémentaires.

actors.hero.talent.enhanced_crit.title=Critiques Améliorés
actors.hero.talent.enhanced_crit.desc=_+1 :_ Le multiplicateur de chance de coup critique d'un éclair augmente à _x1,6_.\n\n_+2 :_ Le multiplicateur de chance de coup critique d'un éclair augmente à _x1,75_.\n\n_+3 :_ Le multiplicateur de chance de coup critique d'un éclair augmente à _x2_.
actors.hero.talent.powerful_slash.title=Taillade Puissante
actors.hero.talent.powerful_slash.desc=_+1 :_ Si une attaque critique survient avec un seul éclair, les dégâts augmentent de _15%_.\n\n_+2 :_ Si une attaque critique survient avec un seul éclair, les dégâts augmentent de _30%_.\n\n_+3 :_ Si une attaque critique survient avec un éclair, les dégâts augmentent de _45%_.
actors.hero.talent.static_preparation.title=Préparation Statique
actors.hero.talent.static_preparation.desc=_+1 :_ Le temps de récupération de la Taillade est réduit de _17%_.\n\n_+2 :_ Le temps de récupération de la Taillade est réduit de _33%_.\n\n_+3 :_ Le temps de récupération de la Taillade est réduit de _50%_.
actors.hero.talent.acceleration.title=Accélération
actors.hero.talent.acceleration.desc=_+1 :_ Chaque fois que tu touches avec une Taillade en Charge, la puissance d'attaque de la Taillade en Charge augmente de +5%, jusqu'à _25%_.\n\n_+2 :_ Chaque fois que tu touches avec une Taillade en Charge, la puissance d'attaque de la Taillade en Charge augmente de +5%, jusqu'à _50%_.\n\n_+3 :_ Chaque fois que tu touches avec une Taillade en Charge, les dégâts de la Taillade en Charge augmentent de +5%, jusqu'à _75%_.\n\nLa Hâte de Charge se réinitialise avec le temps ou lors d'une récupération.
actors.hero.talent.inner_eye.title=Œil Intérieur
actors.hero.talent.inner_eye.desc=_+1 :_ Quand tu touches avec une taillade en ruée, tu gagnes l'effet de Vision de l'Esprit sur tous les ennemis dans les _3 cases_ environnantes pendant 2 tours.\n\n_+2 :_ Avec une taillade en ruée réussie, tu gagnes l'effet de Vision de l'Esprit sur tous les ennemis dans un rayon de _6 cases_ pendant 2 tours.\n\n_+3 :_ Si tu touches avec une taillade en ruée, tu gagneras l'effet de Vision de l'Esprit pour tous les ennemis dans les _9 cases_ environnantes pendant 2 tours.
actors.hero.talent.dynamic_preparation.title=Préparation Dynamique
actors.hero.talent.dynamic_preparation.desc=_+1 :_ Le temps de récupération de la Taillade en Charge est réduit de _10%_.\n\n_+2 :_ Le temps de récupération de la Taillade en Charge est réduit de _20%_.\n\n_+3 :_ Le temps de récupération de la Taillade en Charge est réduit de _30%_.

actors.hero.talent.faster_than_light.title=Plus Rapide que la Lumière
actors.hero.talent.faster_than_light.desc=_+1 :_ En attribuant, tu gagnes _1 tour_ de mouvement évasif.\n\n_+2 :_ En attribuant, tu gagnes _2 tours_ de mouvement évasif.\n\n_+3 :_ En attribuant, tu gagnes _3 tours_ de mouvement évasif.
actors.hero.talent.afterimage.title=Images Rémanentes
actors.hero.talent.afterimage.desc=_+1 :_ Pendant l'attribution, tu gagnes _+1 esquive supplémentaire_ pour chaque point de force du héros dépassant la force requise de l'armure.\n\n_+2 :_ Pendant l'attribution, tu gagnes _+2 esquive supplémentaire_ par point de force du héros dépassant la force requise de l'armure.\n\n_+3 :_ Pendant l'attribution, le héros gagne _+3 esquive supplémentaire_ pour chaque point de force du héros dépassant la force requise de l'armure.
actors.hero.talent.quick_recover.title=Récupération Rapide
actors.hero.talent.quick_recover.desc=_+1 :_ Le temps de récupération de l'Éveil est réduit de _20%_.\n\n_+2 :_ Le temps de récupération de l'Éveil est réduit de _40%_.\n\n_+3 :_ Le temps de récupération de l'Éveil est réduit de _60%_.
actors.hero.talent.haste_evasion.title=Esquive Hâtive
actors.hero.talent.haste_evasion.desc=_+1 :_ Pendant l'Éveil, tu gagnes _2 tours_ de célérité en esquivant.\n\n_+2 :_ Pendant l'Éveil, tu gagnes _3 tours_ de célérité en esquivant.\n\n_+3 :_ Pendant l'Éveil, en esquivant, tu gagnes _4 tours_ de célérité.
actors.hero.talent.accelerated_lethality.title=Létalité Accélérée
actors.hero.talent.accelerated_lethality.desc=_+1 :_ Pendant l'Éveil, la chance de coup critique augmente de _+10%_.\n\n_+2 :_ Pendant l'Éveil, la chance de coup critique augmente de _+20%_.\n\n_+3 :_ Pendant l'Éveil, la chance de coup critique augmente de _+30%_.
actors.hero.talent.stable_barrier.title=Barrière Stable
actors.hero.talent.stable_barrier.desc=_+1 :_ Pendant l'Éveil, tu gagnes 1 bouclier en effectuant une attaque critique, et peux gagner _jusqu'à 20% de ta vie maximale_.\n\n_+2 :_ Pendant l'Éveil, tu gagnes 1 bouclier en effectuant une attaque critique, et peux gagner jusqu'à _40%_.\n\n_+3 :_ Pendant l'Éveil, tu gagnes 1 bouclier en effectuant une attaque critique, et peux gagner _jusqu'à 60% de la vie maximale_.

actors.hero.talent.kunai_of_doom.title=Kunai Fatal
actors.hero.talent.kunai_of_doom.desc=_+1 :_ Les ennemis touchés par un Kunai ont _5%_ de chance d'être condamnés.\n\n_+2 :_ Les ennemis touchés par un Kunai ont _10%_ de chance d'être condamnés.\n\n_+3 :_ Les ennemis touchés par un Kunai ont _15%_ de chance d'être condamnés.\n\n_+4 :_ Les ennemis touchés par un Kunai ont _20%_ de chance d'être condamnés.
actors.hero.talent.mystical_kunai.title=Kunai Mystique
actors.hero.talent.mystical_kunai.desc=_+1 :_ La précision du Kunai augmente de _25%_, et tu gagnes l'effet de Vision de l'Esprit pendant _5 tours_ sur les ennemis touchés par le Kunai.\n\n_+2 :_ La précision du Kunai augmente de _50%_, et tu gagnes l'effet de Vision de l'Esprit pendant _10 tours_ sur les ennemis touchés par le Kunai.\n\n_+3 :_ La précision du Kunai augmente de _75%_, et les ennemis touchés par le kunai gagnent l'effet de Vision de l'Esprit pendant _15 tours_.\n\n_+4 :_ La précision du Kunai augmente de _100%_, et les ennemis touchés par le kunai gagnent _20 tours_ de l'effet de Vision de l'Esprit.
actors.hero.talent.corrosive_kunai.title=Kunai Corrosif
actors.hero.talent.corrosive_kunai.desc=_+1 :_ Accorde un effet de corrosion commençant à 5 dégâts aux ennemis touchés par un Kunai pendant _2 tours_.\n\n_+2 :_ Accorde un effet de corrosion commençant à 5 dégâts aux ennemis touchés par un Kunai pendant _4 tours_.\n\n_+3 :_ Accorde un effet de corrosion commençant à 5 dégâts aux ennemis touchés par un Kunai pendant _6 tours_.\n\n_+4 :_ Accorde un effet de corrosion commençant à 5 dégâts aux ennemis touchés par un Kunai pendant _8 tours_.\n\nLes ennemis puissants résisteront à cet effet.

actors.hero.talent.double_blade_practice.title=Pratique de la Double Lame
actors.hero.talent.double_blade_practice.desc=_+1 :_ Tu gagnes _+5%_ de vitesse d'attaque supplémentaire tant que la Lame d'Ombre est active.\n\n_+2 :_ Tu gagnes _+10%_ de vitesse d'attaque supplémentaire tant que la Lame d'Ombre est active.\n\n_+3 :_ Gagne _+15%_ de vitesse d'attaque supplémentaire tant que la Lame d'Ombre est active.\n\n_+4 :_ Gagne _+20%_ de vitesse d'attaque supplémentaire tant que la Lame d'Ombre est active.
actors.hero.talent.critical_shadow.title=Ombre Critique
actors.hero.talent.critical_shadow.desc=_+1 :_ Les dégâts augmentent de _0-5_ en pénétrant la défense pendant une attaque.\n\n_+2 :_ Les dégâts augmentent de _0-10_ en pénétrant la défense pendant une attaque.\n\n_+3 :_ En pénétrant la défense pendant une attaque, les dégâts augmentent de _0-15_.\n\n_+4 :_ Les dégâts augmentent de _0-20_ en pénétrant la défense pendant une attaque.
actors.hero.talent.herbal_shadow.title=Ombre Herbale
actors.hero.talent.herbal_shadow.desc=_+1 :_ Récupère _1_ point de vie en pénétrant la défense pendant une attaque.\n\n_+2 :_ Récupère _2_ points de vie en pénétrant la défense pendant une attaque.\n\n_+3 :_ Récupère _3_ points de vie en pénétrant la défense pendant une attaque.\n\n_+4 :_ Récupère _4_ points de vie en pénétrant la défense pendant une attaque.

actors.hero.talent.awake_limit.title=Limite d'Éveil
actors.hero.talent.awake_limit.desc=_+1 :_ Les dégâts physiques infligés et reçus augmentent de _1,4x_.\n\n_+2 :_ Les dégâts physiques infligés et reçus augmentent de _1,6x_.\n\n_+3 :_ Les dégâts physiques infligés et reçus augmentent de _1,8x_.\n\n_+4 :_ Les dégâts infligés et reçus augmentent de _2,0x_.
actors.hero.talent.awake_duration.title=Durée d'Éveil
actors.hero.talent.awake_duration.desc=_+1 :_ La durée de l'Éveil augmente à _15 tours_.\n\n_+2 :_ La durée de l'Éveil augmente à _20 tours_.\n\n_+3 :_ La durée de l'Éveil augmente à _25 tours_.\n\n_+4 :_ La durée de l'Éveil augmente à _30 tours_.
actors.hero.talent.insurance.title=Assurance
actors.hero.talent.insurance.desc=_+1 :_ Quand l'éveil est activé, tu obtiens _10_ boucliers.\n\n_+2 :_ Quand l'éveil est activé, tu obtiens _20_ boucliers.\n\n_+3 :_ Quand l'éveil est activé, tu obtiens _30_ boucliers.\n\n_+4 :_ Quand l'éveil est activé, tu gagnes _40_ boucliers.

###v3.3.0
actors.hero.heroclass.adventurer=Aventurier
actors.hero.heroclass.adventurer_desc_short=L'Aventurier est un explorateur de donjon qui marche légèrement sur l'herbe haute.
actors.hero.heroclass.adventurer_desc=L'Aventurier commence avec la Machette d'Aventurier spéciale qui peut _couper l'herbe haute_ et en faire une corde.\n\nL'Aventurier peut traverser l'herbe haute _sans la piétiner_.\n\nL'Aventurier commence aussi avec sa _pelle d'aventurier_, _trois pierres de jet_, une armure de tissu, une gourde en peau, et une sacoche en velours.\n\nL'Aventurier identifie automatiquement :\n_-_ Parchemins d'Identification\n_-_ Potions de Purification\n_-_ Parchemins de Cartographie Magique
actors.hero.heroclass.adventurer_unlock=Pour débloquer l'Aventurier, _active des plantes 10 fois_.

actors.hero.herosubclass.engineer=Ingénieur
actors.hero.herosubclass.engineer_short_desc=L'_Ingénieur_ est un spécialiste de la construction qui peut démonter ou construire des barricades ou planchers en bois.
actors.hero.herosubclass.engineer_desc=L'Ingénieur peut construire diverses structures en utilisant sa corde de vigne. Grâce à des talents, il peut étendre les types de bâtiments qu'il peut construire.\n\nL'action d'un Ingénieur coûte 2 tours et 6 de faim. S'il a une pioche ou un outil de mineur, le temps et la consommation de faim seront réduits de moitié.
actors.hero.herosubclass.explorer=Explorateur
actors.hero.herosubclass.explorer_short_desc=L'_Explorateur_ est un expert environnemental qui peut attaquer des cibles distantes en utilisant des cordes de vigne.
actors.hero.herosubclass.explorer_desc=L'Explorateur, ayant des cordes de vigne dans son inventaire, étend sa portée d'attaque de mêlée du nombre de cordes de vigne. En attaquant, il consomme des cordes de vigne égales au nombre de cases au-delà de sa portée d'attaque originale.
actors.hero.herosubclass.researcher=Chercheur
actors.hero.herosubclass.researcher_short_desc=Le _Chercheur_ gagne des effets supplémentaires des plantes et applique de la boue acide aux ennemis en attaquant.
actors.hero.herosubclass.researcher_desc=En tant qu'autorité dans l'amélioration des fonctionnalités des plantes, le Chercheur gagne des effets supplémentaires en marchant sur des plantes. En attaquant physiquement des ennemis, il y a une chance d'appliquer 5 tours de boue caustique à la cible.

actors.buffs.build.action_name=Construction
actors.buffs.build.cant_edge=Le terrain ne peut pas être modifié là.
actors.buffs.build.invalid=Impossible de faire cela.
actors.buffs.build.cant_build=Tu ne peux choisir que des emplacements proches.
actors.buffs.build.cannot_mine=Le sol à ce niveau ne peut pas être retiré.
actors.buffs.build.prompt=Choisis un emplacement où construire
actors.buffs.build.cant_regular=Le terrain ne peut pas être modifié à ce niveau.
actors.buffs.build$building.wall.name=Barricade en Bois
actors.buffs.build$building.wall.desc=Construit une _Barricade en Bois_ pour obstruer le mouvement et bloquer la ligne de vue. Les Barricades en Bois peuvent être démontées pour récupérer une partie du métal liquide.
actors.buffs.build$building.floor.name=Plancher
actors.buffs.build$building.floor.desc=Retire le _Plancher_ pour créer un gouffre ou construis un plancher pour traverser des gouffres.
actors.buffs.build$building.barricade.name=Barricade de Sable
actors.buffs.build$building.barricade.desc=Construit une _Barricade de Sable_ pour obstruer le mouvement. Peut être démontée immédiatement.
actors.buffs.build$building.wire.name=Piège à Fil
actors.buffs.build$building.wire.desc=Installe un _Piège à Fil_ pour entraver le mouvement des ennemis qui passent et infliger un saignement.
actors.buffs.build$building.watchtower.name=Tour de Guet
actors.buffs.build$building.watchtower.desc=Construit une _Tour de Guet_ pour sécuriser la vision proche et attirer l'attention ennemie. Peut être démontée immédiatement.
actors.buffs.build$building.cannon.name=Canon
actors.buffs.build$building.cannon.desc=Installe un _Canon_ pour tirer de puissants coups.
actors.buffs.build$building.machinegun.name=Tourelle Mitrailleuse
actors.buffs.build$building.machinegun.desc=Installe une _Tourelle Mitrailleuse_ pour attaquer automatiquement les ennemis proches.
actors.buffs.build$building.mortar.name=Mortier
actors.buffs.build$building.mortar.desc=Installe un _Mortier_ pour attaquer les ennemis au-delà des obstacles.

actors.mobs.npcs.building.barricade.name=Barricade de Sable
actors.mobs.npcs.building.barricade.desc=Une barricade faite de sacs de sable. Les zones avec des barricades de sable ne peuvent pas être traversées, et les ennemis privilégieront l'attaque des barricades de sable dès que possible. La tourelle mitrailleuse peut tirer des balles à travers cette barricade.

actors.mobs.npcs.building.watchtower.name=Tour de Guet
actors.mobs.npcs.building.watchtower.desc=Une tour de guet érigée pour surveiller les environs. Tant que la tour de guet est debout, elle te fournit continuellement une vision de la zone. Cependant, les ennemis privilégieront l'attaque de la tour de guet si elle est découverte.

actors.mobs.npcs.building.cannon.name=Canon
actors.mobs.npcs.building.cannon.desc=Un canon installé et tiré vers un emplacement désigné. Il lance des obus extrêmement puissants en utilisant des munitions.
actors.mobs.npcs.building.cannon.no_bullet=Munitions insuffisantes pour tirer avec le canon.

actors.mobs.npcs.building.machinegun.name=Tourelle Mitrailleuse
actors.mobs.npcs.building.machinegun.desc=Une tourelle qui tire automatiquement sur les cibles dans ton champ de vision. Elle peut tirer des balles à travers un personnage ou une barricade sur le chemin d'une attaque.

actors.mobs.npcs.building.mortar.name=Mortier
actors.mobs.npcs.building.mortar.desc=Un mortier installé et tiré vers un emplacement désigné. Il largue des bombes qui atteignent à coup sûr la zone spécifiée en utilisant des munitions.
actors.mobs.npcs.building.mortar.no_bullet=Munitions insuffisantes pour tirer avec le mortier.

actors.mobs.npcs.building.building.dismiss_title=Voudrais-tu démonter ce bâtiment ?
actors.mobs.npcs.building.building.dismiss_body=Si tu sens que tu n'as plus besoin de maintenir le bâtiment, tu peux le démonter. Cette action détruira immédiatement le bâtiment.\n\nVeux-tu démonter le bâtiment ?
actors.mobs.npcs.building.building.dismiss_confirm=Oui
actors.mobs.npcs.building.building.dismiss_cancel=Non

actors.hero.talent.harvest_berry.title=Récolte de Baies
actors.hero.talent.harvest_berry.desc=_+1 :_ L'Aventurier peut trouver _4 baies_ cachées en taillant l'herbe sillonnée ou haute en explorant les prochains étages du donjon.\n\n_+2 :_ L'Aventurier peut trouver _6 baies_ cachées en taillant l'herbe sillonnée ou haute en explorant les prochains étages du donjon.
actors.hero.talent.safe_potion.title=Potion Sûre
actors.hero.talent.safe_potion.desc=_+1 :_ Boire une _Potion Non Identifiée_ accorde un Bouclier de Purification de 3 tours.\n\n_+2 :_ En plus de l'effet +1, boire une _Potion Dangereuse_ accorde un Bouclier de Purification de 3 tours.\n\nCe talent ne se déclenche pas en lançant des potions.
actors.hero.talent.root.title=Enraciné
actors.hero.talent.root.desc=_+1 :_ Quand une plante pousse à l'emplacement d'un ennemi, elle l'enracine pendant _2 tours_.\n\n_+2 :_ Quand une plante pousse à l'emplacement d'un ennemi, elle l'enracine pendant _3 tours_.
actors.hero.talent.protective_slash.title=Taillade Protectrice
actors.hero.talent.protective_slash.desc=_+1 :_ Attaquer un ennemi qui n'est pas adjacent à l'Aventurier lui accorde _3_ boucliers.\n\n_+2 :_ Attaquer un ennemi qui n'est pas adjacent à l'Aventurier lui accorde _5_ boucliers.\n\nIl y aura 10 tours de récupération.
actors.hero.talent.kinetic_attack.title=Attaque Cinétique
actors.hero.talent.kinetic_attack.desc=_+1 :_ L'attaque après avoir utilisé la Corde de Vigne inflige _+1-2_ dégâts.\n\n_+2 :_ L'attaque après avoir utilisé la Corde de Vigne inflige _+2_ dégâts.

actors.hero.talent.natures_meal.title=Repas de la Nature
actors.hero.talent.natures_meal.desc=_+1 :_ Prend 1 tour pour consommer un repas, plantant de l'herbe haute sur _4 cases_ environnantes.\n\n_+2 :_ Prend 1 tour pour consommer un repas, plantant de l'herbe haute sur _8 cases_ environnantes.
actors.hero.talent.pharmaceutics.title=Pharmacie
actors.hero.talent.pharmaceutics.desc=_+1 :_ Consommer une potion restaure _5_ points de vie.\n\n_+2 :_ Consommer une potion restaure _8_ points de vie.\n\nL'effet de guérison est doublé en utilisant des potions de force, d'expérience, ou des objets alchimiques devant être fabriqués avec ces potions.\n\nPour les objets alchimiques à quantité de sortie plus élevée (ex. brasserie aquatique), la quantité de guérison variera selon la quantité produite de cet objet.
actors.hero.talent.herb_extraction.title=Extraction d'Herbes
actors.hero.talent.herb_extraction.desc=_+1 :_ Consommer de la rosée depuis une gourde en peau consomme des graines pour gagner des _effets supplémentaires_.\n\n_+2 :_ En plus de l'effet +1, en utilisant une gourde en peau, il y a _50% de chance_ de ne pas consommer de graines.\n\nLes graines de baie pourrie ne sont pas consommées.
actors.hero.talent.firewatch.title=Guet du Feu
actors.hero.talent.firewatch.desc=_+1 :_ La rosée tombée au sol ne brûle pas.\n\n_+2 :_ La rosée et les parchemins tombés au sol ne brûlent pas.
actors.hero.talent.rope_rebound.title=Rebond de Corde
actors.hero.talent.rope_rebound.desc=_+1 :_ Gagne la _Célérité_ pendant _2 tours_ après avoir utilisé une corde de vigne.\n\n_+2 :_ Gagne la _Célérité_ pendant _3 tours_ après avoir utilisé une corde de vigne.
actors.hero.talent.weakening_poison.title=Poison Affaiblissant
actors.hero.talent.weakening_poison.desc=_+1 :_ Marcher sur des plantes applique _4 tours_ d'Affaiblissement et de Vulnérabilité aux ennemis.\n\n_+2 :_ Marcher sur des plantes applique _6 tours_ d'Affaiblissement et de Vulnérabilité aux ennemis.

actors.hero.talent.long_machete.title=Machette Longue
actors.hero.talent.long_machete.desc=_+1 :_ Augmente la portée d'attaque de la machette de _1 case_.\n\n_+2 :_ Augmente la portée d'attaque de la machette de _2 cases_.\n\n_+3 :_ Augmente la portée d'attaque de la machette de _3 cases_.
actors.hero.talent.long_machete.meta_desc=_Si obtenu par d'autres classes_, la portée d'attaque de l'arme augmente de 1/2/3 cases, mais les dégâts infligés diminuent jusqu'à -20/-36/-49% selon la distance à la cible.
actors.hero.talent.blooming_weapon.title=Arme Fleurissante
actors.hero.talent.blooming_weapon.desc=_+1 :_ Les attaques ont _5%_ de chance de faire pousser de l'herbe haute à proximité.\n\n_+2 :_ Les attaques ont _10%_ de chance de faire pousser de l'herbe haute à proximité.\n\n_+3 :_ Les attaques ont _15%_ de chance de faire pousser de l'herbe haute à proximité.

actors.hero.talent.barricade.title=Barricade de Sable
actors.hero.talent.barricade.desc=_+1 :_ Peut construire une _Barricade de Sable_ pour bloquer le mouvement ennemi.\n\n_+2 :_ En plus des effets +1, la _vie et la défense_ de la Barricade de Sable augmentent.\n\n_+3 :_ En plus des effets +2, le métal liquide utilisé pour construire la Barricade de Sable est réduit de _50%_.
actors.hero.talent.wire.title=Piège à Fil
actors.hero.talent.wire.desc=_+1 :_ Peut construire un _Piège à Fil_ pour entraver le mouvement ennemi et causer un saignement.\n\n_+2 :_ En plus des effets +1, la _quantité de saignement_ causée par le Piège à Fil augmente.\n\n_+3 :_ En plus des effets +2, le métal liquide utilisé pour construire le Piège à Fil est réduit de _50%_.
actors.hero.talent.watchtower.title=Tour de Guet
actors.hero.talent.watchtower.desc=_+1 :_ Peut construire une _Tour de Guet_ pour fournir une surveillance continue des environs.\n\n_+2 :_ En plus des effets +1, la _portée de vision_ de la Tour de Guet augmente de _50%_.\n\n_+3 :_ En plus des effets +2, le métal liquide utilisé pour construire la Tour de Guet est réduit de _50%_.
actors.hero.talent.cannon.title=Canon
actors.hero.talent.cannon.desc=_+1 :_ Peut construire un _Canon_ pour tirer de puissants coups en utilisant 6 munitions.\n\n_+2 :_ En plus des effets +1, les dégâts maximaux du Canon augmentent de _50%_.\n\n_+3 :_ En plus des effets +2, les munitions utilisées pour tirer avec le Canon sont réduites de _50%_.
actors.hero.talent.machinegun.title=Tourelle Mitrailleuse
actors.hero.talent.machinegun.desc=_+1 :_ Peut construire une _Tourelle Mitrailleuse_ qui tire automatiquement sur les ennemis dans un rayon de 4 cases.\n\n_+2 :_ En plus des effets +1, les dégâts de la Tourelle Mitrailleuse augmentent de _50%_.\n\n_+3 :_ En plus des effets +2, la distance de vision de la Tourelle Mitrailleuse obtient une portée supplémentaire de _+50%_.
actors.hero.talent.mortar.title=Mortier
actors.hero.talent.mortar.desc=_+1 :_ Peut construire un _Mortier_ pour bombarder les emplacements désirés en utilisant 10 munitions.\n\n_+2 :_ En plus des effets +1, les dégâts maximaux du Mortier augmentent de _50%_.\n\n_+3 :_ En plus des effets +2, les munitions utilisées pour tirer avec le Mortier sont réduites de _50%_.

actors.hero.talent.jungle_explore.title=Exploration de la Jungle
actors.hero.talent.jungle_explore.desc=_+1 :_ Augmente la vitesse de déplacement de _20%_ en traversant de l'herbe haute.\n\n_+2 :_ Augmente la vitesse de déplacement de _44%_ en traversant de l'herbe haute.\n\n_+3 :_ Augmente la vitesse de déplacement de _73%_ en traversant de l'herbe haute.
actors.hero.talent.durable_rope.title=Corde Durable
actors.hero.talent.durable_rope.desc=_+1 :_ Réduit le nombre de cordes de vigne consommées par les attaques de _20%_.\n\n_+2 :_ Réduit le nombre de cordes de vigne consommées par les attaques de _30%_.\n\n_+3 :_ Réduit le nombre de cordes de vigne consommées par les attaques de _40%_.
actors.hero.talent.lasso.title=Lancer de Lasso
actors.hero.talent.lasso.desc=_+1 :_ Attirer un ennemi avec une corde de vigne accorde _2 tours_ d'immobilisation.\n\n_+2 :_ Attirer un ennemi avec une corde de vigne accorde _3 tours_ d'immobilisation.\n\n_+3 :_ Attirer un ennemi avec une corde de vigne accorde _4 tours_ d'immobilisation.
actors.hero.talent.rope_collector.title=Collecteur de Cordes
actors.hero.talent.rope_collector.desc=_+1 :_ Augmente le nombre de cordes de vigne obtenues avec la machette de _+20%_.\n\n_+2 :_ Augmente le nombre de cordes de vigne obtenues avec la machette de _+30%_.\n\n_+3 :_ Augmente le nombre de cordes de vigne obtenues avec la machette de _+40%_.
actors.hero.talent.rope_master.title=Maître des Cordes
actors.hero.talent.rope_master.desc=_+1 :_ Réduit le nombre de cordes de vigne consommées en utilisant des cordes de vigne de _50%_.\n\n_+2 :_ En plus des effets +1, utiliser des cordes de vigne ne consomme _aucun tour_.\n\n_+3 :_ En plus des effets +2, permet l'utilisation de cordes de vigne _par-dessus les murs_.
actors.hero.talent.vine_bind.title=Liage de Vigne
actors.hero.talent.vine_bind.desc=_+1 :_ Lie les ennemis proches avec 5 cordes de vigne, les immobilisant pendant _3 tours_.\n\n_+2 :_ Lie les ennemis proches avec 5 cordes de vigne, les immobilisant pendant _6 tours_.\n\n_+3 :_ Lie les ennemis proches avec 5 cordes de vigne, les immobilisant pendant _9 tours_.\n\nLe nombre de cordes de vigne utilisées par ce talent ne diminue pas.

actors.hero.talent.biology_project.title=Projet de Biologie
actors.hero.talent.biology_project.desc=_+1 :_ Augmente les dégâts physiques infligés aux ennemis non morts-vivants ou inanimés de _+10%_.\n\n_+2 :_ Augmente les dégâts physiques infligés aux ennemis non morts-vivants ou inanimés de _+20%_.\n\n_+3 :_ Augmente les dégâts physiques infligés aux ennemis non morts-vivants ou inanimés de _+30%_.
actors.hero.talent.rapid_growth.title=Croissance Rapide
actors.hero.talent.rapid_growth.desc=_+1 :_ En creusant de l'herbe avec une bêche, il y a _20%_ de chance que l'herbe soit remplacée par de l'herbe haute.\n\n_+2 :_ En creusant de l'herbe avec une bêche, il y a _40%_ de chance que l'herbe soit remplacée par de l'herbe haute.\n\n_+3 :_ En creusant de l'herbe avec une bêche, il y a _60%_ de chance que l'herbe soit remplacée par de l'herbe haute.
actors.hero.talent.bio_energy.title=Bio-Énergie
actors.hero.talent.bio_energy.desc=_+1 :_ Marcher sur de l'herbe haute accorde un effet de charge d'artefact de _0,2 tour_.\n\n_+2 :_ Marcher sur de l'herbe haute accorde un effet de charge d'artefact de _0,4 tour_.\n\n_+3 :_ Marcher sur de l'herbe haute accorde un effet de charge d'artefact de _0,6 tour_.
actors.hero.talent.water_absorb.title=Absorption d'Eau
actors.hero.talent.water_absorb.desc=_+1 :_ En creusant de l'herbe avec une bêche, des cases d'eau supplémentaires peuvent être retirées, et il y a _5%_ de chance qu'une rosée se forme sur la case.\n\n_+2 :_ En creusant de l'herbe avec une bêche, des cases d'eau supplémentaires peuvent être retirées, et il y a _10%_ de chance qu'une rosée se forme sur la case.\n\n_+3 :_ En creusant de l'herbe avec une bêche, des cases d'eau supplémentaires peuvent être retirées, et il y a _15%_ de chance qu'une rosée se forme sur la case.
actors.hero.talent.powerful_acid.title=Acide Puissant
actors.hero.talent.powerful_acid.desc=_+1 :_ Augmente la durée de la boue acide appliquée par les attaques de _+50%_.\n\n_+2 :_ Augmente la durée de la boue acide appliquée par les attaques de _+100%_.\n\n_+3 :_ Augmente la durée de la boue acide appliquée par les attaques de _+150%_.
actors.hero.talent.sticky_ooze.title=Boue Collante
actors.hero.talent.sticky_ooze.desc=_+1 :_ Réduit la vitesse de déplacement des ennemis affectés par la boue acide de _10%_.\n\n_+2 :_ Réduit la vitesse de déplacement des ennemis affectés par la boue acide de _20%_.\n\n_+3 :_ Réduit la vitesse de déplacement des ennemis affectés par la boue acide de _30%_.

actors.hero.talent.jungle.title=jungle
actors.hero.talent.jungle.desc=_+1 :_ La chance avec laquelle l'herbe pousse augmente de _+20%_.\n\n_+2 :_ La chance avec laquelle l'herbe pousse augmente de _+40%_.\n\n_+3 :_ La chance avec laquelle l'herbe pousse augmente de _+60%_.\n\n_+4 :_ La chance avec laquelle l'herbe pousse augmente de _+80%_.
actors.hero.talent.forest.title=création de forêt
actors.hero.talent.forest.desc=_+1 :_ La zone d'effet de la pousse augmente de _+25%_.\n\n_+2 :_ La zone d'effet de la pousse augmente de _+50%_.\n\n_+3 :_ La zone d'effet de la pousse augmente de _+75%_.\n\n_+4 :_ La zone d'effet de la pousse augmente de _+100%_.
actors.hero.talent.regrowth.title=repousse
actors.hero.talent.regrowth.desc=_+1 :_ Il y a _5%_ de chance que la pousse fasse pousser des plantes aléatoires au lieu d'herbe haute.\n\n_+2 :_ Il y a _10%_ de chance que la pousse fasse pousser des plantes aléatoires au lieu d'herbe haute.\n\n_+3 :_ Il y a _15%_ de chance que la pousse fasse pousser des plantes aléatoires au lieu d'herbe haute.\n\n_+4 :_ Il y a _20%_ de chance que la pousse fasse pousser des plantes aléatoires au lieu d'herbe haute.

actors.hero.talent.long_luck.title=chance durable
actors.hero.talent.long_luck.desc=_+1 :_ Augmente la durée de la Chance de _+20%_.\n\n_+2 :_ Augmente la durée de la Chance de _+40%_.\n\n_+3 :_ Augmente la durée de la Chance de _+60%_.\n\n_+4 :_ Augmente la durée de la Chance de _+80%_.
actors.hero.talent.foresight.title=prescience
actors.hero.talent.foresight.desc=_+1 :_ L'Aventurier gagne _5 tours_ de prescience en utilisant la carte au trésor.\n\n_+2 :_ L'Aventurier gagne _10 tours_ de prescience en utilisant la carte au trésor.\n\n_+3 :_ L'Aventurier gagne _15 tours_ de prescience en utilisant la carte au trésor.\n\n_+4 :_ L'Aventurier gagne _20 tours_ de prescience en utilisant la carte au trésor.
actors.hero.talent.gold_hunter.title=chasseur d'or
actors.hero.talent.gold_hunter.desc=_+1 :_ Tant que la Chance est active, la prochaine attaque de mêlée de l'Aventurier inflige _+10%_ de dégâts en plus après avoir obtenu de l'or.\n\n_+2 :_ Tant que la Chance est active, la prochaine attaque de mêlée de l'Aventurier inflige _+20%_ de dégâts en plus après avoir obtenu de l'or.\n\n_+3 :_ Tant que la Chance est active, la prochaine attaque de mêlée de l'Aventurier inflige _+30%_ de dégâts en plus après avoir obtenu de l'or.\n\n_+4 :_ Tant que la Chance est active, la prochaine attaque de mêlée de l'Aventurier inflige _+40%_ de dégâts en plus après avoir obtenu de l'or.

actors.hero.talent.poisonous_root.title=racine empoisonnée
actors.hero.talent.poisonous_root.desc=_+1 :_ L'Aventurier donne à l'ennemi enraciné un effet de poison qui dure _2 tours_.\n\n_+2 :_ L'Aventurier donne à l'ennemi enraciné un effet de poison qui dure _4 tours_.\n\n_+3 :_ L'Aventurier donne à l'ennemi enraciné un effet de poison qui dure _6 tours_.\n\n_+4 :_ L'Aventurier donne à l'ennemi enraciné un effet de poison qui dure _8 tours_.
actors.hero.talent.root_spread.title=propagation de racines
actors.hero.talent.root_spread.desc=_+1 :_ L'Aventurier plante _30_ spores, pouvant lier d'autres cibles, autour de l'ennemi enraciné.\n\n_+2 :_ L'Aventurier plante _60_ spores, pouvant lier d'autres cibles, autour de l'ennemi enraciné.\n\n_+3 :_ L'Aventurier plante _90_ spores, pouvant lier d'autres cibles, autour de l'ennemi enraciné.\n\n_+4 :_ L'Aventurier plante _120_ spores, pouvant lier d'autres cibles, autour de l'ennemi enraciné.\n\nCe talent permet à la propagation de spores de transformer même les cases d'eau en herbe.
actors.hero.talent.root_armor.title=armure de racines
actors.hero.talent.root_armor.desc=_+1 :_ Si l'Aventurier utilise l'Enracinement sur lui-même, il gagnera une peau d'écorce, qui utilise le double de la charge, disparaît chaque tour, et fournit une armure égale à _13% de sa valeur de défense d'armure maximale_.\n\n_+2 :_ Si l'Aventurier utilise l'Enracinement sur lui-même, il gagnera une peau d'écorce, qui utilise le double de la charge, disparaît chaque tour, et fournit une armure égale à _25% de sa valeur de défense d'armure maximale_.\n\n_+3 :_ Si l'Aventurier utilise l'Enracinement sur lui-même, il gagnera une peau d'écorce, qui utilise le double de la charge, disparaît chaque tour, et fournit une armure égale à _38% de sa valeur de défense d'armure maximale_.\n\n_+4 :_ Si l'Aventurier utilise l'Enracinement sur lui-même, il gagnera une peau d'écorce, qui utilise le double de la charge, disparaît chaque tour, et fournit une armure égale à _50% de sa valeur de défense d'armure maximale_.

actors.hero.abilities.adventurer.sprout.name=pousse
actors.hero.abilities.adventurer.sprout.short_desc=L'Aventurier peut faire _pousser_ de l'herbe haute sur une large zone.
actors.hero.abilities.adventurer.sprout.desc=L'Aventurier dispersera des graines d'herbe dans un rayon de 4 cases autour de lui pour faire pousser de l'herbe haute.
actors.hero.abilities.adventurer.treasuremap.name=carte au trésor
actors.hero.abilities.adventurer.treasuremap.short_desc=L'Aventurier peut sortir la _Carte au Trésor_ et la lire pour découvrir l'emplacement de tous les objets de l'étage actuel.
actors.hero.abilities.adventurer.treasuremap.desc=L'Aventurier peut utiliser la carte au trésor magique pour trouver l'emplacement de tous les objets de l'étage actuel, ainsi que tuer des ennemis pour faire tomber des objets supplémentaires pendant 20 tours.
actors.hero.abilities.adventurer.treasuremap$lucktracker.name=Chance
actors.hero.abilities.adventurer.treasuremap$lucktracker.desc=Une incroyable aura de bonne fortune t'entoure, et les ennemis que tu tues tant que ta chance dure feront tomber un butin supplémentaire.
actors.hero.abilities.adventurer.root.name=enraciner
actors.hero.abilities.adventurer.root.prompt=Choisis ce que tu veux enraciner
actors.hero.abilities.adventurer.root.ally_target=Tu ne peux lier que des ennemis.
actors.hero.abilities.adventurer.root.no_charge=Tu n'as pas assez de charge pour utiliser le talent d'armure de racines !
actors.hero.abilities.adventurer.root.short_desc=L'Aventurier peut _enraciner_ la cible sélectionnée.
actors.hero.abilities.adventurer.root.desc=L'Aventurier _enracinera_ une cible sélectionnée pendant 20 tours.

###v3.11.0
actors.hero.heroclass.knight=Chevalier
actors.hero.heroclass.knight_desc_short=Le Chevalier expérimenté au combat commence avec le _Bouclier du Chevalier_, qui procure une défense proportionnelle à son niveau.
actors.hero.heroclass.knight_desc=Le Chevalier commence avec un _Bouclier du Chevalier_ spécial, gagnant une défense continue du bouclier et des effets supplémentaires par inscriptions runiques.\n\nLe Chevalier commence aussi avec un _Sabre du Chevalier_, 3 pierres de jet, une armure de tissu, une gourde en peau, et une sacoche en velours.\n\nLe Chevalier commence avec les objets suivants identifiés :\n_-_ Parchemin d'Identification\n_-_ Potion de Gaz Paralysant\n_-_ Parchemin de Suppression de Malédiction
actors.hero.heroclass.knight_unlock=Pour débloquer le Chevalier, _acquiers l'Armure de Plaques._

actors.hero.herosubclass.deathknight=Chevalier de la Mort
actors.hero.herosubclass.deathknight_short_desc=Le Chevalier de la Mort peut absorber les âmes des ennemis vaincus pour _surmonter la mort_.
actors.hero.herosubclass.deathknight_desc=Les dégâts d'attaque physique du Chevalier de la Mort augmentent jusqu'à 1,2 fois proportionnellement à la vie perdue.\n\nLe Chevalier de la Mort peut aussi absorber et stocker des âmes des ennemis vaincus. Si la vie du Chevalier de la Mort atteint 0 alors qu'il possède des âmes stockées, une âme sera consommée pour restaurer un peu de vie et résister à la mort. Cette capacité s'active avant un Ankh.
actors.hero.herosubclass.horseman=Cavalier
actors.hero.herosubclass.horseman_short_desc=Le Cavalier peut chevaucher un _Cheval d'Âme_ pour balayer le champ de bataille.
actors.hero.herosubclass.horseman_desc=Le Cavalier gagne l'effet de chevauchée lors du changement de classe. En étant monté, le Cavalier peut charger dans la direction désirée, attaquant toutes les cibles dépassées jusqu'à toucher un mur. Le Cavalier subit des dégâts proportionnels à la distance parcourue en touchant un mur.\n\nSi le héros subit des dégâts physiques en étant monté, la vie du Cheval d'Âme diminue. Si le Cheval d'Âme meurt pendant la chevauchée, le Cavalier sera désarçonné et subira de lourds dégâts.
actors.hero.herosubclass.crusader=Croisé
actors.hero.herosubclass.crusader_short_desc=Le Croisé peut _gagner un effet de bénédiction en priant_ et récupérer de la vie en attaquant les ennemis pendant l'effet de bénédiction.
actors.hero.herosubclass.crusader_desc=Le Croisé peut prier pour utiliser une partie de son expérience afin de gagner une bénédiction courte et cumulable. S'il n'y a pas assez d'expérience, la prière n'a aucun effet.\n\nLe Croisé récupère aussi de la vie en infligeant des dégâts physiques aux ennemis pendant qu'il est béni, se soignant d'une partie des dégâts infligés.

actors.hero.abilities.knight.holyshield.name=Barrière Sacrée
actors.hero.abilities.knight.holyshield.short_desc=Le Chevalier peut prier pour obtenir une _Barrière Sacrée_, offrant une protection contre les attaques mineures.
actors.hero.abilities.knight.holyshield.desc=Le Chevalier peut prier avec une grande foi pour gagner une barrière avec 25 de protection.
actors.hero.abilities.knight.stimpack.name=Stimulant de Combat
actors.hero.abilities.knight.stimpack.short_desc=Le Chevalier peut utiliser un _Stimulant de Combat_ pour sacrifier de la vie et grandement augmenter la vitesse d'attaque et de déplacement.
actors.hero.abilities.knight.stimpack.desc=Le Chevalier utilise un Stimulant de Combat, perdant 30% de sa vie maximale et gagnant l'adrénaline pour les 20 prochains tours.
actors.hero.abilities.knight.stimpack.cannot_use=Pas assez de vie pour utiliser le Stimulant de Combat !
actors.hero.abilities.knight.unstableankh.name=Ankh Instable
actors.hero.abilities.knight.unstableankh.short_desc=Le Chevalier peut utiliser un _Ankh Instable_ pour devenir invincible pendant très peu de temps.
actors.hero.abilities.knight.unstableankh.desc=Le Chevalier utilise un Ankh spécial créé à partir de la foi pour devenir invincible pendant 1 tour.
actors.hero.abilities.knight.unstableankh.ankh_dropped=L'Ankh Instable a été complété !

actors.hero.talent.tough_meal.title=Repas Robuste
actors.hero.talent.tough_meal.desc=_+1 :_ En mangeant, gagne 3-3 défense contre les _2_ prochains coups.\n\n_+2 :_ En mangeant, gagne 3-3 défense contre les _3_ prochains coups.
actors.hero.talent.knights_intuition.title=Intuition du Chevalier
actors.hero.talent.knights_intuition.desc=_+1 :_ Identifie l'armure _immédiatement en l'équipant_.\n\n_+2 :_ En plus de l'effet +1, _identifie les malédictions_ en acquérant une armure.
actors.hero.talent.kinetic_battle.title=Combat Cinétique
actors.hero.talent.kinetic_battle.desc=_+1 :_ Gagne 1 dégât supplémentaire qui dure jusqu'à _3 tours_ après avoir vaincu un ennemi.\n\n_+2 :_ Gagne 1 dégât supplémentaire qui dure jusqu'à _5 tours_ après avoir vaincu un ennemi.\n\nLes dégâts supplémentaires peuvent s'accumuler jusqu'à 5.
actors.hero.talent.hard_shield.title=Bouclier Renforcé
actors.hero.talent.hard_shield.desc=_+1 :_ Augmente la défense fournie par le bouclier du Chevalier de _0-2_.\n\n_+2 :_ Augmente la défense fournie par le bouclier du Chevalier de _0-4_.
actors.hero.talent.hard_shield.meta_desc=_Si une autre classe acquiert ce trait_, la défense fournie par le bouclier du Chevalier augmente de 0-2/0-4 même sans posséder le bouclier.
actors.hero.talent.war_cry.title=Cri de Guerre
actors.hero.talent.war_cry.desc=_+1 :_ Gagne _2 tours_ d'adrénaline en attaquant un ennemi pour la première fois.\n\n_+2 :_ Gagne _3 tours_ d'adrénaline en attaquant un ennemi pour la première fois.

actors.hero.talent.impregnable_meal.title=Repas Imprenable
actors.hero.talent.impregnable_meal.desc=_+1 :_ Consomme 1 tour pour gagner une amélioration de _+1_ à l'armure équipée pour les 3 prochains coups après avoir mangé.\n\n_+2 :_ Consomme 1 tour pour gagner une amélioration de _+2_ à l'armure équipée pour les 3 prochains coups après avoir mangé.
actors.hero.talent.smithing_spell.title=Sort de Forgeage
actors.hero.talent.smithing_spell.desc=_+1 :_ Après avoir utilisé un parchemin ou un sort, gagne un niveau d'amélioration de _+1_ pour les armes et armures équipées pour les 10 prochains coups chacun.\n\n_+2 :_ Après avoir utilisé un parchemin ou un sort, gagne un niveau d'amélioration de _+2_ pour les armes et armures équipées pour les 10 prochains coups chacun.\n\nLe nombre de coups est doublé en utilisant des parchemins d'amélioration, des parchemins de transformation, ou des objets alchimiques fabriqués avec ce parchemin comme matériau.\n\nPour les objets alchimiques (ex. parchemins) qui produisent plus de résultats que le nombre de parchemins utilisés, le nombre de coups variera selon leur quantité de résultat.
actors.hero.talent.armor_adaption.title=Adaptation d'Armure
actors.hero.talent.armor_adaption.desc=_+1 :_ Gagne _0-1_ défense supplémentaire pour chaque point de force dépassant la force requise de l'armure.\n\n_+2 :_ Gagne _0-1,5_ défense supplémentaire pour chaque point de force dépassant la force requise de l'armure.
actors.hero.talent.chivalry.title=Chevalerie
actors.hero.talent.chivalry.desc=_+1 :_ Le héros _subit les dégâts à la place des alliés_ dans son champ de vision.\n\n_+2 :_ En plus de l'effet +1, les dégâts subis à la place des alliés sont _réduits de 50%_.
actors.hero.talent.protection.title=Protection Royale
actors.hero.talent.protection.desc=_+1 :_ Les dégâts reçus sont réduits _jusqu'à 17%_ proportionnellement à la vie perdue du héros.\n\n_+2 :_ Les dégâts reçus sont réduits _jusqu'à 33%_ proportionnellement à la vie perdue du héros.
actors.hero.talent.flag_of_conquest.title=Étendard de Conquête
actors.hero.talent.flag_of_conquest.desc=_+1 :_ Augmenter de niveau inflige des dégâts égaux à _50% de la vie maximale_ de tous les ennemis dans le champ de vision.\n\n_+2 :_ Augmenter de niveau inflige des dégâts égaux à _75% de la vie maximale_ de tous les ennemis dans le champ de vision.

actors.hero.talent.craftmans_skills.title=Compétences d'Artisan
actors.hero.talent.craftmans_skills.desc=_+1 :_ Augmente le niveau d'amélioration de l'armure équipée de _+1_.\n\n_+2 :_ Augmente le niveau d'amélioration de l'armure équipée de _+2_.\n\n_+3 :_ Augmente le niveau d'amélioration de l'armure équipée de _+3_.
actors.hero.talent.tackle.title=Plaquage
actors.hero.talent.tackle.desc=_+1 :_ En attaquant un ennemi proche avec une arme de mêlée ou à mains nues, inflige des dégâts supplémentaires égaux à _5%_ de ta défense actuelle.\n\n_+2 :_ En attaquant un ennemi proche avec une arme de mêlée ou à mains nues, inflige des dégâts supplémentaires égaux à _10%_ de ta défense actuelle.\n\n_+3 :_ En attaquant un ennemi proche avec une arme de mêlée ou à mains nues, inflige des dégâts supplémentaires égaux à _15%_ de ta défense actuelle.

actors.hero.talent.army_of_death.title=Armée de la Mort
actors.hero.talent.army_of_death.desc=_+1 :_ En vainquant un ennemi, il y a jusqu'à _10%_ de chance de corrompre l'ennemi, proportionnellement au pourcentage de vie perdue.\n\n_+2 :_ En vainquant un ennemi, il y a jusqu'à _20%_ de chance de corrompre l'ennemi, proportionnellement au pourcentage de vie perdue.\n\n_+3 :_ En vainquant un ennemi, il y a jusqu'à _30%_ de chance de corrompre l'ennemi, proportionnellement au pourcentage de vie perdue.
actors.hero.talent.deaths_chill.title=Frisson de la Mort
actors.hero.talent.deaths_chill.desc=_+1 :_ Surmonter la mort accorde _20 tours d'effet de Frisson et d'Assimilation_.\n\n_+2 :_ En plus de l'effet +1, surmonter la mort provoque aussi un _air glacial autour de tous les ennemis en vue_.\n\n_+3 :_ En plus de l'effet +2, surmonter la mort _gèlera immédiatement tous les ennemis en vue_.
actors.hero.talent.overcome.title=Surmonter la Puissance
actors.hero.talent.overcome.desc=_+1 :_ Augmente la quantité de guérison de surmonter la mort de _+3_.\n\n_+2 :_ Augmente la quantité de guérison de surmonter la mort de _+6_.\n\n_+3 :_ Augmente la quantité de guérison de surmonter la mort de _+9_.
actors.hero.talent.resentment.title=Rancune
actors.hero.talent.resentment.desc=_+1 :_ Surmonter la mort invoque _un spectre corrompu_ autour du Chevalier de la Mort.\n\n_+2 :_ Surmonter la mort invoque _2 spectres corrompus_ autour du Chevalier de la Mort.\n\n_+3 :_ Surmonter la mort invoque _4 spectres corrompus_ autour du Chevalier de la Mort.
actors.hero.talent.undead.title=Mort-Vivant
actors.hero.talent.undead.desc=_+1 :_ Quand la vie atteint 0, devient Mort-Vivant pendant _1 tour_, retardant la mort.\n\n_+2 :_ Quand la vie atteint 0, devient Mort-Vivant pendant _2 tours_, retardant la mort.\n\n_+3 :_ Quand la vie atteint 0, devient Mort-Vivant pendant _3 tours_, retardant la mort.\n\nEn étant Mort-Vivant, la vie ne peut pas être récupérée mais ne diminuera pas.

actors.hero.talent.deaths_fear.title=Peur de la Mort
actors.hero.talent.deaths_fear.desc=_+1 :_ Surmonter la mort inflige _10 tours de Faiblesse_ à tous les ennemis en vue.\n\n_+2 :_ En plus de l'effet +1, surmonter la mort inflige aussi _10 tours de Vulnérabilité_ à tous les ennemis en vue.\n\n_+3 :_ En plus de l'effet +2, surmonter la mort inflige aussi _10 tours de Peur_ à tous les ennemis en vue.

actors.hero.talent.shockwave.title=Onde de Choc
actors.hero.talent.shockwave.desc=_+1 :_ Après une charge, repousse les ennemis proches d'_1 case_ pour chaque _6 cases_ parcourues pendant la charge.\n\n_+2 :_ Après une charge, repousse les ennemis proches d'_1 case_ pour chaque _4 cases_ parcourues pendant la charge.\n\n_+3 :_ Après une charge, repousse les ennemis proches d'_1 case_ pour chaque _2 cases_ parcourues pendant la charge.
actors.hero.talent.armored_horse.title=Cheval Blindé
actors.hero.talent.armored_horse.desc=_+1 :_ L'armure du cheval augmente de _+1-8_.\n\n_+2 :_ L'armure du cheval augmente de _+2-16_.\n\n_+3 :_ L'armure du cheval augmente de _+3-24_.
actors.hero.talent.dash_enhance.title=Amélioration de la Charge
actors.hero.talent.dash_enhance.desc=_+1 :_ Augmente les dégâts infligés par la charge de _+20%_.\n\n_+2 :_ Augmente les dégâts infligés par la charge de _+40%_.\n\n_+3 :_ Augmente les dégâts infligés par la charge de _+60%_.
actors.hero.talent.buffer.title=Tampon
actors.hero.talent.buffer.desc=_+1 :_ Réduit les dégâts de charge subis de _1-3_ pour chaque ennemi touché pendant la charge.\n\n_+2 :_ Réduit les dégâts de charge subis de _2-6_ pour chaque ennemi touché pendant la charge.\n\n_+3 :_ Réduit les dégâts de charge subis de _3-9_ pour chaque ennemi touché pendant la charge.
actors.hero.talent.parkour.title=Parkour
actors.hero.talent.parkour.desc=_+1 :_ Réduit les dégâts subis en tombant du cheval de _25%_.\n\n_+2 :_ Réduit les dégâts subis en tombant du cheval de _50%_.\n\n_+3 :_ Réduit les dégâts subis en tombant du cheval de _75%_.
actors.hero.talent.piloting.title=Pilotage Exceptionnel
actors.hero.talent.piloting.desc=_+1 :_ Augmente la vitesse de déplacement en étant monté de _3%_ pour chaque point de force dépassant la force requise de l'armure équipée.\n\n_+2 :_ Augmente la vitesse de déplacement en étant monté de _6%_ pour chaque point de force dépassant la force requise de l'armure équipée.\n\n_+3 :_ Augmente la vitesse de déplacement en étant monté de _9%_ pour chaque point de force dépassant la force requise de l'armure équipée.\n\nL'effet de ce trait ne s'applique pas si aucune armure n'est équipée.

actors.hero.talent.holy_shield.title=Bouclier Sacré
actors.hero.talent.holy_shield.desc=_+1 :_ À vie maximale, le Paladin gagne un bouclier allant jusqu'à _20% de la vie maximale_ selon tout excès de guérison provenant de bénédictions.\n\n_+2 :_ À vie maximale, le Paladin gagne un bouclier allant jusqu'à _40% de la vie maximale_ selon tout excès de guérison provenant de bénédictions.\n\n_+3 :_ À vie maximale, le Paladin gagne un bouclier allant jusqu'à _60% de la vie maximale_ selon tout excès de guérison provenant de bénédictions.
actors.hero.talent.pray_for_dead.title=Prière pour les Morts
actors.hero.talent.pray_for_dead.desc=_+1 :_ Prier immédiatement après avoir vaincu un ennemi accorde _3 tours de bénédiction_ supplémentaires.\n\n_+2 :_ En plus de l'effet ci-dessus, prier immédiatement après avoir vaincu un ennemi rembourse l'expérience utilisée.\n\n_+3 :_ En plus des effets ci-dessus, prier immédiatement après avoir vaincu un ennemi restaure _3 points de vie_.
actors.hero.talent.gods_judgement.title=Jugement Divin
actors.hero.talent.gods_judgement.desc=_+1 :_ En recevant une attaque physique pendant la prière, l'attaquant est marqué du Jugement Divin. En attaquant un ennemi avec le Jugement Divin, l'effet est retiré et l'ennemi est tué instantanément si sa vie est _sous 13%_.\n\n_+2 :_ En recevant une attaque physique pendant la prière, l'attaquant est marqué du Jugement Divin. En attaquant un ennemi avec le Jugement Divin, l'effet est retiré et l'ennemi est tué instantanément si sa vie est _sous 27%_.\n\n_+3 :_ En recevant une attaque physique pendant la prière, l'attaquant est marqué du Jugement Divin. En attaquant un ennemi avec le Jugement Divin, l'effet est retiré et l'ennemi est tué instantanément si sa vie est _sous 40%_.
actors.hero.talent.cleansing_pray.title=Prière Purificatrice
actors.hero.talent.cleansing_pray.desc=_+1 :_ Les dégâts élémentaires reçus pendant la prière sont réduits de _33%_.\n\n_+2 :_ Les dégâts élémentaires reçus pendant la prière sont réduits de _67%_.\n\n_+3 :_ Les dégâts élémentaires reçus pendant la prière sont réduits de _100%_.
actors.hero.talent.punishment.title=Punition Divine
actors.hero.talent.punishment.desc=_+1 :_ En recevant une attaque physique pendant la prière, la prochaine _1 attaque physique_ sera frappée par la foudre, infligeant des dégâts supplémentaires.\n\n_+2 :_ En recevant une attaque physique pendant la prière, les _2 prochaines attaques physiques_ seront frappées par la foudre, infligeant des dégâts supplémentaires.\n\n_+3 :_ En recevant une attaque physique pendant la prière, les _3 prochaines attaques physiques_ seront frappées par la foudre, infligeant des dégâts supplémentaires.\n\nTant que cet effet est actif, le compte d'attaques physiques n'est pas réinitialisé pendant la prière.
actors.hero.talent.anti_demon.title=Exorcisme
actors.hero.talent.anti_demon.desc=_+1 :_ Pendant l'effet de bénédiction, les dégâts physiques infligés aux morts-vivants et démons augmentent de _33%_.\n\n_+2 :_ Pendant l'effet de bénédiction, les dégâts physiques infligés aux morts-vivants et démons augmentent de _67%_.\n\n_+3 :_ Pendant l'effet de bénédiction, les dégâts physiques infligés aux morts-vivants et démons augmentent de _100%_.

actors.hero.talent.buffer_barrier.title=Barrière Tampon
actors.hero.talent.buffer_barrier.desc=_+1 :_ Le bouclier fourni par le Bouclier Sacré augmente de _20%_.\n\n_+2 :_ Le bouclier fourni par le Bouclier Sacré augmente de _40%_.\n\n_+3 :_ Le bouclier fourni par le Bouclier Sacré augmente de _60%_.\n\n_+4 :_ Le bouclier fourni par le Bouclier Sacré augmente de _80%_.
actors.hero.talent.holy_light.title=Lumière Divine
actors.hero.talent.holy_light.desc=_+1 :_ Utiliser le Bouclier Sacré accorde _25 tours_ de Lueur.\n\n_+2 :_ Utiliser le Bouclier Sacré accorde _50 tours_ de Lueur.\n\n_+3 :_ Utiliser le Bouclier Sacré accorde _75 tours_ de Lueur.\n\n_+4 :_ Utiliser le Bouclier Sacré accorde _100 tours_ de Lueur.
actors.hero.talent.blessing.title=Bénédiction
actors.hero.talent.blessing.desc=_+1 :_ Utiliser le Bouclier Sacré accorde _5 tours_ de Bénédiction.\n\n_+2 :_ Utiliser le Bouclier Sacré accorde _10 tours_ de Bénédiction.\n\n_+3 :_ Utiliser le Bouclier Sacré accorde _15 tours_ de Bénédiction.\n\n_+4 :_ Utiliser le Bouclier Sacré accorde _20 tours_ de Bénédiction.

actors.hero.talent.burden_relief.title=Soulagement du Fardeau
actors.hero.talent.burden_relief.desc=_+1 :_ La quantité de vie perdue en utilisant le Stimpack est réduite à _25%_ de la vie maximale.\n\n_+2 :_ La quantité de vie perdue en utilisant le Stimpack est réduite à _20%_ de la vie maximale.\n\n_+3 :_ La quantité de vie perdue en utilisant le Stimpack est réduite à _15%_ de la vie maximale.\n\n_+4 :_ La quantité de vie perdue en utilisant le Stimpack est réduite à _10%_ de la vie maximale.
actors.hero.talent.lasting_pack.title=Stimpack Durable
actors.hero.talent.lasting_pack.desc=_+1 :_ La durée de l'Adrénaline gagnée par le Stimpack augmente de _25%_.\n\n_+2 :_ La durée de l'Adrénaline gagnée par le Stimpack augmente de _50%_.\n\n_+3 :_ La durée de l'Adrénaline gagnée par le Stimpack augmente de _75%_.\n\n_+4 :_ La durée de l'Adrénaline gagnée par le Stimpack augmente de _100%_.
actors.hero.talent.time_stop.title=Arrêt du Temps
actors.hero.talent.time_stop.desc=_+1 :_ Utiliser le Stimpack accorde _1 tour_ de Chute Temporelle.\n\n_+2 :_ Utiliser le Stimpack accorde _2 tours_ de Chute Temporelle.\n\n_+3 :_ Utiliser le Stimpack accorde _3 tours_ de Chute Temporelle.\n\n_+4 :_ Utiliser le Stimpack accorde _4 tours_ de Chute Temporelle.

actors.hero.talent.blessed_ankh.title=Ankh Béni
actors.hero.talent.blessed_ankh.desc=_+1 :_ Utiliser l'Ankh Instable restaure _5_ points de vie.\n\n_+2 :_ Utiliser l'Ankh Instable restaure _10_ points de vie.\n\n_+3 :_ Utiliser l'Ankh Instable restaure _15_ points de vie.\n\n_+4 :_ Utiliser l'Ankh Instable restaure _20_ points de vie.
actors.hero.talent.ankh_enhance.title=Amélioration de l'Ankh
actors.hero.talent.ankh_enhance.desc=_+1 :_ Le temps d'invulnérabilité fourni par l'Ankh Instable augmente de _1 tour_ avec _50%_ de chance.\n\n_+2 :_ Le temps d'invulnérabilité fourni par l'Ankh Instable augmente de _1 tour_ avec _100%_ de chance.\n\n_+3 :_ Le temps d'invulnérabilité fourni par l'Ankh Instable augmente de _2 tours_ avec _50%_ de chance.\n\n_+4 :_ Le temps d'invulnérabilité fourni par l'Ankh Instable augmente de _2 tours_ avec _100%_ de chance.
actors.hero.talent.complete_ankh.title=Ankh Complet
actors.hero.talent.complete_ankh.desc=_+1 :_ Utiliser l'Ankh Instable a _1%_ de chance de créer un Ankh Complet.\n\n_+2 :_ Utiliser l'Ankh Instable a _2%_ de chance de créer un Ankh Complet.\n\n_+3 :_ Utiliser l'Ankh Instable a _3%_ de chance de créer un Ankh Complet.\n\n_+4 :_ Utiliser l'Ankh Instable a _4%_ de chance de créer un Ankh Complet.

actors.hero.talent$armorempower.name=Amplification d'Armure
actors.hero.talent$armorempower.desc=Ton corps est renforcé pour subir moins de dégâts des attaques physiques.\n\nArmure Supplémentaire : %1$d.\nCoups Restants : %2$d.

actors.hero.talent$kineticbattle.name=Combat Cinétique
actors.hero.talent$kineticbattle.desc=Les combats récents ont influencé tes attaques.\n\nPuissance d'Attaque Supplémentaire : %1$d.\nTours Restants : %2$s.

actors.hero.talent$judgementtracker.name=Jugement Divin
actors.hero.talent$judgementtracker.desc=Ce personnage a reçu le jugement divin pendant que tu priais. Attaquer un personnage avec cet effet vaincra instantanément les ennemis ayant moins d'une certaine quantité de vie.\nTours Restants : %s.
actors.hero.talent$judgementtracker.executed=Jugé

actors.buffs.armorenhance.name=Amélioration d'Armure
actors.buffs.armorenhance.desc=Ton armure a été temporairement améliorée !\n\nAmélioration Supplémentaire : _%1$d_.\nCoups restants : _%2$d_.

actors.buffs.weaponenhance.name=Amélioration d'Arme
actors.buffs.weaponenhance.desc=Ton arme a été temporairement améliorée !\n\nAmélioration Supplémentaire : _%1$d_.\nCoups restants : _%2$d_.

actors.buffs.soulcollect.name=Absorption d'Âme
actors.buffs.soulcollect.desc=Tu as absorbé l'âme d'un ennemi récemment vaincu, et son énergie tourbillonne autour de toi. Quand tu es au bord de la mort, tu peux utiliser cette âme pour récupérer instantanément de la vie et surmonter la mort.\n\nÂmes actuelles : _%1$d/%2$d_.\n\nRécupération de vie en surmontant la mort : _%3$d_.

actors.buffs.undead.name=Mort-Vivant
actors.buffs.undead.desc=Tu as gagné le pouvoir des morts-vivants, te permettant d'endurer la mort et d'accomplir des tâches inachevées pendant un court moment. En étant mort-vivant, les effets de récupération sont bloqués, et le héros mourra quand l'effet prendra fin.\n\nTours Restants : %s.
actors.buffs.undead.rankings_desc=A enduré la mort mais s'est éteint

actors.buffs.pray.action_name=Prier
actors.buffs.pray.pray_sucess=Les cieux ont répondu à ta prière, t'accordant un pouvoir divin !
actors.buffs.pray.pray_fail=Ta prière est restée sans réponse.

actors.buffs.horseriding.name=Chevauchée
actors.buffs.horseriding.desc=Tu es monté sur le Cheval d'Âme, naviguant le champ de bataille avec aisance. En chevauchant, tu peux contrôler le cheval pour charger et couvrir une longue distance en un seul tour. Pendant une charge, tu te déplaces dans la direction choisie jusqu'à toucher un mur, pénétrant à travers les ennemis. Tu infliges des dégâts d'attaque à tous les ennemis que tu traverses et reçois des dégâts proportionnels à la distance parcourue. Si tu tentes une charge depuis ta position actuelle, tu peux descendre du Cheval d'Âme. En chevauchant, si le héros subit une forme quelconque de dégâts, la vie du Cheval d'Âme diminue du même montant. Si le Cheval d'Âme meurt pendant la chevauchée, tu tomberas et subiras des dégâts importants. Vie actuelle du Cheval d'Âme : %1$d/%2$d.
actors.buffs.horseriding.rankings_desc=Mort par incapacité à contrôler la vitesse
actors.buffs.horseriding.ondeath=Tu es entré en collision avec un mur et tu es mort...
actors.buffs.horseriding.direct_prompt=Choisis la direction de la charge
actors.buffs.horseriding.fall=Tu es tombé du cheval !
actors.buffs.horseriding$horseally.name=Cheval d'Âme
actors.buffs.horseriding$horseally.desc=Le Cheval d'Âme que tu as invoqué. Le Cheval d'Âme te suit et récupère progressivement de la vie avec le temps. Le Cheval d'Âme ne peut pas attaquer les ennemis mais deviendra la cible principale des ennemis.
actors.buffs.horseriding$ridefall.rankings_desc=Mort en tombant du cheval
actors.buffs.horseriding$ridefall.ondeath=Tu es mort en tombant du cheval...
actors.buffs.horseriding$ridingcooldown.name=Récupération : Chevauchée
actors.buffs.horseriding$ridingcooldown.desc=Le Cheval d'Âme est mort, et tu dois vaincre des ennemis avant de pouvoir l'invoquer à nouveau. Ennemis Restants : %1$d/%2$d.

###v3.17.0
actors.hero.heroclass.medic=Médecin
actors.hero.heroclass.medic_desc_short=Le Médecin commence avec le _Canon à Rayons Gamma_ unique, qui peut blesser les ennemis ou soigner les alliés.
actors.hero.heroclass.medic_desc=Le Médecin commence avec le _Canon à Rayons Gamma_ unique, qui peut empoisonner les ennemis ou soigner les alliés.\n\nLa capacité du Médecin est principalement concentrée sur l'_infliction d'effets néfastes à l'ennemi_, ou la _guérison et l'infliction d'effets bénéfiques aux alliés_.\n\nLe Médecin _ne dépense pas de tour_ pour utiliser des pilules, et peut aussi les lancer _pour les utiliser sur une autre cible_.\n\nLe Médecin commence aussi avec _un scalpel_, une armure de tissu, une gourde en peau, et une sacoche en velours.\n\nLe Médecin identifie automatiquement :\n_-_ Parchemins d'Identification\n_-_ Potions de Soin\n_-_ Parchemins d'Image Miroir
actors.hero.heroclass.medic_unlock=Pour débloquer le Médecin, _fabrique des pilules 5 fois._

actors.hero.herosubclass.savior=Sauveuse
actors.hero.herosubclass.savior_short_desc=La Sauveuse peut transformer la cible en alliée quand elle tire le Canon à Rayons Gamma sur des ennemis à faible vie.
actors.hero.herosubclass.savior_desc=La sauveuse peut utiliser le Canon à Rayons Gamma pour rendre la cible alliée de façon permanente et probabiliste, et peut les rendre définitivement alliés quand la cible a moins de 5% de PV.\n\nTu peux maintenir jusqu'à 2 alliés par étage.
actors.hero.herosubclass.therapist=Thérapeute
actors.hero.herosubclass.therapist_short_desc=La Thérapeute peut _soigner rapidement les dégâts subis_ quand elle est blessée.
actors.hero.herosubclass.therapist_desc=Quand elle est blessée physiquement, la thérapeute active les premiers secours et peut immédiatement récupérer 40% des dégâts les plus récents avant l'application de la défense en utilisant les premiers secours.\n\nTu peux utiliser les premiers secours après avoir tué 1 ennemi.
actors.hero.herosubclass.medicalofficer=Officier Médical
actors.hero.herosubclass.medicalofficer_short_desc=L'Officier Médical peut _donner divers ordres opérationnels_ chaque fois qu'elle vainc un ennemi.
actors.hero.herosubclass.medicalofficer_desc=L'Officier Médical, chargée des opérations militaires, gagne un commandement opérationnel militaire chaque fois qu'elle vainc directement l'ennemi, ce qui peut être utilisé pour donner divers ordres opérationnels militaires.\n\nPar défaut, les ordres opérationnels militaires disponibles sont l'ordre de Recrutement et l'ordre de Soutien Médical. Tu peux débloquer de nouveaux ordres grâce au talent de l'Officier Médical.

actors.hero.talent.scar_attack.title=attaque de cicatrice
actors.hero.talent.scar_attack.desc=_+1 :_ L'attaque physique du Médecin inflige _1-1 dégâts en plus_ par effet négatif que l'ennemi possède.\n\n_+2 :_ L'attaque physique du Médecin inflige _1-2 dégâts en plus_ par effet négatif que l'ennemi possède.
actors.hero.talent.doctors_intuition.title=intuition du médecin
actors.hero.talent.doctors_intuition.desc=_+1 :_ Identifie _3 potions_ aléatoirement.\n\n_+2 :_ Identifie _5 potions_ aléatoirement.
actors.hero.talent.finish_attack.title=attaque finale
actors.hero.talent.finish_attack.desc=_+1 :_ L'attaque physique inflige _+2 dégâts_ supplémentaires quand l'ennemi a moins de 25% de PV.\n\n_+2 :_ L'attaque physique inflige _+3 dégâts_ supplémentaires quand l'ennemi a moins de 25% de PV.
actors.hero.talent.first_aid_treat.title=traitement de premiers secours
actors.hero.talent.first_aid_treat.desc=_+1 :_ Soigne 3 PV en subissant plus de _8_ dégâts. Il y a 50 tours de récupération.\n\n_+2 :_ Soigne 3 PV en subissant plus de _5_ dégâts. Il y a 50 tours de récupération.
actors.hero.talent.breakthrough.title=percée
actors.hero.talent.breakthrough.desc=_+1 :_ Augmente l'esquive de _1,2x_ par effet négatif.\n\n_+2 :_ Augmente l'esquive de _1,5x_ par effet négatif que possède le héros.

actors.hero.talent.healing_meal.title=repas guérisseur
actors.hero.talent.healing_meal.desc=_+1 :_ Manger de la nourriture prend au Médecin 1 tour et _purge tous les effets négatifs_.\n\n_+2 :_ En plus des bénéfices de +1, Soigne _3 PV_ si le héros n'avait aucun effet négatif.
actors.hero.talent.recycling.title=recyclage de potions
actors.hero.talent.recycling.desc=_+1 :_ En utilisant une potion, gagne _0-1_ pilules correspondant à cette potion.\n\n_+2 :_ En utilisant une potion, gagne _0-2_ pilules correspondant à cette potion.\n\nLes Potions de Force et les potions obtenues par Alchimie sont exclues.
actors.hero.talent.high_power.title=puissance accrue
actors.hero.talent.high_power.desc=_+1 :_ La performance du Canon à Rayons Gamma augmente de _+25%_, mais son temps de récupération augmente d'_1 tour_.\n\n_+2 :_ La performance du Canon à Rayons Gamma augmente de _+50%_, mais son temps de récupération augmente de _2 tours_.
actors.hero.talent.high_power.meta_desc=_Si ce talent est obtenu par un héros différent_, la puissance d'enchantement de l'arme sera augmentée de x1,1/x1,2 à la place.
actors.hero.talent.radiation.title=radiation
actors.hero.talent.radiation.desc=_+1 :_ En utilisant le Canon à Rayons Gamma sur un ennemi, inflige une mutation radioactive infligeant 1 dégât toutes les _5 tours_ jusqu'à ce que l'ennemi meure.\n\n_+2 :_ En utilisant le Canon à Rayons Gamma sur un ennemi, inflige une mutation radioactive infligeant 1 dégât toutes les _4 tours_ jusqu'à ce que l'ennemi meure.
actors.hero.talent.radiation.meta_desc=_Si ce talent est obtenu par un héros différent_, l'attaque physique du héros infligera à la place une mutation radioactive infligeant des dégâts toutes les 5/4 tours, avec 3% de chance.
actors.hero.talent.strong_healpower.title=puissance de soin accrue
actors.hero.talent.strong_healpower.desc=_+1 :_ Augmente la régénération naturelle de vie de _x1,1_.\n\n_+2 :_ Augmente la régénération naturelle de vie de _x1,2_.
actors.hero.talent.diet.title=au régime
actors.hero.talent.diet.desc=_+1 :_ La faim diminue _20%_ plus lentement.\n\n_+2 :_ La faim diminue _40%_ plus lentement.

actors.hero.talent.strong_nexus.title=nexus fort
actors.hero.talent.strong_nexus.desc=_+1 :_ En attaquant physiquement un ennemi, soigne jusqu'à _3_ alliés proches.\n\n_+2 :_ En attaquant physiquement un ennemi, soigne jusqu'à _6_ alliés proches.\n\n_+3 :_ En attaquant physiquement un ennemi, soigne jusqu'à _9_ alliés proches.\n\nPlus l'allié cible est éloigné du héros, moins la guérison est efficace. Cela ne s'applique pas aux alliés hors de vue.
actors.hero.talent.target_set.title=désignation de cible
actors.hero.talent.target_set.desc=_+1 :_ En touchant un ennemi ou allié avec une arme de jet ou une balle, les ennemis essaieront d'attaquer la cible, pendant _5 tours_ si la cible est un allié ou _1 tour_ si la cible est un ennemi.\n\n_+2 :_ En touchant un ennemi ou allié avec une arme de jet ou une balle, les ennemis essaieront d'attaquer la cible, pendant _10 tours_ si la cible est un allié ou _2 tours_ si la cible est un ennemi.\n\n_+3 :_ En touchant un ennemi ou allié avec une arme de jet ou une balle, les ennemis essaieront d'attaquer la cible, pendant _15 tours_ si la cible est un allié ou _3 tours_ si la cible est un ennemi.

actors.hero.talent.recruit.title=recrutement
actors.hero.talent.recruit.desc=_+1 :_ Le nombre maximal d'alliés pouvant être maintenus sur un étage augmente de _+1_.\n\n_+2 :_ Le nombre maximal d'alliés pouvant être maintenus sur un étage augmente de _+2_.\n\n_+3 :_ Le nombre maximal d'alliés pouvant être maintenus sur un étage augmente de _+3_.
actors.hero.talent.delayed_healing.title=guérison différée
actors.hero.talent.delayed_healing.desc=_+1 :_ En transformant un ennemi en allié, la cible reçoit un effet de guérison continue qui restaure _20%_ de sa vie maximale.\n\n_+2 :_ En transformant un ennemi en allié, la cible reçoit un effet de guérison continue qui restaure _40%_ de sa vie maximale.\n\n_+3 :_ En transformant un ennemi en allié, la cible reçoit un effet de guérison continue qui restaure _60%_ de sa vie maximale.
actors.hero.talent.appease.title=apaisement
actors.hero.talent.appease.desc=_+1 :_ La vie requise pour garantir la transformation en allié augmente à _10%_ de sa vie maximale.\n\n_+2 :_ La vie requise pour garantir la transformation en allié augmente à _15%_ de sa vie maximale.\n\n_+3 :_ La vie requise pour garantir la transformation en allié augmente à _20%_ de sa vie maximale.
actors.hero.talent.adrenaline.title=montée d'adrénaline
actors.hero.talent.adrenaline.desc=_+1 :_ Utiliser un canon à rayons gamma sur un allié ajoute _3 tours_ d'empoisonnement et d'adrénaline.\n\n_+2 :_ Utiliser un canon à rayons gamma sur un allié ajoute _6 tours_ d'empoisonnement et d'adrénaline.\n\n_+3 :_ Utiliser un canon à rayons gamma sur un allié ajoute _9 tours_ d'empoisonnement et d'adrénaline.\n\nCet effet ne se cumule pas.
actors.hero.talent.stimpack.title=rayon stimulant
actors.hero.talent.stimpack.desc=_+1 :_ Utiliser un canon à rayons gamma sur un allié augmente grandement les dégâts et la précision de cet allié pendant le _1 prochain tour_.\n\n_+2 :_ Utiliser un canon à rayons gamma sur un allié augmente grandement les dégâts et la précision de cet allié pendant les _2 prochains tours_.\n\n_+3 :_ Utiliser un canon à rayons gamma sur un allié augmente grandement les dégâts et la précision de cet allié pendant les _3 prochains tours_.
actors.hero.talent.medical_ray.title=rayon médical
actors.hero.talent.medical_ray.desc=_+1 :_ L'effet de guérison du canon à rayons gamma augmente de _+20%_.\n\n_+2 :_ L'effet de guérison du canon à rayons gamma augmente de _+40%_.\n\n_+3 :_ L'effet de guérison du canon à rayons gamma augmente de _+60%_.

actors.hero.talent.ointment.title=onguent
actors.hero.talent.ointment.desc=_+1 :_ La quantité totale de guérison en utilisant les premiers secours augmente de _+25%_, mais _50%_ de la guérison restante est consommée chaque tour.\n\n_+2 :_ La quantité totale de guérison en utilisant les premiers secours augmente de _+50%_, mais _33%_ de la guérison restante est consommée chaque tour.\n\n_+3 :_ La quantité totale de guérison en utilisant les premiers secours augmente de _+75%_, mais _25%_ de la guérison restante est consommée chaque tour.
actors.hero.talent.compress_bandage.title=bandage compressif
actors.hero.talent.compress_bandage.desc=_+1 :_ En utilisant les premiers secours, les dégâts subis sont réduits de 50% pour le _1 prochain tour_.\n\n_+2 :_ En utilisant les premiers secours, les dégâts subis sont réduits de 50% pour les _2 prochains tours_.\n\n_+3 :_ En utilisant les premiers secours, les dégâts subis sont réduits de 50% pour les _3 prochains tours_.
actors.hero.talent.antibiotics.title=antibiotiques
actors.hero.talent.antibiotics.desc=_+1 :_ En utilisant les premiers secours, tous les _effets néfastes actuellement subis_ sont retirés.\n\n_+2 :_ En plus de l'effet +1, utiliser les premiers secours accorde un _effet de bouclier de purification de 3 tours_.\n\n_+3 :_ En plus de l'effet +2, utiliser les premiers secours accorde un _effet de purification de 3 tours_.
actors.hero.talent.quick_prepare.title=préparation rapide
actors.hero.talent.quick_prepare.desc=_+1 :_ Les premiers secours peuvent être utilisés après _50 tours_ même sans vaincre d'ennemi.\n\n_+2 :_ Les premiers secours peuvent être utilisés après _30 tours_ même sans vaincre d'ennemi.\n\n_+3 :_ Les premiers secours peuvent être utilisés après _20 tours_ même sans vaincre d'ennemi.
actors.hero.talent.splint.title=attelle
actors.hero.talent.splint.desc=_+1 :_ En utilisant les premiers secours, un déplacement d'_1 tour_ est instantanément autorisé.\n\n_+2 :_ En utilisant les premiers secours, un déplacement de _2 tours_ est instantanément autorisé.\n\n_+3 :_ En utilisant les premiers secours, un déplacement de _3 tours_ est instantanément autorisé.
actors.hero.talent.defibrillator.title=émission d'onde de choc
actors.hero.talent.defibrillator.desc=_+1 :_ En utilisant les premiers secours, un effet de foudre en chaîne infligeant des dégâts aux ennemis proches égaux à _1x_ la quantité de guérison est déclenché.\n\n_+2 :_ En utilisant les premiers secours, un effet de foudre en chaîne infligeant des dégâts aux ennemis proches égaux à _2x_ la quantité de guérison est déclenché.\n\n_+3 :_ En utilisant les premiers secours, un effet de foudre en chaîne infligeant des dégâts aux ennemis proches égaux à _3x_ la quantité de guérison est déclenché.

actors.hero.talent.move_cmd.title=ordre de mouvement
actors.hero.talent.move_cmd.desc=_+1 :_ Gagne l'autorité de donner un _ordre de mouvement_ qui déplace tous les soldats alliés dans la ligne de vue vers l'emplacement spécifié.\n\n_+2 :_ En plus de l'effet +1, l'ordre de mouvement ne consomme pas de _droits de commandement militaire_.\n\n_+3 :_ En plus de l'effet +2, l'ordre de mouvement déplace _tous les soldats alliés sur l'étage actuel_.
actors.hero.talent.stimpack_cmd.title=ordre de stimpack
actors.hero.talent.stimpack_cmd.desc=_+1 :_ Gagne l'autorité de donner un _ordre de stimulant de combat_ qui augmente les dégâts et la précision de tous les soldats alliés dans la ligne de vue pendant _5 tours_.\n\n_+2 :_ En plus de l'effet +1, l'effet du stimulant de combat dure _10 tours_.\n\n_+3 :_ En plus de l'effet +1, l'effet du stimulant de combat dure _15 tours_.
actors.hero.talent.engineer_cmd.title=ordre d'ingénieur
actors.hero.talent.engineer_cmd.desc=_+1 :_ Gagne l'autorité de donner un _ordre d'ingénieur_ qui installe une _Tourelle Mitrailleuse_ à l'emplacement spécifié.\n\n_+2 :_ En plus de l'effet +1, l'ordre d'ingénieur construira aussi de l'_artillerie_.\n\n_+3 :_ En plus de l'effet +1, l'ordre d'ingénieur construira aussi un _mortier_.
actors.hero.talent.promote_cmd.title=ordre de promotion
actors.hero.talent.promote_cmd.desc=_+1 :_ Gagne l'autorité de donner un _ordre de promotion_ qui transforme un soldat allié à l'emplacement spécifié en _tireur d'élite, porteur de bouclier, ou artificier_.\n\n_+2 :_ En plus de l'effet +1, l'ordre de promotion restaure entièrement la vie du soldat promu.\n\n_+3 :_ En plus de l'effet +2, l'ordre de promotion consomme _1 droit de commandement de moins_.
actors.hero.talent.explosion_cmd.title=ordre d'installation explosive
actors.hero.talent.explosion_cmd.desc=_+1 :_ Gagne l'autorité de donner un _ordre d'installation explosive_ qui déclenche une explosion dans un rayon de _3 cases_ à l'emplacement spécifié après _10 tours_.\n\n_+2 :_ En plus de l'effet +1, le rayon d'explosion augmente à _6 cases_.\n\n_+3 :_ En plus de l'effet +1, le rayon d'explosion augmente à _9 cases_.
actors.hero.talent.cas_cmd.title=ordre de soutien aérien rapproché
actors.hero.talent.cas_cmd.desc=_+1 :_ Gagne l'autorité de demander un soutien aérien rapproché qui déclenche une explosion dans un rayon de _5 cases_ de la direction spécifiée depuis l'emplacement du héros.\n\n_+2 :_ En plus de l'effet +1, la distance maximale pouvant être spécifiée augmente à _8 cases_.\n\n_+3 :_ En plus de l'effet +1, la distance maximale pouvant être spécifiée augmente à _11 cases_.

actors.hero.abilities.medic.healinggenerator.name=régénérateur
actors.hero.abilities.medic.healinggenerator.short_desc=Le Médecin peut activer le _régénérateur_ pour soigner les alliés proches chaque fois qu'ils attaquent un ennemi pendant une certaine période.
actors.hero.abilities.medic.healinggenerator.desc=Le Médecin peut activer le régénérateur et soigner les alliés proches chaque fois qu'ils attaquent un ennemi pendant les 20 prochains tours. L'allié le plus proche récupère 8 points de vie, la quantité de guérison diminuant avec la distance.
actors.hero.abilities.medic.angelwing.name=aile d'ange
actors.hero.abilities.medic.angelwing.short_desc=Le Médecin peut utiliser l'_aile d'ange_ pour voler dans les airs à grande vitesse.
actors.hero.abilities.medic.angelwing.desc=Le Médecin fusionne avec un ange et déploie temporairement des ailes d'ange, lui permettant de voler dans les airs à trois fois la vitesse normale pendant les 20 prochains tours.
actors.hero.abilities.medic.angelwing$angelwingbuff.name=aile d'ange
actors.hero.abilities.medic.angelwing$angelwingbuff.desc=Des ailes d'ange faites de lumière scintillent dans ton dos. Tant que le pouvoir de l'aile d'ange est maintenu, tu pourras flotter dans les airs et te déplacer à trois fois ta vitesse normale.\n\nTours restants : %s.
actors.hero.abilities.medic.gammarayemmit.name=émission de rayons gamma
actors.hero.abilities.medic.gammarayemmit.short_desc=Le Médecin peut émettre une puissante _émission de rayons gamma_ qui transforme les ennemis en un type différent.
actors.hero.abilities.medic.gammarayemmit.desc=Le Médecin peut brièvement augmenter la puissance de son émetteur de rayons gamma pour émettre un rayon gamma qui transforme un ennemi en un type complètement différent.\n\nL'ennemi transformé sera l'un des ennemis du 1er au 6e palier, sans égard pour sa forme d'origine.

actors.hero.talent.healing_amp.title=guérison amplifiée
actors.hero.talent.healing_amp.desc=_+1 :_ La quantité de guérison initiale augmente de _+2_.\n\n_+2 :_ La quantité de guérison initiale augmente de _+4_.\n\n_+3 :_ La quantité de guérison initiale augmente de _+6_.\n\n_+4 :_ La quantité de guérison initiale augmente de _+8_.
actors.hero.talent.shield_gen.title=générateur de bouclier
actors.hero.talent.shield_gen.desc=_+1 :_ Pour chaque allié soigné par le régénérateur, gagne _1_ bouclier.\n\n_+2 :_ Pour chaque allié soigné par le régénérateur, gagne _2_ boucliers.\n\n_+3 :_ Pour chaque allié soigné par le régénérateur, gagne _3_ boucliers.\n\n_+4 :_ Pour chaque allié soigné par le régénérateur, gagne _4_ boucliers.\n\nS'applique à un maximum de 8 alliés.\n\nLes boucliers peuvent s'accumuler jusqu'à 80% de la vie maximale.
actors.hero.talent.durable_gen.title=générateur durable
actors.hero.talent.durable_gen.desc=_+1 :_ La durée du régénérateur augmente de _+25%_.\n\n_+2 :_ La durée du régénérateur augmente de _+50%_.\n\n_+3 :_ La durée du régénérateur augmente de _+75%_.\n\n_+4 :_ La durée du régénérateur augmente de _+100%_.

actors.hero.talent.light_like_feather.title=léger comme une plume
actors.hero.talent.light_like_feather.desc=_+1 :_ Après la fin de l'effet des ailes d'ange, tu ne subis pas de dégâts de chute pendant _2 tours_.\n\n_+2 :_ Après la fin de l'effet des ailes d'ange, tu ne subis pas de dégâts de chute pendant _4 tours_.\n\n_+3 :_ Après la fin de l'effet des ailes d'ange, tu ne subis pas de dégâts de chute pendant _6 tours_.\n\n_+4 :_ Après la fin de l'effet des ailes d'ange, tu ne subis pas de dégâts de chute pendant _8 tours_.
actors.hero.talent.angels_bless.title=bénédiction de l'ange
actors.hero.talent.angels_bless.desc=_+1 :_ En utilisant les ailes d'ange, tu gagnes la bénédiction pendant _10 tours_.\n\n_+2 :_ En utilisant les ailes d'ange, tu gagnes la bénédiction pendant _20 tours_.\n\n_+3 :_ En utilisant les ailes d'ange, tu gagnes la bénédiction pendant _30 tours_.\n\n_+4 :_ En utilisant les ailes d'ange, tu gagnes la bénédiction pendant _40 tours_.
actors.hero.talent.healing_wing.title=aile guérisseuse
actors.hero.talent.healing_wing.desc=_+1 :_ Tant que l'effet des ailes d'ange dure, la performance du canon à rayons gamma augmente de _2x_.\n\n_+2 :_ Tant que l'effet des ailes d'ange dure, la performance du canon à rayons gamma augmente de _3x_.\n\n_+3 :_ Tant que l'effet des ailes d'ange dure, la performance du canon à rayons gamma augmente de _4x_.\n\n_+4 :_ Tant que l'effet des ailes d'ange dure, la performance du canon à rayons gamma augmente de _5x_.

actors.hero.talent.transmog_bias.title=biais de transmutation
actors.hero.talent.transmog_bias.desc=_+1 :_ La chance que les ennemis touchés par l'émission de rayons gamma mutent en ennemis plus faibles est _légèrement augmentée_.\n\n_+2 :_ La chance que les ennemis touchés par l'émission de rayons gamma mutent en ennemis plus faibles est _augmentée_.\n\n_+3 :_ La chance que les ennemis touchés par l'émission de rayons gamma mutent en ennemis plus faibles est _grandement augmentée_.\n\n_+4 :_ La chance que les ennemis touchés par l'émission de rayons gamma mutent en ennemis plus faibles est _considérablement augmentée_.
actors.hero.talent.imprinting_effect.title=effet d'empreinte
actors.hero.talent.imprinting_effect.desc=_+1 :_ Les ennemis mutés ont _10%_ de chance de devenir alliés.\n\n_+2 :_ Les ennemis mutés ont _20%_ de chance de devenir alliés.\n\n_+3 :_ Les ennemis mutés ont _30%_ de chance de devenir alliés.\n\n_+4 :_ Les ennemis mutés ont _40%_ de chance de devenir alliés.
actors.hero.talent.sheep_transmog.title=transmutation en mouton
actors.hero.talent.sheep_transmog.desc=_+1 :_ Les ennemis touchés par l'émission de rayons gamma ont _1%_ de chance de se transformer en mouton.\n\n_+2 :_ Les ennemis touchés par l'émission de rayons gamma ont _2%_ de chance de se transformer en mouton.\n\n_+3 :_ Les ennemis touchés par l'émission de rayons gamma ont _3%_ de chance de se transformer en mouton.\n\n_+4 :_ Les ennemis touchés par l'émission de rayons gamma ont _4%_ de chance de se transformer en mouton.

actors.hero.talent$firstaidtreatcooldown.name=Récupération : Traitement de Premiers Secours
actors.hero.talent$firstaidtreatcooldown.desc=Tu as récemment utilisé ce talent, donc il faudra du temps pour le réutiliser.\n\nTours restants : %s.
actors.hero.talent$wndidentify.name=Intuition du Médecin
actors.hero.talent$wndidentify.desc=Les objets suivants ont été identifiés :

actors.buffs.radioactivemutation.name=mutation radioactive
actors.buffs.radioactivemutation.desc=Cette cible a été exposée à une radiation mortelle, et ses cellules mutent progressivement.\n\nLes mutations radioactives attaquent lentement la cible, la faisant mourir peu à peu. Si tu as cela, tu devras trouver un moyen d'éliminer complètement cet effet...\n\nTours restants avant les prochains dégâts : _%s_.
actors.buffs.radioactivemutation.ondeath=Tu es mort de mutation radioactive...

actors.buffs.stimpack.name=stimpack
actors.buffs.stimpack.desc=Le Stimpack améliore grandement les capacités de combat de la cible, augmentant les dégâts d'attaque de +30%% et la précision de +60%%.\n\nTours restants : %s.

actors.buffs.firstaidbuff.action_name=Premiers Secours
actors.buffs.firstaidbuff$firstaidbuffcooldown.name=Récupération : Premiers Secours
actors.buffs.firstaidbuff$firstaidbuffcooldown.desc_kill=Tu as récemment utilisé cette capacité, tu devras vaincre un ennemi pour la réutiliser.
actors.buffs.firstaidbuff$firstaidbuffcooldown.desc=Tu as récemment utilisé cette capacité, tu devras vaincre un ennemi ou attendre pour la réutiliser.\n\nTours restants : %s.

actors.buffs.painkiller.name=résistance à la douleur
actors.buffs.painkiller.desc=Tu as gagné une résistance à la douleur, et les dégâts que tu reçois pendant un court moment ont été grandement réduits.\n\nla résistance à la douleur réduit tous les dégâts subis de 50%%.\n\nTours restants : %s.

actors.buffs.command.action_name=Commander
actors.buffs.command.bad_target=Tu ne peux pas choisir cette position.
actors.buffs.command.prompt=Choisis la position à commander
actors.buffs.command.title=Choisis l'Ordre
actors.buffs.command.no_space=Aucun espace ici.
actors.buffs.command.no_allies=Il n'y a aucun allié à soigner.
actors.buffs.command.no_allies_to_cmd=Il n'y a aucun allié à opérer.
actors.buffs.command.charge_req=(%d Autorité)
actors.buffs.command$commandmove.recruit.name=Ordre de Recrutement
actors.buffs.command$commandmove.recruit.desc=Recrute 1 force de soutien sur une case proche. Utilise 1 autorité supplémentaire par force de soutien déjà recrutée.
actors.buffs.command$commandmove.medical_support.name=Ordre de Soutien Médical
actors.buffs.command$commandmove.medical_support.desc=Soigne les forces de soutien dans le champ de vision du héros de _20%_ de leur vie maximale.
actors.buffs.command$commandmove.move.name=Ordre de Mouvement
actors.buffs.command$commandmove.move.desc1=Dirige les forces de soutien _dans le champ de vision du héros_ vers la case ciblée.
actors.buffs.command$commandmove.move.desc2=Dirige _toutes les forces de soutien_ vers la case ciblée.
actors.buffs.command$commandmove.stimpack.name=Ordre de Stimpack
actors.buffs.command$commandmove.stimpack.desc=Applique _%d tour_ de stimpack aux forces de soutien dans le champ de vision du héros.
actors.buffs.command$commandmove.engineer.name=Ordre d'Ingénieur
actors.buffs.command$commandmove.engineer.desc1=Installe une _Tourelle Mitrailleuse_ à la case ciblée.
actors.buffs.command$commandmove.engineer.desc2=Installe un _canon_ à la case ciblée.
actors.buffs.command$commandmove.engineer.desc3=Installe un _mortier_ à la case ciblée.
actors.buffs.command$commandmove.promote.name=Ordre de Promotion
actors.buffs.command$commandmove.promote.desc=Promeut aléatoirement une force de soutien en _tireur d'élite, porteur de bouclier, ou artificier_.
actors.buffs.command$commandmove.explosion.name=Ordre d'Installation Explosive
actors.buffs.command$commandmove.explosion.desc=Installe un explosif qui souffle un rayon de _%d cases_ à la case ciblée. Si tu tues un ennemi avec cette capacité, tu gagnes une autorité supplémentaire qui peut s'accumuler au-delà du maximum.
actors.buffs.command$commandmove.close_air_support.name=Ordre de Soutien Aérien Rapproché
actors.buffs.command$commandmove.close_air_support.desc=Demande un _Soutien Aérien Rapproché_ qui souffle jusqu'à _%d cases_ depuis la case du héros jusqu'à la case ciblée. Si tu tues un ennemi avec cette capacité, tu gagnes une autorité supplémentaire qui peut s'accumuler au-delà du maximum.
actors.buffs.command$supportsoldier.name=Force de Soutien
actors.buffs.command$supportsoldier.desc=Un soldat de l'armée régulière envoyé pour te soutenir.\n\nIl essaiera généralement d'attaquer les ennemis distants, et tu peux aussi attaquer les ennemis proches.
actors.buffs.command$supportsniper.name=Force de Soutien : Tireur d'Élite
actors.buffs.command$supportsniper.desc=Un tireur d'élite de l'armée régulière envoyé pour te soutenir.\n\nIl essaiera généralement d'attaquer les ennemis distants, et tu peux aussi attaquer les ennemis proches.\n\nLes tireurs d'élite ont moins de PV et de défense que les forces de soutien régulières, mais ont plus de dégâts et de précision.
actors.buffs.command$supportshielder.name=Force de Soutien : Porteur de Bouclier
actors.buffs.command$supportshielder.desc=Un porteur de bouclier de l'armée régulière envoyé pour te soutenir.\n\nIl essaiera généralement de s'approcher pour attaquer l'ennemi, et peut diriger l'attention de l'ennemi attaquant vers lui-même. En attaquant, il paralyse parfois l'ennemi.\n\nLes porteurs de bouclier ont moins de dégâts que les forces de soutien régulières, mais ont plus de PV et de défense.
actors.buffs.command$supportbomber.name=Force de Soutien : Artificier
actors.buffs.command$supportbomber.desc=Un artificier de l'armée régulière envoyé pour te soutenir.\n\nIl essaiera généralement d'attaquer les ennemis distants, et tu peux aussi attaquer les ennemis proches.\n\nLes artificiers ont moins de précision que les forces de soutien régulières, mais tirent une balle explosive qui inflige plus de dégâts.

#v3.21.0
actors.blobs.thundercloud.desc=Un nuage sombre de foudre tourbillonne ici.

#3.22.0
actors.buffs.revealedlargearea.name=zone révélée
actors.buffs.revealedlargearea.desc=Une zone du donjon a été temporairement révélée au héros, il la verra où qu'il soit.\n\nTours restants : %s.

### phrases de l'enchanteur
actors.hero.herosubclass.enchanter=Enchanteur
actors.hero.herosubclass.enchanter_short_desc=L'_Enchanteur_ gagne un sort qui utilise les affaiblissements des ennemis pour attaquer, et peut apprendre divers nouveaux sorts qui affaiblissent les ennemis ou renforcent les alliés via son talent.
actors.hero.herosubclass.enchanter_desc=L'Enchanteur peut apprendre divers sorts axés sur son propre renforcement et l'affaiblissement de l'ennemi. L'Enchanteur peut aussi infliger des affaiblissements à la cible en utilisant _lumière guide_, _amplification temporelle_, _malédiction affaiblissante_, sort d'_étourdissement_ sur l'ennemi. Les affaiblissements peuvent s'appliquer plusieurs fois si le sort est utilisé avec plus d'1 charge.\n\nL'Enchanteur obtient aussi un sort d'_Explosion de Sort_, utilisant 2 charges, retire tous les affaiblissements de la cible et cause des dégâts proportionnels au niveau du héros pour chaque affaiblissement retiré. Si tu tues l'ennemi avec ce sort, tu récupères la charge dépensée.

### talents supplémentaires de clerc
actors.hero.talent.warding_light.title=Lumière Protectrice
actors.hero.talent.warding_light.desc=_+1 :_ Gagne _3_ barrière en attaquant physiquement un ennemi illuminé par la _Lumière Guide_.\n\n_+2 :_ Gagne _5_ barrière en attaquant physiquement un ennemi illuminé par la _Lumière Guide_.
actors.hero.talent.warding_light.meta_desc=_Si ce talent est obtenu par un héros différent_ il accordera plutôt 3/5 boucliers après qu'une baguette ou un artefact soit utilisé sur un ennemi, avec un temps de récupération de 20 tours.

actors.hero.talent.divine_blast.title=Explosion Divine
actors.hero.talent.divine_blast.desc=_+1 :_ Le Clerc peut lancer l'_Explosion Divine_, un sort qui paralyse un ennemi au point ciblé et repousse d'_1 case_ les ennemis autour du point au coût de 2 charges.\n\n_+2 :_ Le Clerc peut lancer l'_Explosion Divine_, un sort qui paralyse un ennemi au point ciblé et repousse de _2 cases_ les ennemis autour du point au coût de 2 charges.
actors.hero.talent.divine_blast.meta_desc=_Si ce talent est obtenu par un héros différent_ attaquer physiquement repoussera l'ennemi d'1 case avec 20%/40% de chance.

### talents du prêtre
actors.hero.talent.divine_ray.title=Rayon Divin
actors.hero.talent.divine_ray.desc=_+1 :_ Le Prêtre peut lancer le _Rayon Divin_, un sort qui tire un rayon infligeant 8-16 dégâts aux ennemis et soignant 8-16 PV aux alliés sur une _distance de 4_ au coût de 3 charges. Le rayon peut pénétrer le terrain et illumine les ennemis touchés par le rayon.\n\n_+2 :_ Le Prêtre peut lancer le _Rayon Divin_, un sort qui tire un rayon infligeant 8-16 dégâts aux ennemis et soignant 8-16 PV aux alliés sur une _distance de 8_ au coût de 3 charges. Le rayon peut pénétrer le terrain et illumine les ennemis touchés par le rayon.\n\n_+3 :_ Le Prêtre peut lancer le _Rayon Divin_, un sort qui tire un rayon infligeant 8-16 dégâts aux ennemis et soignant 8-16 PV aux alliés sur une _distance de 12_ au coût de 3 charges. Le rayon peut pénétrer le terrain et illumine les ennemis touchés par le rayon.\n\nLa zone traversée par le rayon sera révélée à la vision du Prêtre, et révélera les secrets cachés. Le Rayon Divin inflige toujours les dégâts maximaux aux démons et morts-vivants. Les PV soignés en excès par ce sort seront convertis en barrière.
actors.hero.talent.holy_bomb.title=Bombe Sacrée
actors.hero.talent.holy_bomb.desc=_+1 :_ Le Prêtre peut lancer la _Bombe Sacrée_, un sort qui invoque une bombe sacrée qui explosera instantanément et illuminera les ennemis à la case ciblée au coût de _3_ charges.\n\n_+2 :_ Le Prêtre peut lancer la _Bombe Sacrée_, un sort qui invoque une bombe sacrée qui explosera instantanément et illuminera les ennemis à la case ciblée au coût de _2_ charges.\n\n_+3 :_ Le Prêtre peut lancer la _Bombe Sacrée_, un sort qui invoque une bombe sacrée qui explosera instantanément et illuminera les ennemis à la case ciblée au coût d'_1_ charge.\n\nIl y aura 50 tours de récupération.
actors.hero.talent.resurrection.title=Résurrection
actors.hero.talent.resurrection.desc=_+1 :_ Le Prêtre peut lancer la _Résurrection_, un sort puissant qui peut rendre le Prêtre immunisé à la mort pendant _3 tours_ au coût de 3. Quand le Prêtre meurt pendant l'effet de résurrection, cela active l'effet d'ankh béni pour résister à la mort.\n\n_+2 :_ Le Prêtre peut lancer la _Résurrection_, un sort puissant qui peut rendre le Prêtre immunisé à la mort pendant _4 tours_ au coût de 3. Quand le Prêtre meurt pendant l'effet de résurrection, cela active l'effet d'ankh béni pour résister à la mort.\n\n_+3 :_ Le Prêtre peut lancer la _Résurrection_, un sort puissant qui peut rendre le Prêtre immunisé à la mort pendant _3 tours_ au coût de 3. Quand le Prêtre meurt pendant l'effet de résurrection, cela active l'effet d'ankh béni pour résister à la mort.\n\nLa quantité de guérison est de 40% de l'ankh béni régulier. En surmontant la mort avec l'effet de résurrection, il y aura 300 tours de récupération.

### talents du paladin
actors.hero.talent.holy_mantle.title=Manteau Sacré
actors.hero.talent.holy_mantle.desc=_+1 :_ Le Paladin peut lancer le _Manteau Sacré_, un sort qui réduit tous dégâts qui seront infligés la prochaine fois de _50%_ une fois au coût de 1.\n\n_+1 :_ Le Paladin peut lancer le _Manteau Sacré_, un sort qui réduit tous dégâts qui seront infligés la prochaine fois de _75%_ une fois au coût de 1.\n\n_+1 :_ Le Paladin peut lancer le _Manteau Sacré_, un sort qui réduit tous dégâts qui seront infligés la prochaine fois de _100%_ une fois au coût de 1.
actors.hero.talent.power_of_life.title=Pouvoir de Vie
actors.hero.talent.power_of_life.desc=_+1 :_ Le Paladin peut lancer le _Pouvoir de Vie_, un sort qui convertit _20%_ des PV actuels du Paladin en x2 de barrière au coût de 2 charges. De plus, le Paladin soignera _20%_ des dégâts physiques infligés tant que la barrière subsiste.\n\n_+2 :_ Le Paladin peut lancer le _Pouvoir de Vie_, un sort qui convertit _40%_ des PV actuels du Paladin en x2 de barrière au coût de 2 charges. De plus, le Paladin soignera _40%_ des dégâts physiques infligés tant que la barrière subsiste.\n\n_+3 :_ Le Paladin peut lancer le _Pouvoir de Vie_, un sort qui convertit _60%_ des PV actuels du Paladin en x2 de barrière au coût de 2 charges. De plus, le Paladin soignera _60%_ des dégâts physiques infligés tant que la barrière subsiste.\n\nPour lancer le Pouvoir de Vie, le Paladin doit avoir au moins 5 PV. La quantité maximale de guérison sera égale aux PV dépensés.
actors.hero.talent.induce_aggro.title=Induction d'Agression
actors.hero.talent.induce_aggro.desc=_+1 :_ Le Paladin peut lancer l'_Induction d'Agression_, un sort qui induit toutes les attaques vers la cible pendant _3 tours_ au coût d'1 charge. La durée de l'effet sera x3 pour les alliés.\n\n_+2 :_ Le Paladin peut lancer l'_Induction d'Agression_, un sort qui induit toutes les attaques vers la cible pendant _4 tours_ au coût d'1 charge. La durée de l'effet sera x3 pour les alliés.\n\n_+3 :_ Le Paladin peut lancer l'_Induction d'Agression_, un sort qui induit toutes les attaques vers la cible pendant _5 tours_ au coût d'1 charge. La durée de l'effet sera x3 pour les alliés.

### talents de l'enchanteur
actors.hero.talent.time_amp.title=Amplification Temporelle
actors.hero.talent.time_amp.desc=_+1 :_ L'Enchanteur peut lancer l'_Amplification Temporelle_, un sort qui ne dépense pas de tour à lancer et ralentit l'ennemi ciblé de _4 tours_ ou applique _2 tours_ de Bulle Temporelle à l'allié ciblé au coût d'1 charge.\n\n_+2 :_ L'Enchanteur peut lancer l'_Amplification Temporelle_, un sort qui ne dépense pas de tour à lancer et ralentit l'ennemi ciblé de _6 tours_ ou applique _3 tours_ de Bulle Temporelle à l'allié ciblé au coût d'1 charge.\n\n_+3 :_ L'Enchanteur peut lancer l'_Amplification Temporelle_, un sort qui ne dépense pas de tour à lancer et ralentit l'ennemi ciblé de _8 tours_ ou applique _4 tours_ de Bulle Temporelle à l'allié ciblé au coût d'1 charge.
actors.hero.talent.weakening_hex.title=Malédiction Affaiblissante
actors.hero.talent.weakening_hex.desc=_+1 :_ L'Enchanteur peut lancer la _Malédiction Affaiblissante_, un sort qui _Maudit_ un ennemi pendant 10 tours au coût de 2 charges.\n\n_+2 :_ L'Enchanteur peut lancer la _Malédiction Affaiblissante_, un sort qui _Maudit_ et _Affaiblit_ un ennemi pendant 10 tours au coût de 2 charges.\n\n_+3 :_ L'Enchanteur peut lancer la _Malédiction Affaiblissante_, un sort qui _Maudit_, _Affaiblit_, et rend un ennemi _Vulnérable_ pendant 10 tours au coût de 2 charges.
actors.hero.talent.stun.title=Étourdissement
actors.hero.talent.stun.desc=_+1 :_ L'Enchanteur peut lancer l'_Étourdissement_, un sort qui paralyse un ennemi pendant _4 tours_ au coût d'1 charge.\n\n_+2 :_ L'Enchanteur peut lancer l'_Étourdissement_, un sort qui paralyse un ennemi pendant _5 tours_ au coût d'1 charge.\n\n_+3 :_ L'Enchanteur peut lancer l'_Étourdissement_, un sort qui paralyse un ennemi pendant _6 tours_ au coût d'1 charge.
actors.hero.talent.thunder_imbue.title=Imprégnation de Foudre
actors.hero.talent.thunder_imbue.desc=_+1 :_ L'Enchanteur peut lancer l'_Imprégnation de Foudre_, un sort qui applique à un allié l'imprégnation de foudre pendant _10 tours_ au coût de 2 charges.\n\n_+2 :_ L'Enchanteur peut lancer l'_Imprégnation de Foudre_, un sort qui applique à un allié l'imprégnation de foudre pendant _20 tours_ au coût de 2 charges.\n\n_+3 :_ L'Enchanteur peut lancer l'_Imprégnation de Foudre_, un sort qui applique à un allié l'imprégnation de foudre pendant _30 tours_ au coût de 2 charges.
actors.hero.talent.arcane_armor.title=Armure Arcanique
actors.hero.talent.arcane_armor.desc=_+1 :_ L'Enchanteur peut lancer l'_Armure Arcanique_, un sort qui s'applique à lui-même un effet bloquant 0-1 dégâts magiques qui diminue toutes les _10 tours_ au coût d'1 charge. L'Armure Arcanique peut être lancée en double.\n\n_+2 :_ L'Enchanteur peut lancer l'_Armure Arcanique_, un sort qui s'applique à lui-même un effet bloquant 0-1 dégâts magiques qui diminue toutes les _20 tours_ au coût d'1 charge. L'Armure Arcanique peut être lancée en double.\n\n_+3 :_ L'Enchanteur peut lancer l'_Armure Arcanique_, un sort qui s'applique à lui-même un effet bloquant 0-1 dégâts magiques qui diminue toutes les _10 tours_ au coût d'1 charge. L'Armure Arcanique peut être lancée en double.\n\nLa défense magique maximale ne peut pas dépasser le niveau actuel du héros.
actors.hero.talent.enchant.title=Enchanter
actors.hero.talent.enchant.desc=_+1 :_ L'Enchanteur peut lancer _Enchanter_, un sort qui enchante l'arme ou l'armure sélectionnée au coût de _6_ charges.\n\n_+2 :_ L'Enchanteur peut lancer _Enchanter_, un sort qui enchante l'arme ou l'armure sélectionnée au coût de _5_ charges.\n\n_+3 :_ L'Enchanteur peut lancer _Enchanter_, un sort qui enchante l'arme ou l'armure sélectionnée au coût de _4_ charges.\n\nEnchanter ne peut enchanter que l'arme ou l'armure qui est identifiée et non maudite.

### sorts supplémentaires du clerc
actors.hero.spells.clericspell.no_target=Il n'y a aucune cible.
actors.hero.spells.clericspell.not_in_fov=Tu ne peux pas choisir une case hors de ton champ de vision.

actors.hero.spells.divineblast.name=Explosion Divine
actors.hero.spells.divineblast.short_desc=Repousse les ennemis autour de la case ciblée.
actors.hero.spells.divineblast.desc=Le Clerc peut créer une onde de choc à la case ciblée dans son champ de vision.\n\nL'ennemi sur la case ciblée est brièvement paralysé, et les personnages autour de la case sont repoussés de _%d cases_.

actors.hero.spells.divineray.name=Rayon Divin
actors.hero.spells.divineray.short_desc=Tire un rayon qui blesse les ennemis et soigne les alliés.
actors.hero.spells.divineray.desc=Le Prêtre peut tirer un rayon divin qui pénètre le terrain et a une portée de _%d cases_ vers la direction ciblée.\n\nLe rayon inflige 8-16 dégâts aux ennemis et les illumine, ou soigne 8-16 PV pour les alliés. Les morts-vivants et démons subissent toujours les dégâts maximaux. Les PV soignés au-delà de leur maximum seront convertis en barrière.\n\nLe rayon révélera les secrets de la zone qu'il traverse, et cette zone sera visible pour le Prêtre pendant 3 tours.
actors.hero.spells.divineray.cannot_self=Le Rayon Divin ne peut pas être tiré sur toi-même.

actors.hero.spells.holybombspell.name=Bombe Sacrée
actors.hero.spells.holybombspell.short_desc=Génère une explosion causant d'énormes dégâts aux démons et morts-vivants.
actors.hero.spells.holybombspell.desc=Le Prêtre peut invoquer une bombe sacrée qui explose instantanément à la case ciblée.\n\nL'explosion illuminera les ennemis affectés.
actors.hero.spells.holybombspell$holybombspellcooldown.name=récupération de bombe sacrée
actors.hero.spells.holybombspell$holybombspellcooldown.desc=Le Prêtre a récemment lancé la Bombe Sacrée, et doit attendre avant de la relancer.\n\nTours restants : %s.

actors.hero.spells.resurrection.name=Résurrection
actors.hero.spells.resurrection.short_desc=Devient immunisé à la mort pendant une courte période.
actors.hero.spells.resurrection.desc=Le Prêtre peut résister à la mort pendant _%d tours_ avec l'effet de résurrection.\n\nSi les PV du Prêtre atteignent 0 tandis que la résurrection existe, cela activera l'effet d'ankh béni pour résister à la mort. Cependant, la quantité de guérison sera de 40%% de l'ankh béni régulier.\n\nL'effet de Résurrection s'activera avant les objets ankh.
actors.hero.spells.resurrection$resurrectionbuff.name=Résurrection
actors.hero.spells.resurrection$resurrectionbuff.desc=Tu as reçu une protection divine et es devenu immunisé à la mort !\n\nSi tes PV atteignent 0 tandis que l'effet de résurrection existe, cela te soignera de 10%% de tes PV maximaux et te rendra immunisé aux dégâts pendant une courte période.\n\nTours restants : %s.
actors.hero.spells.resurrection$resurrectioncooldown.name=Récupération de Résurrection
actors.hero.spells.resurrection$resurrectioncooldown.desc=Le Prêtre a récemment surmonté la mort grâce à l'effet de résurrection. Tu dois attendre avant de relancer le sort.\n\nTours restants : %s.

actors.hero.spells.holymantle.name=Manteau Sacré
actors.hero.spells.holymantle.short_desc=Affecte l'effet de réduction de dégâts sur la cible une fois.
actors.hero.spells.holymantle.desc=Le Paladin applique l'effet du manteau sacré qui réduit tous dégâts de _%d%%_ à une cible.\n\nL'effet du manteau sacré atténuera les dégâts et disparaîtra si la cible subit des dégâts de quelque façon que ce soit. Fais attention aux dégâts de famine.
actors.hero.spells.holymantle$holymantlebuff.name=Manteau Sacré
actors.hero.spells.holymantle$holymantlebuff.desc=Cette cible est actuellement couverte par le pouvoir du manteau sacré !\n\nLe Manteau Sacré réduira la prochaine instance de dégâts de _%d%%_ puis disparaîtra.

actors.hero.spells.poweroflife.name=Pouvoir de Vie
actors.hero.spells.poweroflife.short_desc=Convertit immédiatement une partie de tes PV en une grande quantité de bouclier.
actors.hero.spells.poweroflife.desc=Le Paladin dépense _%1$d_ PV et gagne instantanément _%2$d_ barrière en utilisant le pouvoir de vie. Tu restaureras _%3$d%%_ des dégâts infligés en PV chaque fois que tu attaques physiquement un ennemi, tant que la barrière subsiste.\n\nTu dois avoir au moins 5 PV pour utiliser le sort. La quantité de guérison sera égale à la quantité de PV dépensés.
actors.hero.spells.poweroflife$poweroflifebarrier.name=Barrière de Vie
actors.hero.spells.poweroflife$poweroflifebarrier.desc=Tu as converti ta force vitale en une barrière temporaire, donc tu peux maintenant bloquer plus de dégâts.\n\nTu restaureras _%1$d%%_ des dégâts infligés en PV chaque fois que tu attaques physiquement un ennemi, tant que la barrière de vie subsiste.\n\nBarrière restante : %2$d.\nPV restants pouvant être soignés : %3$d.

actors.hero.spells.induceaggro.name=Induction d'Agression
actors.hero.spells.induceaggro.short_desc=Dirige toutes les attaques vers la cible pendant une courte période.
actors.hero.spells.induceaggro.desc=Le Paladin peut utiliser l'induction d'agression pour appliquer l'effet _Ciblé_ qui fait que les autres personnages attaquent la cible pendant _%d tours_.\n\nLa durée de l'effet sera augmentée de x3 pour les alliés. La durée de l'effet sera de 2 tours pour les boss ou mini-boss.

actors.hero.spells.spellburst.name=Explosion de Sort
actors.hero.spells.spellburst.short_desc=Retire l'affaiblissement de la cible et lui inflige des dégâts.
actors.hero.spells.spellburst.desc=L'Enchanteur peut utiliser l'Explosion de Sort pour retirer les affaiblissements de la cible et infliger _%1$d-%2$d_ dégâts magiques pour chaque affaiblissement retiré. L'Explosion de Sort inflige toujours les dégâts minimaux aux alliés.\n\nL'Explosion de Sort devient plus puissante à mesure que le héros monte de niveau.
actors.hero.spells.spellburst.no_debuffs=Il n'y a aucun affaiblissement sur la cible !
actors.hero.spells.spellburst.rankings_desc=Mort en faisant exploser ses affaiblissements
actors.hero.spells.spellburst.ondeath=Tu es mort de ton explosion de sort...

actors.hero.spells.timeamp.name=Amplification Temporelle
actors.hero.spells.timeamp.short_desc=Ralentit l'ennemi ou fait agir les alliés immédiatement.
actors.hero.spells.timeamp.desc=L'Enchanteur peut utiliser l'Amplification Temporelle pour appliquer _%1$d tours_ de ralentissement à un ennemi, ou accorder _%2$d tours_ de bulle temporelle à un allié.\n\nTu ne peux pas l'utiliser sur des ennemis déjà ralentis ou des alliés ayant déjà une bulle temporelle.
actors.hero.spells.timeamp.already_have=Cette cible est déjà affectée par le ralentissement ou la bulle temporelle.

actors.hero.spells.weakeninghex.name=Malédiction Affaiblissante
actors.hero.spells.weakeninghex.short_desc=Applique divers affaiblissements à la cible.
actors.hero.spells.weakeninghex.desc=L'Enchanteur peut utiliser la Malédiction Affaiblissante pour appliquer un effet _%s_ à la cible spécifiée pendant 5 tours.

actors.hero.spells.stun.name=Étourdissement
actors.hero.spells.stun.short_desc=Étourdit une cible.
actors.hero.spells.stun.desc=L'Enchanteur peut utiliser l'Étourdissement pour paralyser la cible spécifiée pendant _%d tours_.
actors.hero.spells.stun.immune=Il semble que cette cible ne peut pas être étourdie.

actors.hero.spells.thunderimbue.name=Imprégnation de Foudre
actors.hero.spells.thunderimbue.short_desc=Applique l'effet d'imprégnation de foudre à la cible.
actors.hero.spells.thunderimbue.desc=L'Enchanteur utilise l'imprégnation de foudre pour appliquer à la cible spécifiée l'effet d'imprégnation de foudre pendant _%d tours_, accordant à la cible des dégâts supplémentaires lors de son attaque physique.

actors.hero.spells.arcanearmorspell.name=Armure Arcanique
actors.hero.spells.arcanearmorspell.short_desc=Augmente temporairement la défense magique.
actors.hero.spells.arcanearmorspell.desc=L'Enchanteur utilise l'Armure Arcanique pour augmenter sa défense magique de 0-1 et gagne un effet d'Armure Arcanique qui réduit la défense magique maximale de 1 toutes les _%d tours_. L'utiliser plusieurs fois augmente la défense magique maximale.\n\nLa défense magique maximale ne peut pas dépasser le niveau actuel du héros.

actors.hero.spells.enchant.name=Enchanter
actors.hero.spells.enchant.short_desc=Enchante l'arme ou l'armure spécifiée.
actors.hero.spells.enchant.desc=L'Enchanteur peut utiliser Enchanter pour appliquer un enchantement ou glyphe aléatoire à l'équipement spécifié.\n\nEnchanter ne peut être utilisé que sur des armes et armures identifiées et non maudites.

###v3.29.0
actors.hero.talent$protectiveslashcooldown.name=récupération de taillade protectrice
actors.hero.talent$protectiveslashcooldown.desc=Tu as récemment utilisé ce talent, et dois attendre avant de le réutiliser.\n\nTours restants : %s.
actors.hero.talent$kineticattacktracker.name=attaque cinétique
actors.hero.talent$kineticattacktracker.desc=L'Aventurier a récemment utilisé des cordes, sa prochaine attaque de mêlée sera renforcée.\n\nTours restants : %s.
actors.hero.talent$wardinglightcooldown.name=récupération de lumière protectrice
actors.hero.talent$wardinglightcooldown.desc=Tu as récemment utilisé ce talent, et dois attendre avant de le réutiliser.\n\nTours restants : %s.

###v3.34.0
actors.hero.heroclass.archer=archer
actors.hero.heroclass.archer_desc_short=Le maître des attaques à distance, qui peut démonter des armes de mêlée en armes de jet aléatoires.
actors.hero.heroclass.archer_desc=L'Archer peut démonter des armes de mêlée pour fabriquer des armes de jet.\n\nL'Archer gagne une chance de coup critique bonus avec les armes de jet/flèches, augmentant avec le niveau.\n\nL'Archer commence avec un carquois d'archer qui améliore les flèches.\n\nL'Archer commence aussi
actors.hero.heroclass.archer_unlock=Pour débloquer l'Archer, _obtiens un arc équipable_.

actors.hero.herosubclass.bowmaster=maître arc
actors.hero.herosubclass.bowmaster_short_desc=Le _Maître Arc_ a des capacités d'arc améliorées.
actors.hero.herosubclass.bowmaster_desc=Le Maître Arc est immunisé à l'épuisement de l'arc et peut imprégner son carquois d'élixirs et de brasseries en plus des potions.\n\nIl gagne aussi des charges de combo de flèche par tir, ce qui augmente les dégâts des flèches.\n\nÀ 4 charges ou plus, le Maître Arc peut déclencher un tir puissant à coup garanti (+100% de dégâts, consomme le combo de flèche).
actors.hero.herosubclass.juggler=jongleur
actors.hero.herosubclass.juggler_short_desc=Le _Jongleur_ peut lancer plusieurs armes de jet en une fois.
actors.hero.herosubclass.juggler_desc=Le Jongleur rattrape les armes de jet à sa position pour les jongler dans les airs au lieu de les laisser tomber.\n\nIl peut jongler jusqu'à 3 armes en même temps et les lancer toutes en un seul tour.
actors.hero.herosubclass.sharpshooter=tireuse d'élite
actors.hero.herosubclass.sharpshooter_short_desc=La _Tireuse d'Élite_ peut tirer 3 rafales de munitions avec ses armes à feu ou arcs.
actors.hero.herosubclass.sharpshooter_desc=La Tireuse d'Élite peut dépenser 1 tour pour tirer une rafale de 3 flèches ou balles. Cette capacité peut être réutilisée après avoir tué un ennemi.\n\nIl y a deux modes de rafale : en ciblant une direction, la Tireuse d'Élite tirera tous les coups dans la même direction, tandis que se cibler elle-même fera voler les projectiles dans une direction aléatoire.

actors.hero.abilities.archer.dashability.name=Ruée
actors.hero.abilities.archer.dashability.short_desc=L'Archer peut se _Ruer_ sur de courtes distances sans dépenser de tour.
actors.hero.abilities.archer.dashability.desc=L'Archer se ruera vers l'avant jusqu'à 4 cases à travers n'importe quel ennemi ou danger.
actors.hero.abilities.archer.dashability.self_target=Impossible de se ruer vers la position actuelle.
actors.hero.abilities.archer.dashability.there_is_something=La cible est bloquée.
actors.hero.abilities.archer.dashability.rooted=Tu ne peux pas bouger !
actors.hero.abilities.archer.dashability.bad_position=Cette cible est invalide.
actors.hero.abilities.archer.hunt.name=Terrifier
actors.hero.abilities.archer.hunt.short_desc=L'Archer peut _Terrifier_ un ennemi pour lui infliger de lourds affaiblissements.
actors.hero.abilities.archer.hunt.desc=L'Archer inflige _10 tours de terreur et de vulnérabilité_ avec cette capacité.
actors.hero.abilities.archer.snipe.name=Super-Tir
actors.hero.abilities.archer.snipe.short_desc=L'Archer peut tirer des _Super-Tirs_, un type spécial de flèche, qui s'échelonne selon la distance.
actors.hero.abilities.archer.snipe.desc=L'Archer tire une flèche spéciale, qui inflige _10-40 dégâts de base_, avec jusqu'à x2,5 de bonus de dégâts selon la distance, et estropie les ennemis pendant 10 tours.
actors.hero.abilities.archer.snipe.self_target=Tu ne peux pas te cibler toi-même.
actors.hero.abilities.archer.snipe.bad_position=Cette cible est invalide.

actors.hero.talent.force_saving.title=sauvegarde de force
actors.hero.talent.force_saving.desc=_+1 :_ Manger de la nourriture fera que la prochaine attaque de l'Archer repousse l'ennemi de _2 cases_.\n\n_+2 :_ Manger de la nourriture fera que la prochaine attaque de l'Archer repousse l'ennemi de _3 cases_.
actors.hero.talent.archers_intuition.title=intuition de l'archer
actors.hero.talent.archers_intuition.desc=_+1 :_ L'Archer identifie les arcs, quand _il les équipe_.\n\n_+2 :_ L'Archer identifie les arcs, quand _il les équipe_, et apprend, s'ils sont maudits, en les ramassant.
actors.hero.talent.surprise_panic.title=panique surprise
actors.hero.talent.surprise_panic.desc=_+1 :_ Quand l'Archer surprend un ennemi, celui-ci reçoit _3 tours de terreur_.\n\n_+2 :_ Quand l'Archer surprend un ennemi, celui-ci reçoit _5 tours de terreur_.\n\nCela ne s'applique qu'à la première attaque surprise.
actors.hero.talent.survival_technique.title=technique de survie
actors.hero.talent.survival_technique.desc=_+1 :_ Ramasser des gouttes de rosée donnera à l'Archer _5 boucliers_.\n\n_+2 :_ Ramasser des gouttes de rosée donnera à l'Archer _8 boucliers_.
actors.hero.talent.dexterity.title=dextérité
actors.hero.talent.dexterity.desc=_+1 :_ L'Archer a _33,5% de chance_ de récupérer une flèche, contre 25%.\n\n_+2 :_ L'Archer a _50% de chance_ de récupérer une flèche, contre 25%.

actors.hero.talent.fighting_meal.title=repas combatif
actors.hero.talent.fighting_meal.desc=_+1 :_ Manger de la nourriture prend à l'Archer 1 tour et lui accorde _2 tours d'adrénaline_.\n\n_+2 :_ Manger de la nourriture prend à l'Archer 1 tour et lui accorde _4 tours d'adrénaline_.
actors.hero.talent.fully_potion.title=potion satisfaisante
actors.hero.talent.fully_potion.desc=_+1 :_ Quand l'Archer boit une potion, il restaure _30 tours_ de satiété.\n\n_+2 :_ Quand l'Archer boit une potion, il restaure _50 tours_ de satiété.\n\nCela ne s'applique pas aux potions lancées.
actors.hero.talent.nature_friendly.title=ami de la nature
actors.hero.talent.nature_friendly.desc=_+1 :_ Marcher sur de l'herbe haute accorde à l'Archer _0-3 armure de peau d'écorce_, qui s'estompe chaque tour.\n\n_+2 :_ Marcher sur de l'herbe haute accorde à l'Archer _0-5 armure de peau d'écorce_, qui s'estompe chaque tour.
actors.hero.talent.pushback.title=repoussement
actors.hero.talent.pushback.desc=_+1 :_ L'Archer a 40% de chance de repousser un ennemi d'_1 case_ lors de coups de mêlée.\n\n_+2 :_ L'Archer a 40% de chance de repousser un ennemi de _2 cases_ lors de coups de mêlée.\n\nCe talent se déclenche toujours lors d'attaques surprises.\nSi l'Archer utilise des armes de type arc, il a ce talent comme capacité innée et améliorer le talent augmentera simplement la distance de repoussement.
actors.hero.talent.archers_foresight.title=précognition
actors.hero.talent.archers_foresight.desc=_+1 :_ Quand l'Archer arrive à un nouvel étage, il y a _75% de chance_ que tous les pièges soient révélés et découverts.\n\n_+2 :_ Quand l'Archer arrive à un nouvel étage, il y a _100% de chance_ que tous les pièges soient révélés et découverts.
actors.hero.talent.roots_entwine.title=racines enlaçantes
actors.hero.talent.roots_entwine.desc=_+1 :_ Quand un ennemi marche sur une plante, il est _enraciné pendant 2 tours_.\n\n_+2 :_ Quand un ennemi marche sur une plante, il est _enraciné pendant 3 tours_.

actors.hero.talent.makeshift_bow.title=arc de fortune
actors.hero.talent.makeshift_bow.desc=_+1 :_ Obtient instantanément un _arc_.\n\n_+2 :_ Obtient instantanément un _arc long_.\n\n_+3 :_ Obtient instantanément un _arc géant_.
actors.hero.talent.makeshift_bow.meta_desc=_Si ce talent est obtenu par un héros différent_, ses armes à distance auront _+20%/+40%/+60%_ de précision.
actors.hero.talent.followup_shoot.title=tirs enchaînés
actors.hero.talent.followup_shoot.desc=_+1 :_ Quand l'Archer touche un ennemi avec une arme de mêlée, il inflige _10% de plus_ de dégâts physiques à distance pendant 5 tours.\n\n_+2 :_ Quand l'Archer touche un ennemi avec une arme de mêlée, il inflige _20% de plus_ de dégâts physiques à distance pendant 5 tours.\n\n_+3 :_ Quand l'Archer touche un ennemi avec une arme de mêlée, il inflige _30% de plus_ de dégâts physiques à distance pendant 5 tours.

actors.hero.talent.fastshot.title=tir rapide
actors.hero.talent.fastshot.desc=_+1 :_ Quand le combo de flèche est inactif, la prochaine flèche du Maître Arc sera instantanée, mais infligera _20% de dégâts_.\n\n_+2 :_ Quand le combo de flèche est inactif, la prochaine flèche du Maître Arc sera instantanée, mais infligera _40% de dégâts_.\n\n_+3 :_ Quand le combo de flèche est inactif, la prochaine flèche du Maître Arc sera instantanée, mais infligera _60% de dégâts_.
actors.hero.talent.expanded_power.title=accumulation de puissance
actors.hero.talent.expanded_power.desc=_+1 :_ Le combo de flèche maximal augmente de _1_.\n\n_+2 :_ Le combo de flèche maximal augmente de _2_.\n\n_+3 :_ Le combo de flèche maximal augmente de _3_.
actors.hero.talent.moving_focus.title=concentration en mouvement
actors.hero.talent.moving_focus.desc=_+1 :_ Il y a _80% de chance_ que le Maître Arc conserve le combo de flèche à chaque déplacement.\n\n_+2 :_ Le Maître Arc conservera le combo de flèche à chaque déplacement.\n\n_+3 :_ Le Maître Arc augmentera son combo de flèche de 1 à chaque déplacement.\n\nSe déplacer à nouveau sans tirer réinitialise toujours le combo.
actors.hero.talent.bottle_expansion.title=extension de carquois
actors.hero.talent.bottle_expansion.desc=_+1 :_ Le carquois du Maître Arc peut contenir _6 flèches améliorées de plus_ par potion.\n\n_+2 :_ Le carquois du Maître Arc peut contenir _12 flèches améliorées de plus_ par potion.\n\n_+3 :_ Le carquois du Maître Arc peut contenir _18 flèches améliorées de plus_ par potion.
actors.hero.talent.spectre_arrow.title=flèche spectrale
actors.hero.talent.spectre_arrow.desc=_+1 :_ Les flèches du Maître Arc ont _17% de chance_ de ne pas consommer de munition.\n\n_+2 :_ Les flèches du Maître Arc ont _33% de chance_ de ne pas consommer de munition.\n\n_+3 :_ Les flèches du Maître Arc ont _50% de chance_ de ne pas consommer de munition.\n\nCe talent requiert au moins 1 munition disponible.
actors.hero.talent.unencumbered_step.title=foulée dégagée
actors.hero.talent.unencumbered_step.desc=_+1 :_ Le Maître Arc se déplace _10% plus vite_ quand aucun ennemi n'est dans un rayon de 2 cases.\n\n_+2 :_ Le Maître Arc se déplace _20% plus vite_ quand aucun ennemi n'est dans un rayon de 2 cases.\n\n_+3 :_ Le Maître Arc se déplace _30% plus vite_ quand aucun ennemi n'est dans un rayon de 2 cases.

actors.hero.talent.habitual_hand.title=main habituée
actors.hero.talent.habitual_hand.desc=_+1 :_ Quand le Jongleur tue un ennemi, _1 flèche_ est ajoutée à la pile de jonglage.\n\n_+2 :_ Quand le Jongleur tue un ennemi, _2 flèches_ sont ajoutées à la pile de jonglage.\n\n_+3 :_ Quand le Jongleur tue un ennemi, _3 flèches_ sont ajoutées à la pile de jonglage.\n\nLes flèches héritent des statistiques de l'arc actuellement équipé par le Jongleur. S'il ne manie pas d'arme de type arc, elles utilisent par défaut un arc +0 de la région de l'étage actuel.
actors.hero.talent.swift_juggling.title=jonglage rapide
actors.hero.talent.swift_juggling.desc=_+1 :_ Ajouter des armes de jet à la pile de jonglage prend _0,67 tour_.\n\n_+2 :_ Ajouter des armes de jet à la pile de jonglage prend _0,33 tour_.\n\n_+3 :_ Ajouter des armes de jet à la pile de jonglage prend _0 tour_.
actors.hero.talent.skillful_juggling.title=jonglage habile
actors.hero.talent.skillful_juggling.desc=_+1 :_ Le Jongleur peut tenir _1 arme de plus_ dans sa pile de jonglage.\n\n_+2 :_ Le Jongleur peut tenir _2 armes de plus_ dans sa pile de jonglage.\n\n_+3 :_ Le Jongleur peut tenir _3 armes de plus_ dans sa pile de jonglage.
actors.hero.talent.focus_maintain.title=maintien de concentration
actors.hero.talent.focus_maintain.desc=_+1 :_ Le Jongleur a _-30% de précision_ sur les attaques de jonglage.\n\n_+2 :_ Le Jongleur a _-10% de précision_ sur les attaques de jonglage.\n\n_+3 :_ Le Jongleur a _+10% de précision_ sur les attaques de jonglage.
actors.hero.talent.fancy_performance.title=performance fantaisiste
actors.hero.talent.fancy_performance.desc=_+1 :_ Quand le Jongleur touche un ennemi avec une attaque de jonglage, il laisse tomber _5 pièces d'or_.\n\n_+2 :_ Quand le Jongleur touche un ennemi avec une attaque de jonglage, il laisse tomber _10 pièces d'or_.\n\n_+3 :_ Quand le Jongleur touche un ennemi avec une attaque de jonglage, il laisse tomber _15 pièces d'or_.\n\nLes attaques manquées laissent quand même tomber de l'or, mais les coups fatals empêchent la chute d'or.
actors.hero.talent.tour_performance.title=performance de rue
actors.hero.talent.tour_performance.desc=_+1 :_ Quand le Jongleur se déplace, il y a _1% de chance_ qu'une flèche soit ajoutée à la pile de jonglage.\n\n_+2 :_ Quand le Jongleur se déplace, il y a _2% de chance_ qu'une flèche soit ajoutée à la pile de jonglage.\n\n_+3 :_ Quand le Jongleur se déplace, il y a _1% de chance_ qu'une flèche soit ajoutée à la pile de jonglage.\n\nLes flèches héritent des statistiques de l'arc actuellement équipé par le Jongleur. S'il ne manie pas d'arme de type arc, elles utilisent par défaut un arc +0 de la région de l'étage actuel.

actors.hero.talent.hurricane.title=ouragan
actors.hero.talent.hurricane.desc=_+1 :_ La Tireuse d'Élite obtient _1 tour de déplacement instantané_ en tuant des ennemis avec la capacité de rafale.\n\n_+2 :_ La Tireuse d'Élite obtient _2 tours de déplacement instantané_ en tuant des ennemis avec la capacité de rafale.\n\n_+3 :_ La Tireuse d'Élite obtient _3 tours de déplacement instantané_ en tuant des ennemis avec la capacité de rafale.
actors.hero.talent.perfect_shot.title=tir parfait
actors.hero.talent.perfect_shot.desc=_+1 :_ Exécuter une capacité de rafale a _33% de chance_ de recharger _1 balle_ dans l'arme équipée ou récupérer une flèche de l'ennemi ciblé.\n\n_+2 :_ Exécuter une capacité de rafale a _67% de chance_ de recharger 1 balle dans l'arme équipée ou récupérer une flèche de l'ennemi ciblé.\n\n_+3 :_ Exécuter une capacité de rafale a _100% de chance_ de recharger _1 balle_ dans l'arme équipée ou récupérer une flèche de l'ennemi ciblé.\n\nLe comportement de ce talent dépend de l'arme équipée.
actors.hero.talent.focus_shot.title=tirs concentrés
actors.hero.talent.focus_shot.desc=_+1 :_ La Tireuse d'Élite peut restaurer sa capacité de tir en rafale en touchant _7 tirs_ de flèches ou balles.\n\n_+2 :_ La Tireuse d'Élite peut restaurer sa capacité de tir en rafale en touchant _5 tirs_ de flèches ou balles.\n\n_+3 :_ La Tireuse d'Élite peut restaurer sa capacité de tir en rafale en touchant _3 tirs_ de flèches ou balles.
actors.hero.talent.bullseye.title=dans le mille
actors.hero.talent.bullseye.desc=_+1 :_ Les balles et flèches ont _2x de précision_ pendant les tirs en rafale.\n\n_+2 :_ Les balles et flèches ont _5x de précision_ pendant les tirs en rafale.\n\n_+3 :_ Les balles et flèches ont une _précision infinie_ pendant les tirs en rafale.
actors.hero.talent.ranged_lethality.title=létalité à distance
actors.hero.talent.ranged_lethality.desc=_+1 :_ La Tireuse d'Élite tue instantanément les ennemis _sous 10% de PV_ avec sa capacité de tir en rafale.\n\n_+2 :_ La Tireuse d'Élite tue instantanément les ennemis _sous 20% de PV_ avec sa capacité de tir en rafale.\n\n_+3 :_ La Tireuse d'Élite tue instantanément les ennemis _sous 30% de PV_ avec sa capacité de tir en rafale.
actors.hero.talent.channeling.title=canalisation
actors.hero.talent.channeling.desc=_+1 :_ Les armes à projectiles ont _10% de chance_ de frapper la foudre sur les ennemis, infligeant des dégâts électriques supplémentaires.\n\n_+2 :_ Les armes à projectiles ont _20% de chance_ de frapper la foudre sur les ennemis, infligeant des dégâts électriques supplémentaires.\n\n_+3 :_ Les armes à projectiles ont _30% de chance_ de frapper la foudre sur les ennemis, infligeant des dégâts électriques supplémentaires.

actors.hero.talent.longrange_dash.title=sprint longue portée
actors.hero.talent.longrange_dash.desc=_+1 :_ La ruée peut aller _2 cases plus loin_.\n\n_+2 :_ La ruée peut aller _4 cases plus loin_.\n\n_+3 :_ La ruée peut aller _6 cases plus loin_.\n\n_+4 :_ La ruée peut aller _8 cases plus loin_.
actors.hero.talent.dust_spread.title=dispersion de poussière
actors.hero.talent.dust_spread.desc=_+1 :_ La ruée infligera _2 tours d'aveuglement_ à chaque ennemi sur son chemin.\n\n_+2 :_ La ruée infligera _4 tours d'aveuglement_ à chaque ennemi sur son chemin.\n\n_+3 :_ La ruée infligera _6 tours d'aveuglement_ à chaque ennemi sur son chemin.\n\n_+4 :_ La ruée infligera _8 tours d'aveuglement_ à chaque ennemi sur son chemin.
actors.hero.talent.kinetic_dash.title=ruée cinétique
actors.hero.talent.kinetic_dash.desc=_+1 :_ Si l'Archer effectue une seconde ruée juste après la première, cette ruée a un coût de charge _réduit de 16%_.\n\n_+2 :_ Si l'Archer effectue une seconde ruée juste après la première, cette ruée a un coût de charge _réduit de 21%_.\n\n_+3 :_ Si l'Archer effectue une seconde ruée juste après la première, cette ruée a un coût de charge _réduit de 33%_.\n\n_+4 :_ Si l'Archer effectue une seconde ruée juste après la première, cette ruée a un coût de charge _réduit de 46%_.

actors.hero.talent.chase.title=poursuite
actors.hero.talent.chase.desc=_+1 :_ Les affaiblissements de l'acte de terrification durent _5 tours de plus_.\n\n_+2 :_ Les affaiblissements de l'acte de terrification durent _10 tours de plus_.\n\n_+3 :_ Les affaiblissements de l'acte de terrification durent _15 tours de plus_.\n\n_+4 :_ Les affaiblissements de l'acte de terrification durent _20 tours de plus_.
actors.hero.talent.chill_back.title=frissons dans le dos
actors.hero.talent.chill_back.desc=_+1 :_ La terrification inflige en plus _3 tours de frisson_.\n\n_+2 :_ La terrification inflige en plus _6 tours de frisson_.\n\n_+3 :_ La terrification inflige en plus _9 tours de frisson_.\n\n_+4 :_ La terrification inflige en plus _12 tours de frisson_.
actors.hero.talent.cannot_escape.title=menace inéluctable
actors.hero.talent.cannot_escape.desc=_+1 :_ L'Archer obtient _2 tours de célérité_ après avoir terrifié.\n\n_+2 :_ L'Archer obtient _4 tours de célérité_ après avoir terrifié.\n\n_+3 :_ L'Archer obtient _6 tours de célérité_ après avoir terrifié.\n\n_+4 :_ L'Archer obtient _8 tours de célérité_ après avoir terrifié.

actors.hero.talent.enhanced_arrow.title=flèche améliorée
actors.hero.talent.enhanced_arrow.desc=_+1 :_ La flèche de super-tir inflige _15-50_ dégâts de base.\n\n_+2 :_ La flèche de super-tir inflige _20-60_ dégâts de base.\n\n_+3 :_ La flèche de super-tir inflige _25-70_ dégâts de base.\n\n_+4 :_ La flèche de super-tir inflige _30-80_ dégâts de base.
actors.hero.talent.accurate_snipe.title=précision de tireur d'élite
actors.hero.talent.accurate_snipe.desc=_+1 :_ La flèche de super-tir a _50% de précision supplémentaire_ et peut pénétrer jusqu'à _1 case solide_.\n\n_+2 :_ La flèche de super-tir a _100% de précision supplémentaire_ et peut pénétrer jusqu'à _2 cases solides_.\n\n_+3 :_ La flèche de super-tir a _150% de précision supplémentaire_ et peut pénétrer jusqu'à _3 cases solides_.\n\n_+4 :_ La flèche de super-tir a _200% de précision supplémentaire_ et peut pénétrer jusqu'à _4 cases solides_.
actors.hero.talent.knocking_arrow.title=flèche d'assommement
actors.hero.talent.knocking_arrow.desc=_+1 :_ La flèche de super-tir a _25% de chance_ de paralyser au lieu d'estropier.\n\n_+2 :_ La flèche de super-tir a _50% de chance_ de paralyser au lieu d'estropier.\n\n_+3 :_ La flèche de super-tir a _75% de chance_ de paralyser au lieu d'estropier.\n\n_+4 :_ La flèche de super-tir a _100% de chance_ de paralyser au lieu d'estropier.

actors.hero.talent$followupshoottracker.name=Tir enchaîné
actors.hero.talent$followupshoottracker.desc=Tu as récemment effectué une attaque de mêlée. Les armes de jet infligent maintenant des dégâts bonus à cette cible.\n\nTours restants : %s
actors.hero.talent$forcesavingtracker.name=puissance emmagasinée
actors.hero.talent$forcesavingtracker.desc=Avec un peu de puissance stockée, ta prochaine attaque de mêlée déclenchera un puissant repoussement.
actors.buffs.bowmasterskill.name=combo de flèche
actors.buffs.bowmasterskill.desc=Tu tires rapidement des flèches, accumulant de la puissance à chaque tir. Le combo de flèche s'accumule à chaque tir, mais se réinitialise immédiatement si tu arrêtes de tirer.\n\nBonus de dégâts actuel : _%s_.
actors.buffs.bowmasterskill.action_name=tirer une flèche spéciale
actors.buffs.juggling.name=jonglage
actors.buffs.juggling.desc=Tu jongles des armes de jet d'une main ! Lance toutes les armes jonglées d'un coup une fois prêt !\n\nLes attaques de jonglage coûtent un tour peu importe le nombre d'armes dans la pile. Ajouter des armes au-delà de la capacité fera tomber la première arme de la pile de jonglage.\n\nActuellement en jonglage : _%s_.
actors.buffs.juggling.action_name=attaque de jonglage
actors.buffs.sharpshooterbuff.action_name=tir en rafale
actors.buffs.sharpshooterbuff.executed=exécuté
actors.buffs.sharpshooterbuff.no_weapon=Pour utiliser cette capacité, tu dois équiper un arc ou une arme à feu
actors.buffs.sharpshooterbuff.no_bullet=Tu n'as aucune balle.
actors.buffs.sharpshooterbuff.no_arrow=Tu n'as aucune flèche.
actors.buffs.sharpshooterbuff$sharpshootingcooldown.name=Récupération : Tir en Rafale
actors.buffs.sharpshooterbuff$sharpshootingcooldown.desc=Tu ne peux pas réutiliser la capacité de tir en rafale, jusqu'à ce que tu tues un ennemi.
actors.buffs.sharpshooterbuff$sharpshootingcooldown.alt_desc=Tu ne peux pas réutiliser la capacité de tir en rafale, jusqu'à ce que tu tues un ennemi ou touches une certaine quantité de projectiles.\n\nNombre de coups restants : _%s_.
