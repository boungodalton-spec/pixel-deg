challenges.superman=Superman
challenges.superman_desc=Un grand pouvoir implique de grandes responsabilités.\n\n- Tous les dégâts physiques infligés par le héros sont multipliés par _3_.\n- Le taux d'esquive est multiplié par _3_ et la précision par _2_.\n- Tu commences avec _10_ points de vie maximum, qui n'augmentent pas avec le niveau.
challenges.pyro=Pyromane
challenges.pyro_desc=Le feu est l'une des plus grandes bénédictions accordées aux humains... mais parfois, il peut aussi être un désastre.\n\n- Chaque attaque physique du héros enflamme toujours l'ennemi.\n- La durée des effets fournis par l'Imprégnation de Feu et les Flacons de Sang de Dragon est réduite de _-50%_.
challenges.cursed_dungeon=Donjon maudit
challenges.cursed_dungeon_desc=Les esprits des ennemis que tu vaincs t'attaquent...\n\n- Quand tu vaincs un ennemi, _un spectre apparaît parfois à sa place_.
challenges.fatigue=Fatigue
challenges.fatigue_desc=Continuer le combat fatigue le héros...\n\n- La fatigue s'accumule à chaque fois que le héros porte ou reçoit une attaque physique, et quand elle dépasse un certain niveau, il/elle subit brièvement un _effet négatif_ aléatoire, ce qui soulage légèrement la fatigue.\n- La fatigue disparaît progressivement avec le temps, et peut être éliminée immédiatement en mangeant ou en utilisant des effets qui suppriment les effets négatifs.\n\n- Les effets négatifs pouvant survenir lors de l'accumulation de fatigue sont les suivants :\n\n- Commun : _Aveuglement_ pendant 5 tours\n- Peu rare : _Affaibli_ pendant 5 tours ou _Étourdi_ pendant 5 tours\n- Rare : _Estropié_ pendant 5 tours ou _Vulnérable_ pendant 5 tours\n- Très rare : _Paralysé_ 2 tours ou _ralenti_ 5 tours
challenges.mutation=Mutation
challenges.mutation_desc=Les blessures que tu infliges aux ennemis les font muter !\n\n- Chaque fois que tu attaques physiquement un ennemi, tu le transformeras parfois en un ennemi différent.\n\n- Le type d'ennemi obtenu dépend de la région où tu te trouves.

