journal.document.adventurers_guide.gun.title=Armes à feu
journal.document.adventurers_guide.gun.body=Dans ce donjon, une arme à feu peut apparaître n'importe où sous l'influence d'un événement quelconque. L'arme peut être tirée une fois équipée, et quand le chargeur est vide, elle peut être rechargée (avec des munitions) et tirée à nouveau.\n\nL'emplacement rapide te permet de manier les armes à feu commodément et de recharger rapidement sans utiliser tous tes chargeurs. Essaie de tirer sur ta propre position.\n\nLes balles peuvent parfois être trouvées dans les donjons, mais tu peux aussi en fabriquer toi-même à partir de métal liquide obtenu au Chaudron d'Alchimie en fondant une arme de jet. Fabriquer un ceinturon de munitions te donnera plus de balles !\n\nAméliorer l'arme à feu augmente aussi les performances des balles, mais l'effet de l'Anneau de Tir d'Élite n'affecte pas significativement les balles.
journal.document.adventurers_guide.gunsmithing.title=Modification d'armes à feu
journal.document.adventurers_guide.gunsmithing.body=L'alchimie te permet de créer un outil d'armurier qui te permet de modifier tes armes à feu comme tu le souhaites !\n\nLes modifications d'armes à feu apportent divers changements aux armes, et elles peuvent être librement modifiées et utilisées selon ta situation actuelle.\n\nLes modifications d'armes à feu incluent les modifications de canon, de chargeur, de balles, de poids, d'accessoires, de magie, etc.
journal.document.adventurers_guide.bow.title=Arcs
journal.document.adventurers_guide.bow.body=L'arc est une arme à distance utilisable à la place d'une arme à feu. Si tu trouves un arc dans le donjon, tu peux l'équiper et l'utiliser.\n\nContrairement aux armes à feu, les arcs n'ont pas de chargeur, et chaque tir consomme les munitions que tu possèdes pour tirer des flèches. Les flèches restent parfois plantées dans les ennemis ou tombent au sol sous une forme réutilisable.\n\nLes flèches infligent moins de dégâts que les armes à feu, mais tu peux t'attendre à des dégâts plus élevés lors d'une attaque furtive contre l'ennemi.\n\nLa puissance de mêlée de l'arc lui-même est très faible, ce qui en fait une arme très désavantageuse au corps-à-corps. Une attaque de mêlée avec un arc repousse souvent l'ennemi, ce qui te permet de prendre de la distance pour tirer des flèches. Si tu as vraiment besoin de prendre de la distance, essaie une attaque furtive.\n\nAméliorer l'arc augmente aussi les performances des flèches, mais l'effet de l'Anneau de Tir d'Élite n'affecte pas significativement les flèches.
journal.document.adventurers_guide.blueprint.title=Plans
journal.document.adventurers_guide.blueprint.body=Les plans magiques sont un excellent choix pour l'amélioration d'armes. Tu peux fabriquer des plans contenant des informations sur des armes spécifiques via l'alchimie.\n\nLes plans ont une recette préétablie. Tu peux créer des plans avec deux armes correspondant à la recette et une évolution instable, ou une arme correspondant à la recette, de la poussière d'amélioration, et une évolution instable.\n\nIl y a un taux de réussite lors de l'utilisation d'un plan, et plus le niveau de l'arme que tu utilises est bas par rapport à l'arme contenue dans le plan, plus la probabilité est faible. Tu peux aussi améliorer le plan lui-même pour augmenter la probabilité !
