journal.document.labs_medic.title=Notes du laboratoire
journal.document.labs_medic.suspicious.title=Signes suspects
journal.document.labs_medic.suspicious.body=14 juillet 2274.\n\nJe suis Lieutenant Morale, officier de la flotte de mercenaires spatiaux.\n\nActuellement, nous nous préparons à effectuer un saut dimensionnel vers la planète Tyres pour notre prochaine mission. Les habitants de cette planète souffrent d'invasions continuelles venant d'autres planètes, et notre flotte approche avec des vivres, un soutien médical, et bien plus.\n\nLe capitaine de cette flotte, Jimmy Lane, a ordonné de charger le moteur FTL pour le saut dimensionnel tout en appelant les chercheurs, et il s'est mis à rire tout seul.\n\nQuelque chose cloche. Prépare-t-il autre chose durant ce saut dimensionnel ?\n\nJe sens qu'il est nécessaire de consigner cela. Le saut dimensionnel est prévu pour demain. D'ici là, je dois garder un œil sur ce que manigance le capitaine.
journal.document.labs_medic.evidence.title=Preuves
journal.document.labs_medic.evidence.body=15 juillet 2274.\n\nEn surveillant continuellement le capitaine, je l'ai vu tenir quelque chose ressemblant à une carte avec des coordonnées, tout en vérifiant sans cesse les directions autour du vaisseau.\n\nIl regardait dans une direction complètement différente de celle où se trouve la planète Tyres, et j'ai senti que quelque chose n'allait pas. Prévoit-il de sauter ailleurs ?\n\nMais je n'en suis pas encore certain. J'ai besoin d'une preuve un peu plus solide.\n\nMême si on est payés pour faire notre travail, j'ai le devoir d'alléger la souffrance des citoyens. Si nous sautons ailleurs qu'à Tyres, les gens là-bas continueront de souffrir. Je ne peux pas laisser cela arriver.\n\n...Mais le saut dimensionnel n'est plus qu'à quelques heures maintenant, et je dois intervenir avant qu'il ne soit trop tard !
journal.document.labs_medic.rebel.title=Rébellion
journal.document.labs_medic.rebel.body=J'ai demandé à plusieurs reprises au capitaine si nous allions dans la bonne direction, mais il n'a fait qu'insister que oui. Ce salaud, il cache quelque chose.\n\nJ'ai arraché la carte qu'il gardait dans la poche de son manteau et j'ai crié : « Est-ce que c'est toujours la bonne direction ?! »\n\nTout le monde sur le pont a sursauté en entendant ma voix, et le capitaine, pris au dépourvu, a rapidement pointé une arme sur moi. Ne pousse pas trop, je suis armée aussi.\n\nAyant anticipé cette situation, j'ai également sorti un émetteur médical à rayons gamma. Ça peut sembler faible en apparence, mais un mauvais tir pourrait provoquer une mutation cellulaire mortelle, tout aussi dangereuse qu'une arme à feu.\n\nLa carte est avec moi maintenant, et je suis à égalité avec le capitaine. Maintenant, crache le morceau, pacifiquement !
journal.document.labs_medic.truth.title=Vérité
journal.document.labs_medic.truth.body=Il a semblé réaliser son désavantage et a commencé à parler. Nous ne préparions pas un saut spatial mais un saut temporel, et durant ce saut, nous devions récupérer le dernier fragment d'une certaine amulette depuis un point précis.\n\nQu'est-ce qu'une stupide amulette comparée à l'abandon de citoyens mourants ? Que nous retournions dans le passé ou dans le futur, ces gens sont voués à souffrir !\n\nIl a haussé les épaules puis m'a dit de me calmer, en baissant son arme. Selon lui, l'amulette détient un pouvoir presque omnipotent. Avec elle, on peut guérir les mourants et créer n'importe quel matériau désiré.\n\nCrois-tu vraiment à de telles absurdités ? ai-je crié. Mais dans mon excitation, je n'ai pas remarqué les gardes qui approchaient par-derrière, et j'ai vite été appréhendée sans résistance.\n\nAh, vont-ils perdre espoir comme ça...?
journal.document.labs_medic.almighty_power.title=Pouvoir tout-puissant
journal.document.labs_medic.almighty_power.body=Il m'a ordonné d'observer attentivement ce qu'il faisait, puis m'a enfermée dans une cellule visible depuis le pont.\n\nLe saut dimensionnel erroné... non, le saut temporel a été exécuté, et à sa fin, il tenait dans sa main une gemme émettant de la lumière.\n\nNous avons vite atterri sur une planète, et alors qu'il insérait la dernière gemme dans l'amulette, un pouvoir surréaliste l'a visiblement enveloppé.\n\nAvec un large sourire, il a marché lentement vers ma cellule et m'a dit de regarder par la fenêtre.\n\nAlors, le vaisseau qui était dans le ciel s'est téléporté dans l'espace, puis téléporté là où la planète Tyres était visible. Puis il est revenu à sa position d'origine. Il a même déversé une multitude de fournitures médicales dans le vide.\n\nC'était comme assister à de la magie. Avec un tel pouvoir, ne pourrait-on pas sauver le monde... ?
journal.document.labs_medic.salvation.title=Salut
journal.document.labs_medic.salvation.body=2278... En fait, je ne sais même plus quelle date on est.\n\nIl m'a promis qu'une fois qu'il aurait étudié à fond le pouvoir de l'amulette et atteint sa pleine puissance, il sauverait le monde. Et n'ayant pas d'autre choix, je n'ai eu d'autre option que de me plier à ses paroles.\n\nBien qu'il semble mentir, le pouvoir de l'amulette était bien réel, et un jour, j'intercepterai cette relique et je sauverai vraiment le monde.\n\nSi seulement je pouvais gérer les forces de ce laboratoire, je pourrais peut-être m'échapper, mais c'est trop pour que je m'en occupe seule.\n\nAvec pour seul espoir, j'ai vécu sous ses ordres pendant des années, et aujourd'hui, soudainement, le chaos a éclaté.\n\nLes lumières d'urgence étaient allumées dans tout le laboratoire, et des troupes anti-émeute et des chars se déplaçaient sans relâche.\n\nJ'ai entendu dire qu'un type lourdement armé était en train de démolir toute l'armée à lui seul, et c'est maintenant l'occasion. Je dois sortir d'ici !

