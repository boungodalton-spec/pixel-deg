items.sheath$sheathing.name=Rengainement
items.sheath$sheathing.desc=Le samouraï ferme actuellement les yeux et rengaine son arme silencieusement dans le fourreau, lisant silencieusement l'air ambiant. La prochaine attaque physique utilisera une coupe éclair, augmentant les chances de coup critique et la précision.
