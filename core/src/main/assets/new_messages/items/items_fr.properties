items.liquidmetal.make_info_desc_1=La fabrication normale consomme du métal liquide pour fabriquer des armes à feu via un processus standard.\n\nUne arme à feu aléatoire sera produite.
items.liquidmetal.make_info_desc_2=La fabrication spéciale consomme _deux fois_ la quantité de métal liquide pour fabriquer des armes à feu puissantes via un processus spécial.\n\nIl y a une chance plus élevée d'obtenir une arme à feu plus puissante, et elle peut arriver sans malédiction, avec des valeurs d'amélioration supplémentaires, et avec des enchantements aléatoires.

