items.weapon.melee.minerstool.stats_desc=Ceci est une arme plutôt rapide.\nCette arme inflige plus de dégâts aux ennemis inorganiques.
items.weapon.melee.minerstool.desc=Une combinaison d'une bêche de campagne et d'une pioche, conçue pour être facilement transportée.
