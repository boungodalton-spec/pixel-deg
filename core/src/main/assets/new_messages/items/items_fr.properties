items.weapon.melee.shovel.desc=Une pelle couramment portée par les explorateurs. Elle est principalement utilisée pour creuser dans l'herbe environnante afin de découvrir des graines supplémentaires, mais elle semble aussi correcte pour être maniée comme arme.
