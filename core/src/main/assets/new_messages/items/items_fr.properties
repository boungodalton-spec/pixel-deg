items.weapon.missiles.alchemy.potothunder.name=pot de foudre
items.weapon.missiles.alchemy.potothunder.desc=Un éclair dans un petit pot. De petits éclairs continuent de s'échapper du pot pointu, et en cas d'impact, cela produira un énorme éclair et causera des dégâts.
items.weapon.missiles.alchemy.potothunder.magic_damage=la foudre infligera _%1$d-%2$d_ et paralysera la cible.

