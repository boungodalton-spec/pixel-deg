items.scrolls.scrollofretribution.no_in_temple=Rien ne s'est passé. Il semble que le pouvoir magique de cet endroit annule l'effet.

###v3.24.0
items.remains.sparemagazine.name=chargeur de rechange
items.remains.sparemagazine.desc=Ce chargeur de rechange semble être quelque chose que son ancien propriétaire a perdu. Il contient encore quelques balles, et l'utiliser devrait en produire quelques-unes. Cela détruira cependant le chargeur.
items.remains.sheathfragment.name=fragment de fourreau
items.remains.sheathfragment.desc=Ce fragment de fourreau semble être une relique d'un samouraï déchu. Tu peux faiblement sentir l'esprit du samouraï persister en lui, et l'utiliser semble susceptible de renforcer ta prochaine attaque. Cela détruira cependant le fragment.
items.remains.holedpouch.name=bourse trouée
items.remains.holedpouch.desc=Cette bourse en velours semble avoir appartenu à un aventurier disparu depuis longtemps. Il semble rester quelques graines à l'intérieur, et l'utiliser devrait en produire quelques-unes. Cela détruira cependant la bourse.
items.remains.brokenshield.name=bouclier brisé
items.remains.brokenshield.desc=Ce bouclier brisé semble avoir appartenu à un chevalier dont la volonté a été brisée. Tu peux encore sentir un pouvoir protecteur persistant en lui, et l'utiliser devrait bloquer de façon fiable la prochaine attaque entrante. Cela détruira cependant le bouclier.
items.remains.shatteredpillbox.name=boîte à pilules brisée
items.remains.shatteredpillbox.desc=Cette boîte à pilules brisée appartenait à une femme qui a échoué dans sa quête de vengeance. Il reste encore quelques pilules à l'intérieur, et l'utiliser devrait te fournir plusieurs pilules aux effets bénéfiques. Cela détruira cependant la boîte.

