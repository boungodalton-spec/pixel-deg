items.weapon.melee.bible.stats_desc=Cette arme procure des effets bénéfiques à celui qui la manie.
items.weapon.melee.bible.ability_name=Bénédiction Angélique
items.weapon.melee.bible.ability_desc=Le Duelliste maniant la Bible peut utiliser la _Bénédiction Angélique_. Cette capacité s'active immédiatement, permettant à celui qui la manie de récupérer de la vie proportionnellement aux dégâts infligés aux ennemis pendant les _%d_ tours suivants lors d'attaques de mêlée.
items.weapon.melee.bible.typical_ability_desc=Le Duelliste maniant la Bible peut utiliser la _Bénédiction Angélique_. Cette capacité s'active immédiatement, permettant à celui qui la manie de récupérer de la vie proportionnellement aux dégâts infligés aux ennemis typiquement pendant les _%d_ tours suivants lors d'attaques de mêlée.
items.weapon.melee.bible.desc=Un livre sacré contenant la parole de Dieu. Maniée par un héros et utilisée pour attaquer les ennemis, la puissance sainte du livre te renforce et, si tu es suffisamment renforcé, peut même restaurer ta vie.

items.weapon.melee.dualdagger.name=Dagues Jumelles
items.weapon.melee.dualdagger.stats_desc=Cette arme est plus efficace contre les ennemis sans armure.\nCette arme permet des attaques rapides.
items.weapon.melee.dualdagger.ability_name=Prise Inversée
items.weapon.melee.dualdagger.ability_desc=Le Duelliste maniant les Dagues Jumelles peut utiliser la _Prise Inversée_. Cette capacité s'active immédiatement, augmentant la vitesse d'attaque de +100%% et réduisant la puissance d'attaque de 50%% pendant les _%d_ tours suivants. Les attaques pendant la Prise Inversée infligent un saignement cumulable aux ennemis. La Prise Inversée consomme 2 charges.
items.weapon.melee.dualdagger.typical_ability_desc=Le Duelliste maniant les Dagues Jumelles peut utiliser la _Prise Inversée_. Cette capacité s'active immédiatement, augmentant la vitesse d'attaque de +100%% et réduisant la puissance d'attaque de 50%% typiquement pendant les _%d_ tours suivants. Les attaques pendant la Prise Inversée infligent un saignement cumulable aux ennemis. La Prise Inversée consomme 2 charges.
items.weapon.melee.dualdagger.desc=Une arme composée de deux dagues maniées dans chaque main. Il est difficile de porter un coup puissant à chaque attaque, mais elle permet des frappes bien plus rapides.
items.weapon.melee.dualdagger$reverseblade.name=Prise Inversée
items.weapon.melee.dualdagger$reverseblade.desc=Tu tiens l'arme en prise inversée, ce qui permet des tailladages rapides contre les ennemis. En Prise Inversée, ta vitesse d'attaque est grandement augmentée, mais tes attaques sont moins puissantes. Les tailladages rapides provoquent facilement un saignement chez les ennemis, et plus tu attaques, plus l'ennemi saigne.

items.weapon.melee.knife.name=Couteau de Cuisine
items.weapon.melee.knife.stats_desc=Cette arme fait saigner les ennemis.
items.weapon.melee.knife.ability_name=Entaille Profonde
items.weapon.melee.knife.ability_desc=Le Duelliste maniant un Couteau de Cuisine peut utiliser l'_Entaille Profonde_. Cette attaque touche toujours et inflige _%1$d-%2$d_ tours de saignement. Cette capacité consomme 3 charges. Les ennemis puissants peuvent résister à cet effet.
items.weapon.melee.knife.typical_ability_desc=Le Duelliste maniant un Couteau de Cuisine peut utiliser l'_Entaille Profonde_. Cette attaque touche toujours et inflige typiquement _%1$d-%2$d_ tours de saignement. Cette capacité consomme 3 charges. Les ennemis puissants peuvent résister à cet effet.
items.weapon.melee.knife.desc=Un couteau de cuisine. Il semble facile de faire saigner une cible poignardée, bien qu'il soit difficile d'infliger des dégâts directs aux ennemis. Pourquoi est-il ici ?

items.weapon.melee.nunchaku.name=Nunchaku
items.weapon.melee.nunchaku.stats_desc=Cette arme permet des attaques très rapides.\nCette arme inflige occasionnellement des étourdissements mentaux aux ennemis.
items.weapon.melee.nunchaku.ability_name=Moulinet
items.weapon.melee.nunchaku.ability_desc=Le Duelliste maniant un Nunchaku peut utiliser le _Moulinet_. Une fois utilisé, pendant le tour suivant, toutes les attaques entrantes sont contrées avec 50% de puissance d'attaque et les ennemis sont occasionnellement étourdis mentalement.
items.weapon.melee.nunchaku.typical_ability_desc=Le Duelliste maniant un Nunchaku peut utiliser le _Moulinet_. Une fois utilisé, pendant le tour suivant, toutes les attaques entrantes sont contrées avec 50% de puissance d'attaque et les ennemis sont occasionnellement étourdis mentalement.
items.weapon.melee.nunchaku.desc=Une arme composée de deux tiges métalliques reliées par une chaîne, permettant des frappes continues quand elle est maniée. Les tiges solides peuvent occasionnellement étourdir les ennemis, ralentissant leurs mouvements.

items.weapon.melee.largesword.name=Épée Large
items.weapon.melee.largesword.stats_desc=Cette arme est très lente.
items.weapon.melee.largesword.ability_name=Charge
items.weapon.melee.largesword.ability_desc=Le Duelliste maniant une Épée Large peut utiliser la _Charge_. Elle consomme 1 tour pour se charger, augmentant le niveau de charge de l'Épée Large de _%d_ tours.
items.weapon.melee.largesword.typical_ability_desc=Le Duelliste maniant une Épée Large peut utiliser la _Charge_. Elle consomme 1 tour pour se charger, augmentant le niveau de charge de l'Épée Large typiquement de _%d_ tours.
items.weapon.melee.largesword.desc=Une épée massive et lourde à large lame, elle demande beaucoup de temps à balancer, mais en la levant avant d'attaquer, tu peux bloquer les attaques ennemies et, une fois suffisamment chargée, infliger des dégâts dévastateurs.
items.weapon.melee.largesword$largeswordbuff.name=Charge
items.weapon.melee.largesword$largeswordbuff.desc=Tu lèves l'Épée Large, rassemblant tes forces. Grâce à la large lame de l'Épée Large, les dégâts que tu reçois sont grandement réduits, et plus tu te charges, plus les dégâts que tu infligeras la prochaine fois seront grands. De plus, grâce à la longue concentration, il devient plus facile de toucher les ennemis avec tes attaques.\n\nUne fois assez de puissance rassemblée, tu peux aussi infliger des dégâts aux ennemis proches de la cible attaquée.\n\nTours chargés : _%1$s_.\nMultiplicateur de dégâts actuel : _+%2$s%%_/_+%3$s%%_.\nMultiplicateur de taux de touche actuel : _+%4$s%%_/_+%5$s%%_.\nDégâts reçus : _-%6$s%%_.

items.weapon.melee.wornkatana.name=Katana Usé
items.weapon.melee.wornkatana.stats_desc=Cette arme a une puissance d'attaque minimale très faible mais une puissance d'attaque maximale légèrement plus élevée.
items.weapon.melee.wornkatana.ability_name=Coupe Éclair
items.weapon.melee.wornkatana.ability_desc=Le Duelliste maniant un Katana Usé peut utiliser la _Coupe Éclair_. Cette capacité s'active immédiatement et ne consomme aucun tour, attaquant un seul ennemi. Si cette capacité vainc l'ennemi, tu gagnes _%s_ charges d'arme.
items.weapon.melee.wornkatana.typical_ability_desc=Le Duelliste maniant un Katana Usé peut utiliser la _Coupe Éclair_. Cette capacité s'active immédiatement et ne consomme aucun tour, attaquant un seul ennemi. Si cette capacité vainc l'ennemi, tu gagnes _%s_ charges d'arme.
items.weapon.melee.wornkatana.desc=Une épée rouillée et usée, conservant à peine sa forme d'antan.

items.weapon.melee.shortkatana.name=Katana Court
items.weapon.melee.shortkatana.stats_desc=Cette arme a une puissance d'attaque minimale très faible mais une puissance d'attaque maximale légèrement plus élevée.
items.weapon.melee.shortkatana.ability_name=Coupe Éclair
items.weapon.melee.shortkatana.ability_desc=Le Duelliste maniant un Katana Court peut utiliser la _Coupe Éclair_. Cette capacité s'active immédiatement et ne consomme aucun tour, attaquant un seul ennemi. Si cette capacité vainc l'ennemi, tu gagnes _%s_ charges d'arme.
items.weapon.melee.shortkatana.typical_ability_desc=Le Duelliste maniant un Katana Court peut utiliser la _Coupe Éclair_. Cette capacité s'active immédiatement et ne consomme aucun tour, attaquant un seul ennemi. Si cette capacité vainc l'ennemi, tu gagnes _%s_ charges d'arme.
items.weapon.melee.shortkatana.desc=Une version plus courte et plus légère d'un katana. Il ne portera peut-être pas de coups fatals, mais il reste suffisamment menaçant.

items.weapon.melee.normalkatana.name=Katana Normal
items.weapon.melee.normalkatana.stats_desc=Cette arme a une puissance d'attaque minimale très faible mais une puissance d'attaque maximale légèrement plus élevée.
items.weapon.melee.normalkatana.ability_name=Coupe Éclair
items.weapon.melee.normalkatana.ability_desc=Le Duelliste maniant un Katana peut utiliser la _Coupe Éclair_. Cette capacité s'active immédiatement et ne consomme aucun tour, attaquant un seul ennemi. Si cette capacité vainc l'ennemi, tu gagnes _%s_ charges d'arme.
items.weapon.melee.normalkatana.typical_ability_desc=Le Duelliste maniant un Katana peut utiliser la _Coupe Éclair_. Cette capacité s'active immédiatement et ne consomme aucun tour, attaquant un seul ennemi. Si cette capacité vainc l'ennemi, tu gagnes _%s_ charges d'arme.
items.weapon.melee.normalkatana.desc=Un katana standard à lame à un seul tranchant, assez tranchant pour trancher les ennemis à l'approche.

items.weapon.melee.longkatana.name=Katana Long
items.weapon.melee.longkatana.stats_desc=Cette arme a une puissance d'attaque minimale très faible mais une puissance d'attaque maximale légèrement plus élevée.
items.weapon.melee.longkatana.ability_name=Coupe Éclair
items.weapon.melee.longkatana.ability_desc=Le Duelliste maniant un Katana Long peut utiliser la _Coupe Éclair_. Cette capacité s'active immédiatement et ne consomme aucun tour, attaquant un seul ennemi. Si cette capacité vainc l'ennemi, tu gagnes _%s_ charges d'arme.
items.weapon.melee.longkatana.typical_ability_desc=Le Duelliste maniant un Katana Long peut utiliser la _Coupe Éclair_. Cette capacité s'active immédiatement et ne consomme aucun tour, attaquant un seul ennemi. Si cette capacité vainc l'ennemi, tu gagnes _%s_ charges d'arme.
items.weapon.melee.longkatana.desc=Une lame longue et tranchante, légèrement lourde mais capable d'infliger des blessures importantes à chaque coup.

items.weapon.melee.largekatana.name=Odachi
items.weapon.melee.largekatana.stats_desc=Cette arme a une puissance d'attaque minimale très faible mais une puissance d'attaque maximale légèrement plus élevée.
items.weapon.melee.largekatana.ability_name=Coupe Éclair
items.weapon.melee.largekatana.ability_desc=Le Duelliste maniant un Odachi peut utiliser la _Coupe Éclair_. Cette capacité s'active immédiatement et ne consomme aucun tour, attaquant un seul ennemi. Si cette capacité vainc l'ennemi, tu gagnes _%s_ charges d'arme.
items.weapon.melee.largekatana.typical_ability_desc=Le Duelliste maniant un Odachi peut utiliser la _Coupe Éclair_. Cette capacité s'active immédiatement et ne consomme aucun tour, attaquant un seul ennemi. Si cette capacité vainc l'ennemi, tu gagnes _%s_ charges d'arme.
items.weapon.melee.largekatana.desc=Un type de sabre à la lame aussi longue que la taille d'une personne, de forme courbée. L'Odachi est très lourd et difficile à manier à cause de sa longueur, mais si tu peux le manier librement, il garantira des performances proportionnelles à sa taille.

items.weapon.melee.alchemy.sharpkatana.name=Lame Affûtée
items.weapon.melee.alchemy.sharpkatana.stats_desc=Cette arme a une puissance d'attaque minimale très faible mais une puissance d'attaque maximale légèrement plus élevée.
items.weapon.melee.alchemy.sharpkatana.ability_name=Coupe Éclair
items.weapon.melee.alchemy.sharpkatana.ability_desc=Le Duelliste maniant une Lame Affûtée peut utiliser la _Coupe Éclair_. Cette capacité s'active immédiatement et ne consomme aucun tour, attaquant un seul ennemi. Si cette capacité vainc l'ennemi, tu gagnes 0.35 charge d'arme.
items.weapon.melee.alchemy.sharpkatana.desc=Une épée d'un tel tranchant que tout ce qui effleure sa lame serait coupé.

items.weapon.melee.herosword.name=Épée du Héros
items.weapon.melee.herosword.desc=Une épée forgée pour le Duelliste, imprégnée du pouvoir de charmes anciens.
items.weapon.melee.herosword.properties=L'Épée du Héros contient les informations de _%s_, et toutes les performances d'attaque et de défense de l'Épée du Héros seront identiques à celles de cette arme.
items.weapon.melee.herosword.ability_select=Choisis la capacité d'arme de l'Épée du Héros. Annuler ne fera pas apparaître une nouvelle capacité.
items.weapon.melee.herosword.cancel=Annuler
items.weapon.melee.herosword.prefix=L'Épée du Héros possède la capacité suivante :
items.weapon.melee.meleeweapon.ability_name=Aucune Capacité
items.weapon.melee.meleeweapon.ability_desc=Il n'y a aucune capacité dans cette arme.

### alchemy weapons

items.weapon.melee.alchemy.truerunicblade.name=Véritable Lame Runique
items.weapon.melee.alchemy.truerunicblade.ability_name=taillade runique
items.weapon.melee.alchemy.truerunicblade.ability_desc=Le Duelliste peut effectuer une _taillade runique_ avec une lame runique. Cette attaque touche toujours et a _+%d%% de puissance d'enchantement._
items.weapon.melee.alchemy.truerunicblade.typical_ability_desc=Le Duelliste peut effectuer une _taillade runique_ avec une lame runique. Cette attaque touche toujours et a typiquement _+%d%% de puissance d'enchantement._
items.weapon.melee.alchemy.truerunicblade.desc=Cette lame runique dorée, maintenant restaurée à sa puissance originelle, peut libérer la véritable magie en elle, amplifiant grandement les propriétés magiques qui lui sont accordées.

items.weapon.melee.alchemy.chainwhip.name=Fouet à Chaîne
items.weapon.melee.alchemy.chainwhip.stats_desc=Cette arme a une portée d'attaque exceptionnellement longue.
items.weapon.melee.alchemy.chainwhip.ability_name=fouetter
items.weapon.melee.alchemy.chainwhip.ability_desc=Le Duelliste peut _fouetter_ tous les ennemis autour d'elle avec un fouet. Cette capacité inflige _%1$d-%2$d dégâts_, attaque tous les ennemis à portée d'attaque, et touche toujours.
items.weapon.melee.alchemy.chainwhip.typical_ability_desc=Le Duelliste peut _fouetter_ tous les ennemis autour d'elle avec un fouet. Cette capacité inflige typiquement _%1$d-%2$d dégâts_, attaque tous les ennemis à portée d'attaque, et touche toujours.
items.weapon.melee.alchemy.chainwhip.desc=Une arme entièrement composée de chaînes. En étendant les chaînes plus longtemps qu'un fouet classique, il est possible d'attaquer des ennemis éloignés. Le poids du métal utilisé pour les chaînes rend l'arme difficile à manier avec peu de force, mais il peut être utilisé pour étourdir les ennemis grâce à l'impact des chaînes.

items.weapon.melee.alchemy.obsidianshield.name=Bouclier d'Obsidienne
items.weapon.melee.alchemy.obsidianshield.typical_stats_desc=Typiquement, cette arme réduit les dégâts physiques et magiques de 0 à %d. Ce taux de réduction augmente avec l'amélioration.
items.weapon.melee.alchemy.obsidianshield.ability_name=garde
items.weapon.melee.alchemy.obsidianshield.ability_desc=Le Duelliste peut se _mettre en garde_ avec un bouclier rond, annulant complètement toutes les attaques physiques ou magiques dirigées contre elle pendant _%d tours_. Une fois que le Duelliste a bloqué une attaque, contre-attaquer ou utiliser la magie mettra fin à la garde.
items.weapon.melee.alchemy.obsidianshield.typical_ability_desc=Le Duelliste peut se _mettre en garde_ avec un bouclier rond, annulant complètement toutes les attaques physiques ou magiques dirigées contre elle typiquement pendant _%d tours_. Une fois que le Duelliste a bloqué une attaque, contre-attaquer ou utiliser la magie mettra fin à la garde.
items.weapon.melee.alchemy.obsidianshield.stats_desc=Cette arme réduit les dégâts physiques et magiques de 0 à %d. Ce taux de réduction augmente avec l'amélioration.
items.weapon.melee.alchemy.obsidianshield.desc=Ce bouclier, incrusté d'obsidienne et imprégné de pouvoir magique, crée une résistance magique autour de lui. Cependant, dans ce processus, ses performances contre les attaques physiques semblent avoir diminué.

items.weapon.melee.alchemy.lance.name=Lance
items.weapon.melee.alchemy.lance.stats_desc=Cette arme inflige des dégâts croissants plus tu te déplaces.\nCette arme peut attaquer les ennemis à terre.
items.weapon.melee.alchemy.lance.ability_name=charger
items.weapon.melee.alchemy.lance.ability_desc=Le Duelliste maniant une Lance peut _Charger_. Charger te permet typiquement de te déplacer jusqu'à _%d_ cases sans consommer de tour et de gagner immédiatement de l'élan en fonction de la distance parcourue.
items.weapon.melee.alchemy.lance.typical_ability_desc=Le Duelliste maniant une Lance peut _Charger_. Charger te permet de te déplacer jusqu'à _%d_ cases sans consommer de tour et de gagner immédiatement de l'élan en fonction de la distance parcourue.
items.weapon.melee.alchemy.lance.ability_bad_position=Tu ne peux pas te ruer vers cette position.
items.weapon.melee.alchemy.lance.desc=Une lance entièrement faite de métal, conçue pour le combat monté. En raison de sa longueur, elle peut attaquer des ennemis éloignés, et en te déplaçant, tu peux prendre de l'élan pour infliger de plus grands dégâts.
items.weapon.melee.alchemy.lance$lancebuff.name=Charge
items.weapon.melee.alchemy.lance$lancebuff.desc=Tu commences à charger, lance tenue fermement devant toi, accumulant continuellement de l'élan. Plus tu charges longtemps, plus les dégâts que tu infligeras seront grands, mais cela diminuera progressivement avec le temps. La charge s'accumule plus vite avec une vitesse de déplacement plus élevée.\n\nMultiplicateur de dégâts actuel : %sx
    
items.weapon.melee.alchemy.lancenshield.name=Lance et Bouclier
items.weapon.melee.alchemy.lancenshield.ac_change=Changer de Posture
items.weapon.melee.alchemy.lancenshield.typical_stats_desc_attack=Cette arme inflige des dégâts croissants plus tu te déplaces.\nCette arme peut attaquer les ennemis à terre.
items.weapon.melee.alchemy.lancenshield.stats_desc_attack=Cette arme inflige des dégâts croissants plus tu te déplaces.\nCette arme peut attaquer les ennemis à terre.
items.weapon.melee.alchemy.lancenshield.typical_stats_desc_defense=Typiquement, cette arme réduit les dégâts physiques et magiques de 0 à %d. Ce taux de réduction augmente avec l'amélioration.
items.weapon.melee.alchemy.lancenshield.stats_desc_defense=Cette arme réduit les dégâts physiques et magiques de 0 à %d. Ce taux de réduction augmente avec l'amélioration.
items.weapon.melee.alchemy.lancenshield.ability1_name=charger
items.weapon.melee.alchemy.lancenshield.ability2_name=garde
items.weapon.melee.alchemy.lancenshield.ability1_desc=Le Duelliste maniant une Lance peut _Charger_. Charger te permet de te déplacer jusqu'à _%d_ cases sans consommer de tour et de gagner immédiatement de l'élan en fonction de la distance parcourue.
items.weapon.melee.alchemy.lancenshield.typical_ability1_desc=Le Duelliste maniant une Lance peut _Charger_. Charger te permet typiquement de te déplacer jusqu'à _%d_ cases sans consommer de tour et de gagner immédiatement de l'élan en fonction de la distance parcourue.
items.weapon.melee.alchemy.lancenshield.ability2_desc=Le Duelliste peut se _mettre en garde_ avec un bouclier rond, annulant complètement toutes les attaques physiques ou magiques dirigées contre elle pendant _%d tours_. Une fois que le Duelliste a bloqué une attaque, contre-attaquer ou utiliser la magie mettra fin à la garde.
items.weapon.melee.alchemy.lancenshield.typical_ability2_desc=Le Duelliste peut se _mettre en garde_ avec un bouclier rond, annulant complètement toutes les attaques physiques ou magiques dirigées contre elle typiquement pendant _%d tours_. Une fois que le Duelliste a bloqué une attaque, contre-attaquer ou utiliser la magie mettra fin à la garde.
items.weapon.melee.alchemy.lancenshield.desc=Une version améliorée de la Lance et du Bouclier, permettant d'utiliser immédiatement chaque arme selon le besoin.\n\nEn _Posture d'Attaque_, tu utilises la capacité de la _Lance_.\nEn _Posture de Défense_, tu utilises la capacité du _Bouclier d'Obsidienne_.
items.weapon.melee.alchemy.lancenshield.change_attack=Tu as changé ta posture de combat pour la posture d'attaque.
items.weapon.melee.alchemy.lancenshield.change_defense=Tu as changé ta posture de combat pour la posture de défense.
items.weapon.melee.alchemy.lancenshield.not_equipped=Tu dois d'abord équiper l'arme pour changer de posture de combat.

items.weapon.melee.alchemy.chainflail.name=Fléau à Chaîne
items.weapon.melee.alchemy.chainflail.stats_desc=Cette arme peut attaquer des ennemis éloignés.\nCette arme a une précision légèrement réduite.\nElle ne peut pas effectuer d'attaques furtives.
items.weapon.melee.alchemy.chainflail.desc=Une arme conçue pour attaquer des ennemis éloignés en étendant la partie chaîne du fléau. Elle demande une force considérable pour obtenir assez de force centrifuge afin d'attaquer avec la chaîne étendue.
items.weapon.melee.alchemy.chainflail.ability_name=Rotation
items.weapon.melee.alchemy.chainflail.spin_warn=Impossible de faire tourner le fléau davantage.
items.weapon.melee.alchemy.chainflail.ability_desc=Le Duelliste peut faire _tourner_ un fléau pour accumuler de la puissance pendant un court moment. Chaque tour où le fléau tourne, il infligera _+%d dégâts_, jusqu'à un maximum de 3 fois. Un fléau en rotation touche aussi toujours. Seul le début de la rotation coûte une charge.
items.weapon.melee.alchemy.chainflail.typical_ability_desc=Le Duelliste peut faire _tourner_ un fléau pour accumuler de la puissance pendant un court moment. Chaque tour où le fléau tourne, il infligera typiquement _+%d dégâts_, jusqu'à un maximum de 3 fois. Un fléau en rotation touche aussi toujours. Seul le début de la rotation coûte une charge.
items.weapon.melee.alchemy.chainflail$spinabilitytracker.name=Rotation
items.weapon.melee.alchemy.chainflail$spinabilitytracker.desc=Tu fais tourner le fléau, rassemblant de la force pour la prochaine attaque. Chaque tour passé à tourner consomme 1 charge mais accorde +20% de dégâts supplémentaires. De plus, l'attaque en rotation touche toujours.\n\nDégâts supplémentaires actuels : %1$d%%.\nTours restants : %2$s.

items.weapon.melee.alchemy.unformedblade.name=Lame Informe
items.weapon.melee.alchemy.unformedblade.stats_desc=Cette arme est plus efficace contre les ennemis inattentifs.
items.weapon.melee.alchemy.unformedblade.ability_name=discrétion
items.weapon.melee.alchemy.unformedblade.ability_desc=Le Duelliste peut se déplacer _discrètement_ en maniant une lame informe. Cette capacité permet au Duelliste de se téléporter instantanément jusqu'à 2 cases plus loin et lui accorde _%d tours d'invisibilité._
items.weapon.melee.alchemy.unformedblade.typical_ability_desc=Le Duelliste peut se déplacer _discrètement_ en maniant une lame informe. Cette capacité permet au Duelliste de se téléporter instantanément jusqu'à 2 cases plus loin et lui accorde typiquement _%d tours d'invisibilité._
items.weapon.melee.alchemy.unformedblade.desc=Une lame à la forme changeante, partiellement transparente. Elle peut accumuler de l'énergie sombre en prenant les ennemis en embuscade, et une fois relâchée, il y a une chance de frapper les ennemis avec l'effet de l'enchantement _Funeste_ comme si elle les prenait en embuscade.
items.weapon.melee.alchemy.unformedblade.not_equipped=Tu dois d'abord équiper l'arme.
items.weapon.melee.alchemy.unformedblade.ac_use=Décharger
items.weapon.melee.alchemy.unformedblade.no_charge=Aucune énergie sombre n'a encore été chargée dans l'arme !
items.weapon.melee.alchemy.unformedblade.power_on=L'énergie sombre commence à se décharger de l'arme !
items.weapon.melee.alchemy.unformedblade.power_off=L'énergie sombre déchargée de l'arme a disparu.
items.weapon.melee.alchemy.unformedblade.energy=Cette arme peut accumuler de l'énergie sombre en prenant les ennemis en embuscade, lui permettant de frapper les ennemis avec l'effet de _Magie Funeste_ lors d'une embuscade.\n\nElle charge _%1$d%%_ d'énergie en prenant un ennemi en embuscade une fois et consomme _%2$d%%_ d'énergie par attaque en embuscade lorsqu'elle décharge de l'énergie. Si l'ennemi est pris en embuscade pendant la décharge d'énergie, _%2$d%%_ d'énergie supplémentaire est consommée.\n\nÉnergie stockée : _%3$d%%_/_%4$d%%_.

items.weapon.melee.alchemy.ar_t6.name=Fusil d'Assaut Tactique
items.weapon.melee.alchemy.ar_t6.desc=Le fusil d'assaut le plus performant.
items.weapon.melee.alchemy.sr_t6.name=Fusil de Précision Tactique
items.weapon.melee.alchemy.sr_t6.desc=Le fusil de précision le plus performant.
items.weapon.melee.alchemy.hg_t6.name=Pistolet Tactique
items.weapon.melee.alchemy.hg_t6.desc=Le pistolet le plus performant.
items.weapon.melee.alchemy.gl_t6.name=Lance-grenades Tactique
items.weapon.melee.alchemy.gl_t6.desc=Le lance-grenades le plus performant.
items.weapon.melee.alchemy.rl_t6.name=Lance-roquettes Tactique
items.weapon.melee.alchemy.rl_t6.desc=Le lance-roquettes le plus performant.

items.weapon.melee.alchemy.spearnshield.name=Lance et Bouclier
items.weapon.melee.alchemy.spearnshield.ac_change=Changer de Posture
items.weapon.melee.alchemy.spearnshield.typical_stats_desc_attack=Cette arme est plus lente que les autres.\nCette arme peut attaquer les ennemis à terre.
items.weapon.melee.alchemy.spearnshield.stats_desc_attack=Cette arme est plus lente que les autres.\nCette arme peut attaquer les ennemis à terre.
items.weapon.melee.alchemy.spearnshield.typical_stats_desc_defense=Typiquement, cette arme réduit les dégâts physiques de _0-%d_. Ce taux de réduction augmente avec l'amélioration.
items.weapon.melee.alchemy.spearnshield.stats_desc_defense=Cette arme réduit les dégâts physiques de _0-%d_. Ce taux de réduction augmente avec l'amélioration.
items.weapon.melee.alchemy.spearnshield.ability1_name=piquer
items.weapon.melee.alchemy.spearnshield.ability2_name=garde
items.weapon.melee.alchemy.spearnshield.ability1_desc=Le Duelliste peut utiliser la pointe d'une lance pour _piquer_ un ennemi à portée mais non adjacent. Cela inflige _%1$d-%2$d_ dégâts, repousse l'ennemi, et touche toujours.
items.weapon.melee.alchemy.spearnshield.typical_ability1_desc=Le Duelliste peut utiliser la pointe d'une lance pour _piquer_ un ennemi à portée mais non adjacent. Cela inflige typiquement _%1$d-%2$d_ dégâts, repousse l'ennemi, et touche toujours.
items.weapon.melee.alchemy.spearnshield.ability2_desc=Le Duelliste peut se _mettre en garde_ avec un bouclier rond, annulant complètement toutes les attaques physiques ou magiques dirigées contre elle pendant _%d tours_. Une fois que le Duelliste a bloqué une attaque, contre-attaquer ou utiliser la magie mettra fin à la garde.
items.weapon.melee.alchemy.spearnshield.typical_ability2_desc=Le Duelliste peut se _mettre en garde_ avec un bouclier rond, annulant complètement toutes les attaques physiques ou magiques dirigées contre elle typiquement pendant _%d tours_. Une fois que le Duelliste a bloqué une attaque, contre-attaquer ou utiliser la magie mettra fin à la garde.
items.weapon.melee.alchemy.spearnshield.desc=Une arme permettant d'utiliser immédiatement chaque arme selon le besoin en tenant une lance et un bouclier rond séparément.\n\nEn _posture d'attaque_, elle utilise la _lance_.\nEn _posture de défense_, elle utilise le _bouclier rond_.
items.weapon.melee.alchemy.spearnshield.change_attack=Tu as changé ta posture de combat pour la posture d'attaque.
items.weapon.melee.alchemy.spearnshield.change_defense=Tu as changé ta posture de combat pour la posture de défense.
items.weapon.melee.alchemy.spearnshield.not_equipped=Tu dois d'abord équiper l'arme.

items.weapon.melee.alchemy.assassinsspear.name=Lance de l'Assassin
items.weapon.melee.alchemy.assassinsspear.stats_desc=Cette arme est plus lente que les autres.\nCette arme peut attaquer les ennemis à terre.\nCette arme est plus efficace contre les ennemis sans armure.
items.weapon.melee.alchemy.assassinsspear.ability_name=Estoc de l'Assassin
items.weapon.melee.alchemy.assassinsspear.ability_desc=Le Duelliste maniant une Lance de l'Assassin peut utiliser l'_estoc de l'assassin_. Cette attaque puissante mais prévisible a une précision de -75%% mais inflige _%1$d-%2$d_ dégâts si elle touche. L'Estoc de l'Assassin peut être utilisé pour des attaques en embuscade, même contre des ennemis hors de vue.
items.weapon.melee.alchemy.assassinsspear.typical_ability_desc=Le Duelliste maniant une Lance de l'Assassin peut utiliser l'_estoc de l'assassin_. Cette attaque puissante mais prévisible a une précision de -75%% mais inflige typiquement _%1$d-%2$d_ dégâts si elle touche. L'Estoc de l'Assassin peut être utilisé pour des attaques en embuscade, même contre des ennemis hors de vue.
items.weapon.melee.alchemy.assassinsspear.desc=Une arme modifiée qui remplace la lame de la glaive par celle d'une dague d'assassin pour infliger plus de dégâts aux ennemis sans armure. Sa vitesse d'attaque a ralenti à cause de la longueur de l'arme, mais elle peut désormais attaquer des ennemis distants.

items.weapon.melee.alchemy.dualgreatsword.name=Épée à Deux Mains Jumelle
items.weapon.melee.alchemy.dualgreatsword.ability_name=Taillade
items.weapon.melee.alchemy.dualgreatsword.ability_desc=Le Duelliste peut _taillader_ un ennemi avec une épée longue. Cela inflige _%1$d-%2$d dégâts_ et touche toujours. Si la taillade tue un ennemi, elle est instantanée et le Duelliste peut réutiliser la taillade gratuitement dans les 5 tours suivants.
items.weapon.melee.alchemy.dualgreatsword.typical_ability_desc=Le Duelliste peut _taillader_ un ennemi avec une épée longue. Cela inflige typiquement _%1$d-%2$d dégâts_ et touche toujours. Si la taillade tue un ennemi, elle est instantanée et le Duelliste peut réutiliser la taillade gratuitement dans les 5 tours suivants.
items.weapon.melee.alchemy.dualgreatsword.desc=Une arme très lourde maniée à deux mains pour délivrer de puissantes attaques consécutives. Elle peut être une arme incroyablement redoutable si elle est bien maniée, mais elle demande une force considérable.
items.weapon.melee.alchemy.dualgreatsword.stats_desc=Cette arme peut attaquer très rapidement.\nCette arme est très lourde.

items.weapon.melee.alchemy.forceglove.name=Gant de Force
items.weapon.melee.alchemy.forceglove.stats_desc=Cette arme peut projeter au loin les ennemis proches.\n\nCette arme peut attaquer un ennemi à distance.
items.weapon.melee.alchemy.forceglove.desc=Un gant imprégné de la magie de la force, lui permettant d'attaquer des ennemis distants avec une force invisible. L'immense force du gant suffit à infliger de légers dégâts aux ennemis proches tout en les projetant au loin.
items.weapon.melee.alchemy.forceglove.no_target=Aucune cible trouvée.
items.weapon.melee.alchemy.forceglove.immovable=La cible ne peut pas être tirée.
items.weapon.melee.alchemy.forceglove.does_nothing=Rien ne se passe.
items.weapon.melee.alchemy.forceglove.ability_bad_position=Tu ne peux pas tirer la cible à cette position !
items.weapon.melee.alchemy.forceglove.ability_name=Onde de Choc
items.weapon.melee.alchemy.forceglove.ability_desc=Le Duelliste maniant un Gant de Force peut utiliser l'_Onde de Choc_. Cette capacité tire les ennemis dans un rayon de _%d_ cases vers la direction du héros, infligeant des dégâts proportionnels à la distance parcourue et les étourdissant.
items.weapon.melee.alchemy.forceglove.typical_ability_desc=Le Duelliste maniant un Gant de Force peut utiliser l'_Onde de Choc_. Cette capacité tire les ennemis typiquement dans un rayon de _%d_ cases vers la direction du héros, infligeant des dégâts proportionnels à la distance parcourue et les étourdissant.

items.weapon.melee.alchemy.tacticalshield.name=Bouclier Tactique
items.weapon.melee.alchemy.tacticalshield.desc=Conçu pour la défense, ce bouclier peut être levé pour bloquer la plupart des attaques venant de face. Il permet aussi de manier un petit pistolet en même temps.
items.weapon.melee.alchemy.tacticalshield.ac_shoot=TIRER
items.weapon.melee.alchemy.tacticalshield.not_equipped=Doit être équipé pour tirer.
items.weapon.melee.alchemy.tacticalshield.reloading=Tu as rechargé l'arme.
items.weapon.melee.alchemy.tacticalshield.ac_reload=RECHARGER
items.weapon.melee.alchemy.tacticalshield.already_loaded=Toutes les munitions sont déjà chargées.
items.weapon.melee.alchemy.tacticalshield.stats_known=Les munitions tirées par cette arme infligent _%1$d_-_%2$d_ dégâts, et le rechargement prend _%5$s_ tours après avoir tiré _%3$d_ / _%4$d_ coups.
items.weapon.melee.alchemy.tacticalshield.stats_unknown=Typiquement, les munitions tirées par cette arme infligent _%1$d_-_%2$d_ dégâts, et le rechargement prend _%5$s_ tours après avoir tiré _%3$d_ / _%4$d_ coups.
items.weapon.melee.alchemy.tacticalshield.typical_stats_desc=Typiquement, cette arme réduit 0 à %d dégâts. Ce taux de réduction augmente avec l'amélioration.
items.weapon.melee.alchemy.tacticalshield.stats_desc=Cette arme réduit 0 à %d dégâts. Ce taux de réduction augmente avec l'amélioration.

items.weapon.melee.alchemy.unholybible.name=Bible Impie
items.weapon.melee.alchemy.unholybible.stats_desc=Cette arme inflige des effets néfastes aux ennemis.
items.weapon.melee.alchemy.unholybible.ability_name=Démonisation
items.weapon.melee.alchemy.unholybible.ability_desc=Le Duelliste maniant la Bible Impie peut se _démoniser_ temporairement, gagnant +33%% de puissance d'attaque et des coups garantis pendant _%d_ tours, mais subissant -50%% d'esquive à cause de la concentration intense sur l'offensive. La Démonisation ne consomme pas de tour.
items.weapon.melee.alchemy.unholybible.typical_ability_desc=Le Duelliste maniant la Bible Impie peut se _démoniser_ temporairement, gagnant +33%% de puissance d'attaque et des coups garantis typiquement pendant _%d_ tours, mais subissant -50%% d'esquive à cause de la concentration intense sur l'offensive. La Démonisation ne consomme pas de tour.
items.weapon.melee.alchemy.unholybible.desc=Imprégnée d'énergie malveillante, la Bible Impie accorde à celui qui la manie la capacité d'infliger des effets néfastes aléatoires aux ennemis frappés et occasionnellement de les mener à leur perte.

items.weapon.melee.alchemy.holysword.name=Épée Lourde
items.weapon.melee.alchemy.holysword.true_name=Épée Sacrée
items.weapon.melee.alchemy.holysword.stats_desc=La force requise pour améliorer cette arme n'augmente pas.
items.weapon.melee.alchemy.holysword.true_ability_name=Protection Divine
items.weapon.melee.alchemy.holysword.ability_name=???
items.weapon.melee.alchemy.holysword.true_ability_desc=Le Duelliste maniant l'Épée Sacrée peut utiliser la _Protection Divine_. Cette capacité s'active instantanément, fournissant à l'utilisateur un bouclier égal à 20% de la vie maximale. Cette capacité consomme 2 charges.
items.weapon.melee.alchemy.holysword.ability_desc=Incapable de débloquer son véritable pouvoir par manque de force, les capacités de l'arme restent inaccessibles.
items.weapon.melee.alchemy.holysword.true_desc=Une épée géante imprégnée d'un pouvoir sacré. Ayant retrouvé sa véritable force, l'Épée Sacrée peut délivrer des attaques rapides et restaurer la vie de celui qui la manie à chaque coup.
items.weapon.melee.alchemy.holysword.normal_desc=Une épée lourde qui semble abriter un pouvoir endormi. Si seulement assez de force était disponible...

items.weapon.melee.alchemy.hugesword.name=Épée Géante
items.weapon.melee.alchemy.hugesword.ability_name=Taillade
items.weapon.melee.alchemy.hugesword.ability_desc=Le Duelliste peut _taillader_ un ennemi avec une épée à deux mains. Cela inflige _%1$d-%2$d dégâts_ et touche toujours. Si la taillade tue un ennemi, elle est instantanée et le Duelliste peut réutiliser la taillade gratuitement dans les 5 tours suivants.
items.weapon.melee.alchemy.hugesword.typical_ability_desc=Le Duelliste peut _taillader_ un ennemi avec une épée à deux mains. Cela inflige typiquement _%1$d-%2$d dégâts_ et touche toujours. Si la taillade tue un ennemi, elle est instantanée et le Duelliste peut réutiliser la taillade gratuitement dans les 5 tours suivants.
items.weapon.melee.alchemy.hugesword.stats_desc=Cette arme est très lourde.
items.weapon.melee.alchemy.hugesword.desc=Une arme standard magiquement améliorée à un degré supérieur. Extrêmement lourde, elle garantit une puissance d'attaque redoutable si on peut la manier efficacement. Frapper avec l'épée à deux mains affaiblit occasionnellement les ennemis.

items.weapon.melee.alchemy.meisterhammer.name=Marteau du Maître
items.weapon.melee.alchemy.meisterhammer.stats_desc=Cette arme est plus précise que les autres.
items.weapon.melee.alchemy.meisterhammer.ability_name=coup lourd
items.weapon.melee.alchemy.meisterhammer.ability_desc=Le Duelliste peut effectuer un _coup lourd_ avec un marteau du maître. Cette attaque concentrée inflige _%1$d-%2$d dégâts_ si elle surprend l'ennemi, et l'étourdit mentalement pendant 5 tours, réduisant précision et esquive de 50%%. Le coup lourd touche toujours mais inflige des dégâts normaux s'il ne surprend pas l'ennemi.
items.weapon.melee.alchemy.meisterhammer.typical_ability_desc=Le Duelliste peut effectuer un _coup lourd_ avec un marteau du maître. Cette attaque concentrée inflige typiquement _%1$d-%2$d dégâts_ si elle surprend l'ennemi, et l'étourdit mentalement pendant 5 tours, réduisant précision et esquive de 50%%. Le coup lourd touche toujours mais inflige des dégâts normaux s'il ne surprend pas l'ennemi.
items.weapon.melee.alchemy.meisterhammer.desc=Un grand marteau à l'apparence familière. Son poids important rend facile de frapper les ennemis, et un coup bien placé étourdira brièvement l'ennemi.

items.weapon.melee.alchemy.beamsaber.name=Sabre Laser
items.weapon.melee.alchemy.beamsaber.stats_desc=Cette arme peut attaquer très rapidement.
items.weapon.melee.alchemy.beamsaber.ability_name=frappe combo
items.weapon.melee.alchemy.beamsaber.ability_desc=Le Duelliste peut effectuer une _frappe combo_ avec des gants cloutés. Cette attaque touche toujours et inflige _+%d dégâts_ pour chaque attaque réussie récente du Duelliste avec une arme de mêlée ou de jet. Ne pas réussir une attaque pendant 5 tours réinitialise ce combo.
items.weapon.melee.alchemy.beamsaber.typical_ability_desc=Le Duelliste peut effectuer une _frappe combo_ avec des gants cloutés. Cette attaque touche toujours et inflige typiquement _+%d dégâts_ pour chaque attaque réussie récente du Duelliste avec une arme de mêlée ou de jet. Ne pas réussir une attaque pendant 5 tours réinitialise ce combo.
items.weapon.melee.alchemy.beamsaber.desc=Un summum de la technologie optique, ce sabre laser permet un maniement rapide grâce à sa lame de lumière. Occasionnellement, l'intense luminosité aveuglera momentanément les ennemis.



### new bows
items.weapon.bow.naturesbow.name=Arc de la Nature
items.weapon.bow.naturesbow.stats=Cet arc ne peut pas être directement renforcé mais devient progressivement plus fort selon ton niveau. À ton niveau actuel, les flèches tirées de l'Arc de la Nature infligent _%1$d-%2$d_ dégâts et nécessitent _%3$d_ de Force pour être maniées correctement.
items.weapon.bow.naturesbow.desc=Un arc ayant retrouvé sa forme originelle et évolué vers un état complet. Entouré d'une teinte bleutée légère, cet arc mystérieux est imprégné du pouvoir de la nature, immobilisant occasionnellement les ennemis et déclenchant des effets néfastes sur eux.
items.weapon.bow.naturesbow.ui_title=Choisir une Plante
items.weapon.bow.naturesbow.ui_desc=Choisis les plantes à activer avec l'arc de la nature.\nLa probabilité ne change pas même si tu désactives une certaine plante, l'effet d'enracinement s'activera quand même.
items.weapon.bow.naturesbow.ac_choose=CHOISIR

items.weapon.bow.goldenbow.name=Arc Doré
items.weapon.bow.goldenbow.stats=Cet arc ne peut pas être directement renforcé mais devient progressivement plus fort selon ton niveau. À ton niveau actuel, les flèches tirées de l'Arc Doré infligent _%1$d-%2$d_ dégâts et nécessitent _%3$d_ de Force pour être maniées correctement.
items.weapon.bow.goldenbow.desc=Un arc d'une beauté exquise qui brille d'une teinte dorée. Rayonnant d'un aspect éblouissant rappelant le pouvoir du soleil, cet arc peut infliger plus de dégâts aux ennemis et améliore légèrement la précision.

items.weapon.bow.windbow.name=Arc du Vent
items.weapon.bow.windbow.stats=Cet arc ne peut pas être directement renforcé mais devient progressivement plus fort selon ton niveau. À ton niveau actuel, les flèches tirées de l'Arc du Vent infligent _%1$d-%2$d_ dégâts et nécessitent _%3$d_ de Force pour être maniées correctement.
items.weapon.bow.windbow.desc=Un arc plus léger imprégné du pouvoir du vent. Sa corde, imprégnée du pouvoir du vent, est d'un blanc pâle, permettant de bander l'arc facilement avec moins de force. Frapper les ennemis avec des flèches peut occasionnellement provoquer des coups supplémentaires grâce au pouvoir du vent.

items.weapon.bow.corrosivebow.name=Arc Corrosif
items.weapon.bow.corrosivebow.stats=Cet arc ne peut pas être directement renforcé mais devient progressivement plus fort selon ton niveau. À ton niveau actuel, les flèches tirées de l'Arc Corrosif infligent _%1$d-%2$d_ dégâts et nécessitent _%3$d_ de Force pour être maniées correctement.
items.weapon.bow.corrosivebow.desc=Un arc émanant une aura sinistre. Chaque flèche tirée corrode progressivement les ennemis à l'impact. À chaque coup, la durée de la corrosion augmente, tout comme les dégâts infligés.

items.weapon.bow.tacticalbow.name=Arc Tactique
items.weapon.bow.tacticalbow.stats=Cet arc devient progressivement plus fort selon ton niveau. À ton niveau actuel, les flèches tirées de l'Arc Tactique infligent _%1$d-%2$d_ dégâts et nécessitent _%3$d_ de Force pour être maniées correctement.
items.weapon.bow.tacticalbow.desc=Un arc lourd renforcé de matériaux avancés. Amélioré avec un viseur laser, il offre une meilleure précision et peut être directement renforcé.
items.weapon.bow.tacticalbow.modification=Cet arc a été modifié _%d_ fois.

### new alchemy consumables

items.spells.evolution.name=évolution instable
items.spells.evolution.inv_title=Choisis une arme à faire évoluer
items.spells.evolution.nothing=Rien ne semble avoir changé.
items.spells.evolution.evolve=Ton arme a évolué !
items.spells.evolution.desc=Ce sort instable contient une magie similaire à celle du parchemin de transmutation, mais n'est utilisable que sur les armes. L'arme évoluée a une chance de devenir le rang suivant d'arme.\n\nLe niveau d'amélioration et l'enchantement de l'arme évoluée seront conservés, et les armes au-delà du rang 5 n'évolueront pas mais se transformeront à la place en une arme aléatoire de rang 5. Les modifications sur les armes à feu ne seront pas conservées.

items.spells.upgradedust.name=Poussière d'Amélioration
items.spells.upgradedust.desc=Cette poussière dorée imprégnée d'un pouvoir mystique est typiquement utilisée en alchimie d'armes, mais elle peut aussi être utilisée directement pour améliorer temporairement les performances de l'arme et de l'armure que tu portes.
items.spells.upgradedust.ac_cast=Répandre
items.spells.upgradedust.empower=Alors que tu répands la poussière autour de toi, ton équipement se met à briller !

items.spells.handybarricade.name=Barricade Portable
items.spells.handybarricade.desc=Ce puissant sort te permet de déployer instantanément une barricade dans la zone 3x3 entourant l'emplacement ciblé dans la portée du sort. Cependant, la barricade ne peut être déployée que sur de _l'eau, un sol solide, de l'herbe, de l'herbe haute, de l'herbe flétrie_ et des _braises_.

items.spells.xray.name=Concentration Mentale
items.spells.xray.desc=En lançant ce sort, les emplacements de tous les objets de l'étage actuel seront gravés dans ta mémoire pendant une courte période.
items.spells.xray.xray=Tu as étrangement acquis la connaissance des emplacements de tous les objets de l'étage actuel !

items.spells.rapidgrowth.name=Croissance Rapide
items.spells.rapidgrowth.desc=Ce sort exploite le pouvoir de la nature pour répandre rapidement de l'énergie vitale autour du point d'impact au lancement, provoquant une croissance rapide de la végétation et entravant les cibles dans la zone.

items.spells.firemaker.name=Ignition
items.spells.firemaker.desc=Ce sort contient le pouvoir de faibles flammes. Une fois lancé, une brève flamme s'allume au point d'impact.

items.spells.icemaker.name=Congélation
items.spells.icemaker.desc=Ce sort porte l'essence de la glace, créant un nuage glacial au point d'impact une fois lancé.

items.spells.fireimbuespell.name=Imprégnation de Feu
items.spells.fireimbuespell.desc=Ce puissant sort imprègne temporairement celui qui le lance de feu, lui accordant l'immunité au feu et la capacité d'enflammer par des attaques physiques. Il a un temps de recharge de 200 tours et ne consomme pas de tours.
items.spells.fireimbuespell.imbue=Tu as été imprégné de feu !
items.spells.fireimbuespell.cooldown=Le sort n'est pas encore prêt !
items.spells.fireimbuespell$imbuecooldown.name=Récupération : Imprégnation de Feu
items.spells.fireimbuespell$imbuecooldown.desc=Tu as récemment utilisé ce sort, et il te faut du temps avant qu'il soit prêt à nouveau.\n\nTours restants : %s.

items.potions.elixirs.elixiroftalent.name=Élixir de Talent
items.potions.elixirs.elixiroftalent.desc=Si un héros atteint la maîtrise complète en obtenant tous les points d'attribut de métier secondaire, boire cet élixir doré stimulera le cerveau du héros pour fournir des points d'attribut de métier secondaire supplémentaires. Cependant, l'effet puissant de l'élixir, combiné à une croissance rapide, entraînera un affaiblissement permanent.\n\nSi le héros n'a pas de métier secondaire, a déjà obtenu des points d'attribut de l'élixir une fois, ou a acquis des capacités spéciales, il recevra à la place +2 Force et augmentera de façon permanente sa vie maximale de 10%. L'augmentation de vie maximale de cet effet ne peut être obtenue qu'une seule fois.
items.potions.elixirs.elixiroftalent.str_ht=+2 Force. +10% de vie maximale
items.potions.elixirs.elixiroftalent.str=+2 Force
