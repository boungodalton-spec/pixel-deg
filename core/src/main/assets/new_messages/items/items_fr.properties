items.sheath$sheathing.cannot_dash=Impossible de se ruer vers cet endroit.
items.sheath$certaincrit.name=Critique Parfait
items.sheath$certaincrit.desc=Ta concentration est hautement renforcée, rendant les faiblesses de l'ennemi parfaitement visibles. Tant que le Critique Parfait est actif, les attaques physiques auront +100% de chance de coup critique.\n\nAttaques restantes : _%d_.
