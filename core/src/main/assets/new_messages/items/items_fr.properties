items.trinkets.grindstone.name=Meule Mystique
items.trinkets.grindstone.desc=Avec un pouvoir mystérieux, cette meule affecte les armes que toi et les autres personnages possédez. Le pouvoir de la meule réduit la défense physique de la cible, et finit par faire infliger plus de dégâts à l'attaque.
items.trinkets.grindstone.stats_desc=Au niveau actuel, ce bibelot réduit la défense de tous les personnages de _%1$d_-_%2$d_.\n\nCe bibelot consomme moins d'énergie pour s'améliorer.
items.trinkets.grindstone.typical_stats_desc=Typiquement ce bibelot réduit la défense de tous les personnages de _%1$d_-_%2$d_.\n\nCe bibelot consomme moins d'énergie pour s'améliorer.

###v3.34.0
items.weapon.melee.bow.bowweapon$bowfatigue.name=épuisement
items.weapon.melee.bow.bowweapon$bowfatigue.desc=Quand tu tires trop de flèches en peu de temps, tes bras s'affaiblissent.\n\nSi tu tires plus de 5 flèches d'affilée, les dégâts de chaque flèche suivante _diminueront de 10%_ par tir. Un peu de repos sans tirer peut retirer cet effet.\n\nFlèches tirées : _%1$d_\nTours restants : _%2$s_.
items.arrowbag.name=carquois de l'archer
items.arrowbag.desc=Un carquois spécialisé porté sur le dos de l'Archer.\n\nSon mécanisme unique permet d'imprégner des potions dans les flèches, leur conférant des effets supplémentaires selon le type et la rareté de la potion. Le nombre de flèches affectées varie cependant selon la potion utilisée.\n\nQuand le carquois est imprégné d'une Potion de Force ou de Maîtrise, il sera amélioré, augmentant le nombre de flèches par potion et accordant un bonus de dégâts aux flèches imprégnées.
items.arrowbag.potion_desc=Le carquois contient actuellement une _%1$s_ imprégnée, qui déclenchera des effets supplémentaires sur les %2$d prochaines flèches.
items.arrowbag.ac_inject=IMPRÉGNER
items.arrowbag.select_title=Choisis une potion à imprégner
#potions
items.arrowbag.desc_healing=Les flèches imprégnées de potion de guérison _soignent le héros de 40% des dégâts infligés_.
items.arrowbag.desc_mindvision=Les flèches imprégnées de potion de vision de l'esprit donneront au héros la vision de l'esprit sur l'ennemi touché.
items.arrowbag.desc_frost=Les flèches imprégnées de potion de givre ont _20% de chance de geler l'ennemi touché_.
items.arrowbag.desc_liquidflame=Les flèches imprégnées de potion de flamme liquide _enflammeront l'ennemi touché_.
items.arrowbag.desc_toxicgas=Les flèches imprégnées de potion de gaz toxique infligeront _3 (+20% des dégâts) tours de Poison_ à l'ennemi touché.
items.arrowbag.desc_haste=Les flèches imprégnées de potion de hâte donneront _3 tours de Hâte_ au héros.
items.arrowbag.desc_invisibility=Les flèches imprégnées de potion d'invisibilité infligeront _2 tours d'Aveuglement_ à l'ennemi touché.
items.arrowbag.desc_levitation=Les flèches imprégnées de potion de lévitation infligeront _3 tours de Vertige_ à l'ennemi touché.
items.arrowbag.desc_paralyticgas=Les flèches imprégnées de potion de gaz paralysant infligeront _2 tours de Paralysie_ à l'ennemi touché.
items.arrowbag.desc_purity=Les flèches imprégnées de potion de pureté _retireront les effets négatifs_ du héros et lui donneront _2 tours d'immunité aux effets négatifs_.
items.arrowbag.desc_experience=Les flèches imprégnées de potion d'expérience infligeront _beaucoup de dégâts bonus contre les morts-vivants et démons_.
#exotic potions
items.arrowbag.desc_shielding=Les flèches imprégnées de potion de bouclier donneront _5 (+10% de la vie max) points de bouclier_ au héros.
items.arrowbag.desc_magicalsight=Les flèches imprégnées de potion de vision magique feront _découvrir au héros tout ce qui se trouve dans une zone de 13x13 autour de lui_.
items.arrowbag.desc_snapfreeze=Les flèches imprégnées de potion de gel instantané _gèleront l'ennemi touché pendant 5 tours_.
items.arrowbag.desc_dragonsbreath=Les flèches imprégnées de potion du souffle du dragon _enflammeront l'ennemi touché_ et infligeront des _dégâts de feu supplémentaires_.
items.arrowbag.desc_corrosivegas=Les flèches imprégnées de potion de gaz corrosif infligeront _3 tours de Corrosion avec des dégâts initiaux de 2 (+10% des dégâts)_ à l'ennemi.
items.arrowbag.desc_stamina=Les flèches imprégnées de potion d'endurance _retireront tout l'épuisement_ du héros.
items.arrowbag.desc_shroudingfog=Les flèches imprégnées de potion de brouillard enveloppant infligeront _2 tours d'Invisibilité_ au personnage touché.
items.arrowbag.desc_stormclouds=Les flèches imprégnées de potion de nuages d'orage libéreront une _rafale d'eau pressurisée_.
items.arrowbag.desc_earthenarmor=Les flèches imprégnées de potion d'armure de terre accorderont au héros une _armure d'écorce égale à 50% des dégâts_, qui s'estompe à chaque tour.
items.arrowbag.desc_cleansing=Les flèches imprégnées de potion de purification infligeront _4 tours d'Immunité à la Magie_ au héros.
items.arrowbag.desc_divineinspiration=Les flèches imprégnées de potion d'inspiration divine donneront au héros les points d'expérience de l'ennemi touché.
#brews
items.arrowbag.desc_aqua=Les flèches imprégnées de brasserie aquatique _cracheront des nuages d'orage_ environ deux fois plus petits que la potion de nuages d'orage.
items.arrowbag.desc_blizzard=Les flèches imprégnées de brasserie de blizzard _cracheront un blizzard_ environ deux fois plus petit que la brasserie correspondante.
items.arrowbag.desc_caustic=Les flèches imprégnées de brasserie caustique _infligeront de la Vase Caustique dans une zone de 5x5_.
items.arrowbag.desc_infernal=Les flèches imprégnées de brasserie infernale _cracheront un enfer_ environ deux fois plus petit que la brasserie correspondante.
items.arrowbag.desc_shocking=Les flèches imprégnées de brasserie électrique infligeront _20%-60% de dégâts supplémentaires_ sous forme de dégâts électriques.
items.arrowbag.desc_unstable=Les flèches imprégnées de brasserie instable déclencheront un _effet d'imprégnation de potion aléatoire_.

