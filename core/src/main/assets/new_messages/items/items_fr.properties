items.weapon.melee.machete.name=machette d'aventurier
items.weapon.melee.machete.desc=Machette polyvalente portée par les explorateurs. Principalement utilisée pour couper l'herbe haute afin d'obtenir des cordes de vigne, elle peut aussi être maniée comme une arme puissante en cas de besoin.\n\nLa manier consomme un peu de faim.
