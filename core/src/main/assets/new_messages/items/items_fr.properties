items.sheath$dashattackcooldown.name=Récupération : Attaque en Charge
items.sheath$dashattackcooldown.desc=Plus de temps est nécessaire pour réutiliser cette capacité.\n\nTours restants : _%s_.
items.sheath$dashattackacceleration.name=Accélération de Charge
items.sheath$dashattackacceleration.desc=À chaque coup réussi de la Coupe Éclair, ton attaque gagne de l'élan, rendant la Coupe Éclair de plus en plus puissante !\nRater la Coupe Éclair réinitialise l'Accélération de Charge.\n\nDégâts actuels de la Coupe Éclair : _%s%%_.


