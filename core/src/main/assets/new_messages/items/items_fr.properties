items.active.teleporter.desc=*Ceci est destiné aux tests.*\n\nUn dispositif étrange qui te permet de monter et descendre les étages, ou d'invoquer des ennemis.
items.active.teleporter.getitem_title=Invoquer un Objet
items.active.teleporter.help_title=Aide
items.active.teleporter.help_desc=La syntaxe de création d'objet se compose de quatre lignes.\n\n_Ligne 1 :_ le _nom exact_ de l'objet cible. Par exemple, on entre « parchemin d'identification ».\n_- Ligne 2 :_ la _quantité_ de l'objet cible. Cette ligne peut aussi ne contenir que des chiffres, mais tout autre caractère que le texte par défaut posera problème. Si tu n'entres pas de quantité, ou si l'objet n'est pas empilable, elle sera fixée à _1_.\n_- Ligne 3 :_ la _valeur d'amélioration_ de l'objet cible. Cette ligne peut aussi ne contenir que des chiffres, mais tout autre caractère que le texte par défaut posera problème. Si tu n'entres pas de valeur d'amélioration, ou si l'objet ne peut pas être amélioré, elle sera fixée à _0_.\n_- Ligne 4 :_ _Identification_. Si tu veux un objet identifié, entre _true_ après le texte par défaut ou sans autre texte, sinon tout le reste sera traité comme non identifié.\n\n_Exemple :_\narmure de plaques\n0\n5\ntrue\n\nRésultat : tu obtiendras une armure de plaques identifiée +5.
items.active.teleporter.list_title=Objets pouvant être créés
items.active.teleporter.getitem_desc=Écris l'objet que tu veux !\nTape _help_ pour un guide sur comment l'écrire.\nTape _list_ pour voir une liste des objets pouvant être créés.
