### new items
items.gunsmithingtool.name=Outil d'armurier
items.gunsmithingtool.desc=Un ensemble d'outils permettant de modifier les armes à feu de diverses façons. L'utiliser une fois le fera disparaître, mais tu peux utiliser plusieurs outils d'armurier pour effectuer plusieurs modifications.
items.gunsmithingtool.inv_title=Choisis une arme à feu à modifier
items.gunsmithingtool.ac_use=Utiliser
items.gunsmithingtool.mod_select=Choisis quoi modifier sur l'arme à feu
items.gunsmithingtool.cancel=Annuler

items.gunsmithingtool.barrel=Modification du canon
items.gunsmithingtool$wndmod.normal_barrel=Retirer la modification du canon
items.gunsmithingtool$wndmod.short_barrel=Canon court
items.gunsmithingtool$wndmod.long_barrel=Canon long
items.gunsmithingtool.barrel_desc=La _Modification du canon_ ajuste la _précision des balles_ en changeant la longueur du canon.\n\n_Canon court :_\n- Précision à longue portée _x0.5_\n- Précision à courte portée _x1.5_\n\n_Canon long :_\n- Précision à longue portée _x1.25_\n- Précision à courte portée _x0.75_
items.gunsmithingtool.magazine=Modification du chargeur
items.gunsmithingtool$wndmod.normal_magazine=Retirer la modification du chargeur
items.gunsmithingtool$wndmod.large_magazine=Grand chargeur
items.gunsmithingtool$wndmod.quick_magazine=Chargeur rapide
items.gunsmithingtool.magazine_desc=La _Modification du chargeur_ ajuste les _munitions maximales_ et le _temps de rechargement_ en changeant la taille du chargeur.\n\n_Grand chargeur :_\n- Munitions maximales _x1.5_\n- Temps de rechargement _+1 tour_\n\n_Chargeur rapide :_\n- Munitions maximales _x0.5_\n- Temps de rechargement _-1 tour_
items.gunsmithingtool.bullet=Modification des munitions
items.gunsmithingtool$wndmod.normal_bullet=Retirer la modification des munitions
items.gunsmithingtool$wndmod.hp_bullet=Munitions à pointe creuse
items.gunsmithingtool$wndmod.ap_bullet=Munitions perforantes
items.gunsmithingtool.bullet_desc=La _Modification des munitions_ ajuste les _dégâts_ et la _pénétration de blindage_ des balles en changeant leur type.\n\n_Munitions à pointe creuse :_\n- Dégâts des balles _x1.3_\n- Pénétration de blindage _x2_\n\n_Munitions perforantes :_\n- Dégâts des balles _x0.8_\n- Pénétration de blindage _x0_
items.gunsmithingtool.weight=Modification du poids
items.gunsmithingtool$wndmod.normal_weight=Retirer la modification du poids
items.gunsmithingtool$wndmod.light_weight=Allégé
items.gunsmithingtool$wndmod.heavy_weight=Alourdi
items.gunsmithingtool.weight_desc=La _Modification du poids_ ajuste le _rang de l'arme_ en modifiant complètement ses performances.\n\n_Allégé : -1 rang_\n\n_Alourdi : +1 rang_
items.gunsmithingtool.attach=Modification d'accessoire
items.gunsmithingtool$wndmod.normal_attach=Retirer la modification d'accessoire
items.gunsmithingtool$wndmod.laser_attach=Viseur laser
items.gunsmithingtool$wndmod.flash_attach=Lampe torche
items.gunsmithingtool.attach_desc=La _Modification d'accessoire_ améliore les _effets spéciaux_ en attachant des dispositifs optiques à l'arme.\n\n_Viseur laser :_\n- Précision des balles _x1.25_\n- Chance de détection par les ennemis _+1 rang_\n\n_Lampe torche :_\n- Accorde un _bref aveuglement_ aux ennemis avec une probabilité de _50%-10%*(distance à la cible)_ lors d'une attaque réussie\n- Chance de détection par les ennemis _+2 rang_
items.gunsmithingtool.enchant=Modification magique
items.gunsmithingtool$wndmod.normal_enchant=Retirer la modification magique
items.gunsmithingtool$wndmod.amp_enchant=Amplification
items.gunsmithingtool$wndmod.sup_enchant=Suppression
items.gunsmithingtool.enchant_desc=La _Modification magique_ ajuste les _dégâts des balles_ et la _performance magique_ appliquée aux balles en changeant le mécanisme d'application magique de l'arme.\n\n_Amplification :_\n- Dégâts des balles _x0.75_\n- Performance magique _x2_\n\n_Suppression :_\n- Dégâts des balles _x1.25_\n- Performance magique _x0.5_

items.spellbook.spellbook.cooldown=Impossible d'utiliser le grimoire pour le moment.
items.spellbook.spellbook.ac_read=Lire
items.spellbook.spellbook$spellbookcooldown.name=Récupération : Grimoire
items.spellbook.spellbook$spellbookcooldown.desc=Tu as récemment utilisé le grimoire et as besoin de temps avant de pouvoir le réutiliser.\n\nTours restants : %s.
items.spellbook.spellbook$spellbookempower.name=Renforcement de mana
items.spellbook.spellbook$spellbookempower.desc=Tu déborde de mana grâce au grimoire récemment lu, augmentant les dégâts de tes attaques à la baguette magique de 20%.\n\nTours restants : %s.
items.spellbook.bookofmagic.name=Grimoire de Magie
items.spellbook.bookofmagic.desc=Un grimoire de magie débordant de pouvoir magique. Se concentrer pour lancer des sorts depuis ce grimoire rechargera rapidement la baguette magique que tu portes.
items.spellbook.bookofmagic.time=Si tu lances un sort maintenant, tu gagneras un effet de _rechargement_ pendant _%s_ tours.
items.spellbook.bookoffire.name=Grimoire de Feu
items.spellbook.bookoffire.desc=Un grimoire de chaleur et de feu. Quand tu te concentres pour lancer des sorts depuis ce grimoire, tu peux être imprégné du pouvoir du feu pendant un court moment.
items.spellbook.bookoffire.time=Si tu lances un sort maintenant, tu gagneras _%s_ tours d'effet d'_imprégnation de feu_.
items.spellbook.bookoffrost.name=Grimoire de Givre
items.spellbook.bookoffrost.desc=Un grimoire de froid glacial. Quand tu te concentres pour lancer des sorts, tu peux être imprégné du pouvoir du givre pendant un court moment.
items.spellbook.bookoffrost.time=Si tu lances un sort maintenant, tu gagneras _%s_ tours d'effet d'_imprégnation de froid_.
items.spellbook.bookofthunderbolt.name=Grimoire de Foudre
items.spellbook.bookofthunderbolt.desc=Un grimoire crépitant d'électricité. Quand tu te concentres pour lancer des sorts, tu peux être imprégné du pouvoir de la foudre pendant un court moment.
items.spellbook.bookofthunderbolt.time=Si tu lances un sort maintenant, tu gagneras _%s_ tours d'effet d'_imprégnation de foudre_.
items.spellbook.bookofdisintegration.name=Grimoire de Désintégration
items.spellbook.bookofdisintegration.desc=Un grimoire léger contenant le pouvoir de distorsion spatiale. Se concentrer pour lancer des sorts depuis ce grimoire te permet d'attaquer des ennemis éloignés.
items.spellbook.bookofdisintegration.time=Si tu lances un sort maintenant, tu gagneras un effet de _distorsion spatiale_ pendant _%1$s_ tours, te permettant d'attaquer des ennemis jusqu'à _+%2$s_ cases plus loin avec ton arme.
items.spellbook.bookofdisintegration$reachbuff.name=Distorsion Spatiale
items.spellbook.bookofdisintegration$reachbuff.desc=Tu as gagné le pouvoir de distordre l'espace, te permettant d'attaquer des ennemis distants comme s'ils étaient juste devant toi !\n\nTours restants : %s.
items.spellbook.bookoflight.name=Grimoire de Radiance
items.spellbook.bookoflight.desc=Un grimoire translucide contenant le pouvoir de la lumière. Se concentrer pour lancer des sorts depuis ce grimoire illuminera les environs pendant longtemps et aveuglera temporairement toutes les cibles à portée de vue.
items.spellbook.bookoflight.time=Si tu lances un sort maintenant, tu gagneras un effet de _radiance_ pendant _%1$s_ tours et infligeras un _aveuglement_ de _%2$s_ tours à toutes les cibles à portée de vue.
items.spellbook.bookofcorrosion.name=Grimoire de Corrosion
items.spellbook.bookofcorrosion.desc=Un grimoire dangereux contenant le pouvoir de la corrosion. Se concentrer pour lancer des sorts depuis ce grimoire créera une quantité importante de nuages de gaz corrosif à l'endroit actuel. Mieux vaut s'éloigner rapidement.
items.spellbook.bookofcorrosion.time=Si tu lances un sort maintenant, tu généreras des nuages de gaz corrosif à partir de _%s_ dégâts.
items.spellbook.bookofcorrosion.warning=Des nuages de gaz corrosif commencent à se répandre autour de toi. Tu devrais t'éloigner rapidement !
items.spellbook.bookofearth.name=Grimoire de Terre
items.spellbook.bookofearth.desc=Un grimoire contenant le pouvoir de la terre. Se concentrer pour lancer des sorts depuis ce grimoire te fournira immédiatement une quantité importante d'armure naturelle et d'écorce protectrice.
items.spellbook.bookofearth.time=Si tu lances un sort maintenant, tu gagneras _%1$s_ d'armure naturelle et _%2$s_ d'écorce protectrice, qui diminue de 1 chaque tour.
items.spellbook.bookofblast.name=Grimoire de l'Onde de Choc
items.spellbook.bookofblast.desc=Un grimoire contenant le pouvoir de la magie de choc. Se concentrer pour lancer des sorts depuis ce grimoire repoussera tous les ennemis autour de toi.
items.spellbook.bookofblast.time=Si tu lances un sort maintenant, tu repousseras tous les ennemis dans une zone de 3x3 autour de toi de _%s_ cases.
items.spellbook.bookofcorruption.name=Grimoire de Corruption
items.spellbook.bookofcorruption.desc=Un grimoire contenant le pouvoir de contrôler les esprits. Se concentrer pour lancer des sorts depuis ce grimoire corrompra les ennemis affaiblis dans la zone 3x3 environnante.
items.spellbook.bookofcorruption.time=Si tu lances un sort maintenant, tu corromptras définitivement les ennemis ayant _%s%%_ de vie ou moins dans la zone 3x3 environnante.
items.spellbook.bookofwarding.name=Grimoire de Protection
items.spellbook.bookofwarding.desc=Un grimoire contenant le pouvoir de protection. Se concentrer pour lancer des sorts depuis ce grimoire créera des images miroir autour de toi pour combattre à tes côtés.
items.spellbook.bookofwarding.too_many_images=Il y avait trop d'autres images miroir sur l'étage actuel pour te distraire, alors rien ne s'est passé.
items.spellbook.bookofwarding.time=Si tu lances un sort maintenant, tu créeras jusqu'à _%s_ images miroir.
items.spellbook.bookofwarding.appear=Alors que tu te concentres, des images miroir apparaissent soudainement autour de toi.
items.spellbook.bookofregrowth.name=Grimoire de Repousse
items.spellbook.bookofregrowth.desc=Un grimoire contenant le pouvoir de la nature. Se concentrer pour lancer des sorts depuis ce grimoire fera pousser une grande quantité d'herbe et de végétation aléatoire autour de toi.
items.spellbook.bookofregrowth.time=Si tu lances un sort maintenant, tu couvriras un pourcentage de la zone d'herbe haute et de végétation aléatoire, avec un rayon de _%1$s_ cases et _%2$s%%_ de chance de planter.
items.spellbook.bookofregrowth.plant=Alors que tu te concentres, des plantes poussent soudainement autour de toi.
items.spellbook.bookoftransfusion.name=Grimoire de Transfusion
items.spellbook.bookoftransfusion.desc=Un grimoire contenant le pouvoir de transfert de vie. Se concentrer pour lancer des sorts depuis ce grimoire accordera une marque vampirique à tous les ennemis dans un rayon donné, te permettant de récupérer une partie des dégâts infligés en attaquant les ennemis marqués.
items.spellbook.bookoftransfusion.time=Si tu lances un sort maintenant, tu accorderas une _marque vampirique_ à tous les ennemis dans une zone circulaire d'un rayon de _%1$s_ cases pendant _%2$s_ tours, et récupéreras _%3$s%%_ des dégâts infligés en attaquant les ennemis marqués.
items.spellbook.bookoftransfusion$vampiricmark.name=Marque Vampirique
items.spellbook.bookoftransfusion$vampiricmark.desc=Cette cible porte une marque vampirique. Tant que la marque vampirique persiste, une partie de l'énergie vitale perdue par la cible sera transférée à l'attaquant lorsque la cible subit des dégâts physiques.\n\nTours restants : %s.

items.rings.ringofaccuracy.special_effect=Le porteur de l'Anneau de Précision peut délivrer des attaques à mains nues plus puissantes aux ennemis, avec une chance et des dégâts proportionnels à sa précision actuelle. Un coup puissant peut infliger jusqu'à deux fois plus de dégâts et occasionnellement étourdir ou déstabiliser l'adversaire.
items.rings.ringofarcana.special_effect=Le porteur de l'Anneau d'Arcane déclenche des effets magiques aléatoires avec ses attaques à mains nues. La puissance de la magie dépend du niveau de l'anneau et du niveau du héros.
items.rings.ringofelements.special_effect=Le porteur de l'Anneau des Éléments retire occasionnellement tous les effets néfastes en portant une attaque à mains nues. La faim n'est pas soulagée.
items.rings.ringofenergy.special_effect=Le porteur de l'Anneau d'Énergie gagne occasionnellement un effet de charge d'artefact de 0.5 tour en portant une attaque à mains nues.
items.rings.ringofevasion.special_effect=Le porteur de l'Anneau d'Esquive gagne une chance d'effectuer une brève manœuvre d'esquive en portant une attaque à mains nues, proportionnellement à son taux d'esquive actuel.
items.rings.ringofforce.special_effect=Le porteur de l'Anneau de Force inflige occasionnellement l'un des effets suivants en portant une attaque à mains nues : étourdissement, déstabilisation, embrasement, étourdissement mental, affaiblissement.
items.rings.ringoffuror.special_effect=Le porteur de l'Anneau de Furie ne consomme occasionnellement pas de tour en portant une attaque à mains nues.
items.rings.ringofhaste.special_effect=Le porteur de l'Anneau de Hâte gagne occasionnellement un court regain de vitesse en portant une attaque à mains nues.
items.rings.ringofmight.special_effect=Le porteur de l'Anneau de Puissance augmente les dégâts de ses attaques à mains nues en fonction de sa force.
items.rings.ringofsharpshooting.special_effect=Le porteur de l'Anneau de Tir d'Élite récupère occasionnellement une arme de jet plantée dans un ennemi et répare sa durabilité de 1 en portant une attaque à mains nues.
items.rings.ringoftenacity.special_effect=Le porteur de l'Anneau de Ténacité ne peut pas mourir lors des tours où une attaque à mains nues touche avec succès.
items.rings.ringofwealth.special_effect=Le porteur de l'Anneau de Richesse fait occasionnellement tomber un butin commun supplémentaire en portant une attaque à mains nues. Cette chance est influencée par les effets d'augmentation du taux de butin.

items.changer.oldamulet.name=Vieille Amulette
items.changer.oldamulet.ac_use=Utiliser
items.changer.oldamulet.desc=Une amulette ancienne découverte au bout d'une ruine. Cet objet semble extrêmement vieux, peut-être même vieux de plusieurs siècles, et semble fragile au toucher, mais conserve pourtant une faible trace de pouvoir.\n\nUtiliser cette vieille amulette sur un objet spécial du héros le transformera en un nouvel objet aux capacités plus puissantes.
items.changer.oldamulet.inv_title=Choisis l'objet à transformer
items.changer.oldamulet.nothing=Rien ne semble avoir changé.
items.changer.oldamulet.morph=Ton objet s'est transformé sous une nouvelle forme !
items.changer.oldamulet.cannot_use=_La malédiction actuelle du temple empêche d'utiliser l'amulette, mais elle semble utilisable une fois sorti du temple._
items.changer.oldamulet$templecurse.escape=Alors que tu t'échappes du temple, l'entrée s'effondre derrière toi.
items.changer.oldamulet.boss_kill=Un grondement lointain suggère que quelque chose s'est effondré dans les étages supérieurs à cause de l'explosion récente...

items.changer.blueprint.name=plan magique
items.changer.blueprint.ac_use=utiliser
items.changer.blueprint.desc=Un plan mystique créé par l'alchimie et le pouvoir de la magie, contenant des informations sur une nouvelle arme. Utiliser le plan magique sur une arme de mêlée a une chance de transmuter cette arme en une nouvelle.\n\nLe niveau d'amélioration et l'enchantement de l'arme obtenue seront conservés, les modifications d'arme à feu seront conservées si le résultat est une arme à feu.
items.changer.blueprint.item_desc=Actuellement, ce plan contient des informations sur une arme de _rang %1$s_ : _%2$s_. Un exemple de probabilité de réussite pour chaque rang d'arme est le suivant :\n\nRang 1 : _%3$s%%_.\nRang 2 : _%4$s%%_.\nRang 3 : _%5$s%%_.\nRang 4 : _%6$s%%_.\nRang 5 : _%7$s%%_.\n\nTu peux augmenter la chance de _+10%%_ à chaque fois que tu améliores directement le plan.
items.changer.blueprint.inv_title=Choisis l'objet à appliquer
items.changer.blueprint.nothing=Rien ne semble avoir changé.
items.changer.blueprint.morph=L'arme et le plan se sont mis à scintiller, se transformant en une nouvelle forme !

