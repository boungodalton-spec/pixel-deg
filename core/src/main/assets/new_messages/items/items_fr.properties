items.weapon.melee.gun.gun.ability_name=Rechargement Rapide
items.weapon.melee.gun.gun.ability_desc=Les combattants équipés d'armes à feu peuvent utiliser le _Rechargement Rapide_. Cette capacité recharge instantanément l'arme équipée sans consommer de tour ni de munitions. Utilisée alors que l'arme est déjà à sa capacité maximale, elle recharge jusqu'au double de la capacité maximale. Cette capacité consomme 2 charges.
items.weapon.melee.gun.gun.overloaded=Un chargeur supplémentaire est déjà chargé.
items.weapon.melee.gun.gun.not_equipped=Tu dois équiper une arme à feu pour l'utiliser.
items.weapon.melee.gun.gun.already_loaded=Toutes les munitions sont déjà chargées.
items.weapon.melee.gun.gun.reload=Tu as rechargé l'arme à feu.
items.weapon.melee.gun.gun.less_bullet=Munitions insuffisantes pour recharger.
items.weapon.melee.gun.gun.gun_desc=Cette arme à feu tire _%1$s_ munition(s) par tir, chacune infligeant _%2$s_-_%3$s_ dégâts. Actuellement, _%4$s_/_%5$s_ munitions sont chargées. Le rechargement est possible après avoir utilisé _%6$s_ charges et consommé _%7$s_ munitions.
items.weapon.melee.gun.gun.gun_typical_desc=Cette arme à feu tire _%1$s_ munition(s) par tir, infligeant typiquement _%2$s_-_%3$s_ dégâts. Actuellement, _%4$s_/_%5$s_ munitions sont chargées. Le rechargement est possible après avoir utilisé _%6$s_ charges et consommé _%7$s_ munitions.
