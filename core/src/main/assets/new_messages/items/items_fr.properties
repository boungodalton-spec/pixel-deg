items.spells.electricityimbue.name=imprégnation d'électricité
items.spells.electricityimbue.desc=Ce puissant sort assimile temporairement celui qui le lance à l'électricité, le rendant immunisé à l'électricité et à la paralysie et lui permettant d'utiliser des attaques physiques pour endommager les ennemis proches avec de la foudre en chaîne.
items.spells.electricityimbue.imbue=Tu as été imprégné d'électricité !
items.spells.electricityimbue$electricityimbuebuff.name=imprégné d'électricité
items.spells.electricityimbue$electricityimbuebuff.desc=Tu ne fais plus qu'un avec le pouvoir de l'électricité !\n\nToutes tes attaques physiques infligent des dégâts de foudre en chaîne aux ennemis proches. Tu es aussi immunisé à l'électricité et à la paralysie.\n\nL'effet d'imprégnation d'électricité dure %s tours.

