items.weapon.missiles.alchemy.cross.name=Croix
items.weapon.missiles.alchemy.cross.desc=Cette croix ne semble pas conçue pour être lancée, mais elle peut infliger des dégâts importants aux ennemis quand elle est lancée. Après quelques tours, la croix reviendra à sa position d'origine. Les démons et morts-vivants sont brûlés par le pouvoir sacré de la croix, subissant des dégâts supplémentaires.

items.weapon.enchantments.venomous.name=%s venimeux
items.weapon.enchantments.venomous.desc=Cet enchantement applique un poison cumulable à l'ennemi attaqué.
items.weapon.enchantments.venomous.elestrike_desc=Les frappes élémentaires avec l'enchantement venimeux appliquent un poison égal à 30% de la vie restante à tous les ennemis à portée.

items.weapon.enchantments.eldritch.name=%s occulte
items.weapon.enchantments.eldritch.desc=Cet enchantement instille la peur chez l'ennemi attaqué, le poussant à fuir.
items.weapon.enchantments.eldritch.elestrike_desc=Les frappes élémentaires avec l'enchantement occulte infligent 10 tours de peur à tous les ennemis à portée.

items.weapon.enchantments.stunning.name=%s étourdissant
items.weapon.enchantments.stunning.desc=Ce puissant enchantement étourdit occasionnellement brièvement l'ennemi. Plus l'ennemi est en bonne santé, plus la chance d'étourdissement est élevée.
items.weapon.enchantments.stunning.elestrike_desc=Les frappes élémentaires avec l'enchantement étourdissant infligent 6 tours de paralysie à tous les ennemis à portée.

items.weapon.enchantments.vorpal.name=%s tranchant
items.weapon.enchantments.vorpal.desc=Ce puissant enchantement applique un effet de saignement basé sur une partie des dégâts infligés à l'ennemi attaqué.
items.weapon.enchantments.vorpal.elestrike_desc=Les frappes élémentaires avec l'enchantement tranchant infligent un saignement égal à 20% de la vie restante à tous les ennemis à portée.

items.armor.glyphs.satisfying.name=%s satisfaisant
items.armor.glyphs.satisfying.desc=Ce puissant glyphe a une chance de restaurer la faim du porteur lorsqu'il est attaqué.

items.armor.glyphs.mirrorimage.name=%s d'image miroir
items.armor.glyphs.mirrorimage.desc=Ce glyphe a une chance d'invoquer une image miroir alliée quand le porteur est attaqué.

items.armor.glyphs.afterimage.name=%s de rémanence
items.armor.glyphs.afterimage.desc=Ce glyphe réduit significativement la défense de l'armure mais augmente grandement l'esquive du porteur.


