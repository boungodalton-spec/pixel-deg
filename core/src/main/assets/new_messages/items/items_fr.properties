items.spells.unstableidentification.inv_title=Choisis l'objet pour identifier la malédiction
items.spells.unstableidentification.desc=Ce sort est similaire au Parchemin d'Identification, mais plus faible, et une fois lancé, il identifie si un équipement est maudit ou non.
items.spells.unstableidentification.cursed=Le sort a examiné ton équipement et a découvert qu'il est maudit.
items.spells.unstableidentification.uncursed=Le sort a examiné ton équipement et a découvert qu'il n'est pas maudit.

###v3.8.0
items.trinkets.magicalcompass.name=Boussole Magique
items.trinkets.magicalcompass.desc=Cette boussole semble attirée vers la sortie de ce donjon, contrairement à une boussole normale. Ce bibelot révèle occasionnellement le chemin vers la sortie quand tu descends à un nouvel étage.
items.trinkets.magicalcompass.stats_desc=Au niveau actuel, ce bibelot révèle le chemin vers la sortie avec une chance de _%d%%_ en entrant pour la première fois sur un étage.\n\nCe bibelot consomme une petite quantité d'énergie pour s'améliorer.
items.trinkets.magicalcompass.typical_stats_desc=Typiquement ce bibelot révèle le chemin vers la sortie avec une chance de _%d%%_ en entrant pour la première fois sur un étage.\n\nCe bibelot consomme une petite quantité d'énergie pour s'améliorer.
items.trinkets.magicalcompass.cant_find=La boussole n'a pas pu trouver de chemin.

items.trinkets.crystalball.name=Mystérieuse Boule de Cristal
items.trinkets.crystalball.desc=Cette boule de cristal brillante prédit les événements que tu affronteras dans un futur proche. Ce bibelot révèle occasionnellement les emplacements de tous les objets d'un étage quand tu descends, et rarement, il révèle tous les secrets de l'étage entier.
items.trinkets.crystalball.stats_desc=Au niveau actuel, ce bibelot révèle les emplacements des objets de l'étage avec une chance de _%1$s%%_ et révèle la disposition, y compris tous les secrets, avec une chance de _%2$s%%_ en entrant pour la première fois sur un étage.\n\nCe bibelot consomme une quantité modérée d'énergie pour s'améliorer.
items.trinkets.crystalball.typical_stats_desc=Typiquement ce bibelot révèle les emplacements des objets de l'étage avec une chance de _%1$s%%_ et révèle la disposition, y compris tous les secrets, avec une chance de _%2$s%%_ en entrant pour la première fois sur un étage.\n\nCe bibelot consomme une quantité modérée d'énergie pour s'améliorer.

items.trinkets.brokenmagnifyingglass.name=Loupe Brisée
items.trinkets.brokenmagnifyingglass.desc=Cette loupe est déjà brisée, rendant difficile de voir quoi que ce soit directement à travers, mais elle affecte étrangement ton intuition. Ce bibelot augmente tes chances de trouver des portes cachées en te déplaçant, mais réduit tes chances de repérer des pièges cachés.
items.trinkets.brokenmagnifyingglass.stats_desc=Au niveau actuel, ce bibelot te permet de découvrir des portes cachées sans chercher avec une chance de _%1$d%%_ et de repérer des pièges cachés avec une chance de _%2$d%%_.
items.trinkets.brokenmagnifyingglass.typical_stats_desc=Typiquement ce bibelot te permet de découvrir des portes cachées sans chercher avec une chance de _%1$d%%_ et de repérer des pièges cachés avec une chance de _%2$d%%_.

items.trinkets.suspiciouskey.name=Clé Suspecte
items.trinkets.suspiciouskey.desc=Cette clé ne rentre dans aucune serrure du donjon et est à peine visible. Ce bibelot crée des salles secrètes supplémentaires à chaque étage que tu visites mais rend les portes invisibles.
items.trinkets.suspiciouskey.stats_desc=Au niveau actuel, ce bibelot crée _%1$s_ salle(s) secrète(s) supplémentaire(s) par étage et transforme les portes et barricades normales, même celles révélées, en portes cachées avec une chance de _%2$d%%_.
items.trinkets.suspiciouskey.typical_stats_desc=Typiquement ce bibelot crée _%1$s_ salle(s) secrète(s) supplémentaire(s) par étage et transforme les portes et barricades normales, même celles révélées, en portes cachées avec une chance de _%2$d%%_.

items.trinkets.pinkgem.name=Gemme Rose
items.trinkets.pinkgem.desc=Cette gemme rose scintillante et magnifiquement travaillée semble détourner ta chance tout en t'en offrant une nouvelle sorte en retour. Ce bibelot fait tomber des récompenses supplémentaires des ennemis vaincus mais réduit la chance qu'ils laissent tomber leurs objets habituels.\n\nPour que la gemme utilise son pouvoir, tu dois la garder dans ton sac pendant un moment.
items.trinkets.pinkgem$preventdropbuff.name=récupération de la gemme rose
items.trinkets.pinkgem$preventdropbuff.desc=Tu as récemment ramassé la gemme rose, tu dois donc attendre qu'elle regagne son pouvoir.\n\nTant que cette récupération existe, la gemme ne fera pas tomber d'objets supplémentaires.\n\nTours restants : _%s_.
items.trinkets.pinkgem.stats_desc=Au niveau actuel, ce bibelot fait tomber des consommables supplémentaires des ennemis, comme si tu avais équipé un _Anneau de Richesse +%2$d_, avec une chance de _%1$d%%_ mais réduit le taux de butin de l'ennemi de _%3$s fois_.\n\nCe bibelot consomme une grande quantité d'énergie pour s'améliorer.
items.trinkets.pinkgem.typical_stats_desc=Typiquement ce bibelot fait tomber des consommables supplémentaires des ennemis, comme si tu avais équipé un _Anneau de Richesse +%2$d_, avec une chance de _%1$d%%_ mais réduit le taux de butin de l'ennemi de _%3$s fois_.\n\nCe bibelot consomme une grande quantité d'énergie pour s'améliorer.

items.trinkets.necklace.name=Collier de Gemmes
items.trinkets.necklace.desc_ring=Ce collier est incrusté de gemmes scintillantes, en tirant continuellement du pouvoir. Ce bibelot fournit les effets d'un anneau qui y est serti.
items.trinkets.necklace.desc=Ce collier a une monture parfaitement adaptée à la gemme d'un anneau, te permettant d'y sertir un anneau.
items.trinkets.necklace.stats_desc=Si tu sertis un anneau dans le collier, tu gagneras ses effets depuis le bibelot.
items.trinkets.necklace.stats_desc_ring=Au niveau actuel, ce bibelot accorde au héros les effets de _+%1$d %2$s_. %3$s Ce bibelot consomme une grande quantité d'énergie pour s'améliorer.
items.trinkets.necklace.typical_stats_desc_ring=Typiquement ce bibelot accorde au héros les effets de _+%1$d %2$s_. %3$s Ce bibelot consomme une grande quantité d'énergie pour s'améliorer.
items.trinkets.necklace.ac_insert=INSÉRER
items.trinkets.necklace.inv_title=Choisis un anneau à insérer dans le collier
items.trinkets.necklace.insert_desc=Souhaites-tu insérer la gemme de _%s_ dans le collier ? L'anneau disparaîtra, et l'effet sera déterminé uniquement par le niveau d'amélioration du collier, indépendamment du niveau d'amélioration de l'anneau.
items.trinkets.necklace.insert_ok=Oui
items.trinkets.necklace.insert_cancel=Non



###v3.11.0
items.weapon.melee.saber.name=sabre
items.weapon.melee.saber.stats_desc=Cette arme peut bloquer _0-1_ dégâts.
items.weapon.melee.saber.ability_name=fente
items.weapon.melee.saber.typical_ability_desc=Le Duelliste peut effectuer une _fente_ avec un sabre sur un ennemi à 1 case de distance. Cela te déplace vers l'ennemi, inflige typiquement _%1$d-%2$d dégâts_, et touche toujours.
items.weapon.melee.saber.ability_desc=Le Duelliste peut effectuer une _fente_ avec un sabre sur un ennemi à 1 case de distance. Cela te déplace vers l'ennemi, inflige _%1$d-%2$d dégâts_, et touche toujours.
items.weapon.melee.saber.desc=Symbole d'un chevalier d'escorte royale, ce sabre peut bloquer certaines attaques ennemies pour te protéger.

items.knightsshield.name=bouclier du chevalier
items.knightsshield.desc=Un magnifique bouclier de métal décerné aux chevaliers par la cour royale. Comme une armure, il peut être enchanté de glyphes, et quand le héros est attaqué, les glyphes du bouclier peuvent aussi se déclencher. Le chevalier porte ce bouclier en permanence et en tire une défense constante.
items.knightsshield.stats_desc=Le bouclier devient progressivement plus fort avec le niveau du chevalier. À ton niveau actuel, le bouclier du chevalier fournit _0-%1$d_ défense.

items.weapon.melee.deathsword.name=épée de la mort
items.weapon.melee.deathsword.desc=Une épée inquiétante imprégnée de l'aura de la mort. Chaque fois que le Chevalier de la Mort la manie et tue un ennemi, il absorbe l'âme de l'ennemi et gagne une petite quantité de vie maximale. L'effet d'augmentation de vie maximale se réinitialise quand le héros meurt complètement.
items.weapon.melee.deathsword.desc_hero=Une épée inquiétante imprégnée de l'aura de la mort. Chaque fois que le Chevalier de la Mort la manie et tue un ennemi, il absorbe l'âme de l'ennemi et gagne une petite quantité de vie maximale. L'effet d'augmentation de vie maximale se réinitialise quand le héros meurt complètement.\n\nGain de vie maximale actuel : _%1$d/%2$d_.

items.saddle.name=selle du chevalier
items.saddle.desc=Une magnifique selle bordée d'or, cette selle est liée par un lien fort à ton cheval spirituel et restaurera la vie de ton cheval de _%d_ pour chaque ennemi tué.

items.rosary.name=chapelet du croisé
items.rosary.desc=Un collier avec un petit symbole en forme de croix imprégné de pouvoir divin. Quand le Croisé prie en portant cet objet, il gagne 2 tours supplémentaires de bénédiction et gagne aussi _%d_ boucliers cumulables.

###v3.14.0
items.pills.pill.ac_use=PRENDRE
items.pills.pill$placeholder.name=pilule
items.pills.pill.harmful=Pilule nocive !
items.pills.pill.yes=Oui, je sais ce que je fais
items.pills.pill.no=Non, j'ai changé d'avis
items.pills.pill.sure_take=Es-tu sûr de vouloir la prendre ? Dans la plupart des cas, elle n'a que des effets néfastes.
items.pills.pillofinvisibility.name=pilule d'invisibilité
items.pills.pillofinvisibility.desc=Une pilule fabriquée en raffinant la potion d'invisibilité. Prise, elle rendra celui qui la prend invisible pendant un moment.
items.pills.pillofinvisibility.enemy_desc=Si tu utilises la pilule d'invisibilité sur une autre cible, ses faiblesses deviendront invisibles à la place, _la rendant vulnérable aux attaques_.
items.pills.pillofantibiotics.name=pilule d'antibiotiques
items.pills.pillofantibiotics.desc=Une pilule fabriquée en raffinant la potion de pureté. Prise, elle retirera immédiatement tous les effets négatifs de celui qui la prend, sauf la faim. La faim ne sera pas restaurée.
items.pills.pillofparalysis.name=pilule de paralysie
items.pills.pillofparalysis.desc=Une pilule fabriquée en raffinant la potion de gaz paralysant. Prise, elle paralysera celui qui la prend et l'empêchera de bouger pendant un court moment.
items.pills.pillofmindfocus.name=pilule de concentration mentale
items.pills.pillofmindfocus.desc=Une pilule fabriquée en raffinant la potion de vision de l'esprit. Prise, elle permettra à celui qui la prend de voir l'esprit des autres créatures.
items.pills.pillofmindfocus.enemy_desc=Si tu utilises la pilule de concentration mentale sur une autre cible, elle _aveuglera la cible pendant un court moment_ à la place.
items.pills.pillofflame.name=pilule de flamme
items.pills.pillofflame.desc=Une pilule fabriquée en raffinant la potion de flamme liquide. Prise, elle provoquera un feu à l'emplacement de celui qui la prend.
items.pills.pilloffrost.name=pilule de givre
items.pills.pilloffrost.desc=Une pilule fabriquée en raffinant la potion de givre. Prise, elle créera un nuage de givre à l'emplacement de celui qui la prend.
items.pills.pillofawakening.name=pilule d'éveil
items.pills.pillofawakening.desc=Une pilule puissante fabriquée en raffinant la potion de force. Prise, le pouvoir de la pilule amplifie momentanément la force de celui qui la prend, lui permettant d'avoir une force immense pendant longtemps.
items.pills.pillofawakening.enemy_desc=Si tu utilises la pilule d'éveil sur une autre cible, l'action musculaire puissante _affaiblira grandement la cible_.
items.pills.pilloftoxin.name=pilule de toxine
items.pills.pilloftoxin.desc=Une pilule fabriquée en raffinant la potion de gaz toxique. Prise, elle t'empoisonnera pendant un moment.
items.pills.pillofvitamin.name=pilule de vitamine
items.pills.pillofvitamin.desc=Une pilule puissante fabriquée en raffinant la potion d'expérience. Prise, elle retirera immédiatement tous les effets négatifs de celui qui la prend, sauf la faim, et le rendra immunisé aux effets néfastes pendant longtemps.
items.pills.pilloflevitation.name=pilule de lévitation
items.pills.pilloflevitation.desc=Une pilule fabriquée en raffinant la potion de lévitation. Prise, elle fera léviter celui qui la prend pendant un court moment.
items.pills.pilloflevitation.enemy_desc=Si tu utilises la pilule de lévitation sur une autre cible, elle affectera la cible d'un vertige pendant un court moment.
items.pills.pillofhealing.name=pilule de guérison
items.pills.pillofhealing.desc=Une pilule fabriquée en raffinant la potion de guérison. Prise, celui qui la prend récupérera continuellement une partie de sa vie.
items.pills.pillofacceleration.name=pilule d'accélération
items.pills.pillofacceleration.desc=Une pilule fabriquée en raffinant la potion de hâte. Prise, le pouvoir de vitesse raffinée enveloppe celui qui la prend, lui permettant d'agir sans consommer de tour pendant un court moment.

###v3.17.0
items.weapon.melee.scalpel.name=scalpel
items.weapon.melee.scalpel.stats_desc=Cette arme fait saigner l'ennemi.
items.weapon.melee.scalpel.ability_name=récolte
items.weapon.melee.scalpel.typical_ability_desc=Le Duelliste peut _récolter_ un ennemi avec un scalpel. Cette attaque dévastatrice touche toujours et inflige typiquement _%d dégâts._ Ces dégâts sont appliqués comme saignement si la cible n'y est pas immunisée.
items.weapon.melee.scalpel.ability_desc=Le Duelliste peut _récolter_ un ennemi avec un scalpel. Cette attaque dévastatrice touche toujours et inflige _%d dégâts._ Ces dégâts sont appliqués comme saignement si la cible n'y est pas immunisée.
items.weapon.melee.scalpel.desc=Un outil chirurgical court mais tranchant, difficile à utiliser pour infliger des dégâts directs mais qui semble efficace pour blesser les ennemis.

items.gammaraygun.name=pistolet à rayons gamma
items.gammaraygun.desc=Il s'agit d'un dispositif médical porté par le médecin. Il est habituellement utilisé à des fins médicales en émettant une faible quantité de radiation à basse puissance, mais il peut tirer un puissant rayon radioactif contre un ennemi. _Si utilisé trop souvent en peu de temps, tu peux être blessé par l'exposition aux radiations_, alors sois prudent.
items.gammaraygun.cannot_self=Tu ne peux pas l'utiliser sur toi-même.
items.gammaraygun.ac_use=TIRER
items.gammaraygun.warning_high=Si tu utilises un pistolet à rayons gamma maintenant, il y a une _très forte probabilité que ce soit dangereux_ pour toi. Sois prudent.
items.gammaraygun.warning_low=Si tu utilises un pistolet à rayons gamma maintenant, il y a une _probabilité que ce soit dangereux_ pour toi.
items.gammaraygun.warning_none=Il _ne serait pas du tout dangereux_ d'utiliser un pistolet à rayons gamma maintenant.

items.artifacts.medickit.name=kit de premiers secours
items.artifacts.medickit.desc=Un kit de premiers secours porté par le médecin pour les soins d'urgence. Chaque fois que le héros guérit naturellement, il gagne de l'énergie.\n\nLe kit de premiers secours peut être amélioré par une _potion de force_ ou des _objets alchimiques faits à partir de la potion de force_. Chaque fois qu'il est amélioré, le Médecin gagne une immunité à un _certain affaiblissement_.\n\nQuand il est utilisé, il soigne rapidement le héros, en utilisant toutes ses charges.
items.artifacts.medickit.use_desc=Si tu l'utilises maintenant, tu peux soigner un total de _%d_ PV.
items.artifacts.medickit.upgrade=Le kit de premiers secours devient plus puissant, t'accordant une immunité à un nouvel affaiblissement !
items.artifacts.medickit.desc_cursed=Cet artefact est maudit, il te fera saigner périodiquement.
items.artifacts.medickit.desc_equipped=En équipant cet artefact, tu es immunisé à _%s_.
items.artifacts.medickit.ac_use=UTILISER
items.artifacts.medickit.ac_add=AJOUTER
items.artifacts.medickit.inv_title=Choisis le Médicament à Ajouter au Kit de Premiers Secours
items.artifacts.medickit.no_charge=Il n'y a plus de charge dans le kit.

###v3.22.0
items.weapon.bow.phasebow.name=Arc de Phase
items.weapon.bow.phasebow.stats=Cet arc ne peut pas être amélioré directement, mais devient plus fort à mesure que tu montes de niveau. À ton niveau actuel, les flèches tirées de l'Arc de Phase infligent _%1$d-%2$d_ dégâts et nécessitent _%3$d_ de force pour être utilisées correctement.
items.weapon.bow.phasebow.desc=Un arc imprégné du pouvoir de distordre l'espace. L'avant de l'arc est fortement déformé, permettant aux flèches tirées à courte portée d'être transportées instantanément à l'endroit voulu.

items.weapon.bow.electricbow.name=Arc Foudroyant
items.weapon.bow.electricbow.stats=Cet arc ne peut pas être amélioré directement, mais devient plus fort à mesure que tu montes de niveau. À ton niveau actuel, les flèches tirées de l'Arc Foudroyant infligent _%1$d-%2$d_ dégâts et nécessitent _%3$d_ de force pour être utilisées correctement.
items.weapon.bow.electricbow.desc=Un arc imprégné du pouvoir de la foudre. Cet arc brillant, à la lueur jaune, peut invoquer un éclair sur la cible à l'impact, infligeant des dégâts supplémentaires qui ignorent la défense.

items.weapon.bow.magicalbow.name=Arc Magique
items.weapon.bow.magicalbow.stats=Cet arc ne peut pas être amélioré directement, mais devient plus fort à mesure que tu montes de niveau. À ton niveau actuel, les flèches tirées de l'Arc Magique infligent _%1$d-%2$d_ dégâts et nécessitent _%3$d_ de force pour être utilisées correctement.
items.weapon.bow.magicalbow.desc=Un arc débordant d'énergie magique. Son aura violette scintillante amplifie tout enchantement qui lui est appliqué, et en l'absence d'enchantement, il augmente légèrement ses dégâts de base.
items.weapon.bow.magicalbow.enchant=La magie de l'Arc Magique amplifie tout enchantement qui lui est appliqué, réduisant les dégâts de base de l'arc mais augmentant l'efficacité de l'enchantement de _+%s%%_.
items.weapon.bow.magicalbow.no_enchant=Aucun enchantement n'est actuellement appliqué à l'Arc Magique, augmentant légèrement ses dégâts de base.

