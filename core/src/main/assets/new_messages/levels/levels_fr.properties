levels.templechambers.confusionchamber$confusionvent.name=évent de gaz confusionnant
levels.templechambers.confusionchamber$confusionvent.desc=Un aventurier imprudent a dû déclencher ce piège il y a bien longtemps. Malgré son état inactif, il continue de cracher du gaz de confusion dans la pièce sans montrer de signe d'arrêt. Tu auras besoin d'un moyen d'éviter les dégâts du gaz si tu veux explorer cette pièce.

