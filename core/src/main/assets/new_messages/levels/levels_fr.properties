levels.templelastlevel$sentry.name=Tourelle de guet bleue
levels.templelastlevel$sentry.desc=Cette tourelle de guet bleue semble avoir été installée pour garder des trésors importants dans cette chambre. Si tu entres dans la zone surveillée par la tourelle, elle émettra un faible rayon de désintégration vers toi.\n\nLa tourelle est immunisée contre tous les effets néfastes et peut détecter les ennemis invisibles, mais elle met un peu de temps avant de commencer à tirer.\n\nC'est comme si les créatures du donjon savaient qu'elles ne représentent pas une menace pour le trésor ; la tourelle semble te cibler uniquement toi.
levels.templelastlevel$spawner.name=Tourelle de guet jaune
levels.templelastlevel$spawner.desc=Cette tourelle de guet jaune semble avoir été installée pour garder des trésors importants dans cette chambre. Cette tourelle envoie périodiquement des alertes au quartier général pour appeler des gardes, et si tu entres dans la zone qu'elle surveille, elle appellera des gardes encore plus vite.\n\nLa tourelle est immunisée contre tous les effets néfastes et ne peut pas être attaquée.\n\nIl vaudrait mieux quitter cet endroit rapidement pour éviter un combat prolongé...

