name: Build Joseph Pixel Dungeon for Android

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Give Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Build Android APKs
        run: ./gradlew :android:assembleDebug :android:assembleRelease --no-daemon

      - name: Show generated APKs
        run: |
          echo "APK files generated:"
          find android/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Joseph-Pixel-Dungeon-Android
          path: android/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
